        function drawAll() {
            if (!simData) return;
            // 1. 기존 선 렌더링
            renderContours(activeContours, simCtx);
            // 2. 추가된 도형 렌더링
            renderShapes(shapes, simCtx);
        }

        function renderContours(contours, ctx) {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            if (!simData) return;
            drawContoursOnly(contours, ctx);
        }

        function drawContoursOnly(contours, ctx) {
            const scale = Math.min(ctx.canvas.width / simData.width, ctx.canvas.height / simData.height);
            const offsetX = (ctx.canvas.width - simData.width * scale) / 2;
            const offsetY = (ctx.canvas.height - simData.height * scale) / 2;

            ctx.strokeStyle = "#4a90e2";
            ctx.lineWidth = (lastInputMode === 'drawing') ? 5 : 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            contours.forEach(contour => {
                if (!contour || contour.length === 0) return;
                ctx.beginPath();
                ctx.moveTo(contour[0].x * scale + offsetX, contour[0].y * scale + offsetY);
                for (let i = 1; i < contour.length; i++) {
                    ctx.lineTo(contour[i].x * scale + offsetX, contour[i].y * scale + offsetY);
                }
                ctx.stroke();
            });
        }

        function renderShapes(shapesList, ctx) {
            if (!simData) return;
            const scale = Math.min(ctx.canvas.width / simData.width, ctx.canvas.height / simData.height);
            const offsetX = (ctx.canvas.width - simData.width * scale) / 2;
            const offsetY = (ctx.canvas.height - simData.height * scale) / 2;

            shapesList.forEach(s => {
                const sx = s.x * scale + offsetX;
                const sy = s.y * scale + offsetY;
                const sw = s.w * scale;
                const sh = s.h * scale;

                ctx.lineWidth = 3;
                ctx.strokeStyle = "#4a90e2";
                ctx.fillStyle = "rgba(74, 144, 226, 0.05)";

                ctx.beginPath();
                if (s.type === 'rect') {
                    ctx.rect(sx, sy, sw, sh);
                    ctx.stroke();
                    ctx.fill();
                } else if (s.type === 'circle') {
                    const rx = Math.abs(sw / 2);
                    const ry = Math.abs(sh / 2);
                    ctx.ellipse(sx + sw / 2, sy + sh / 2, rx, ry, 0, 0, 2 * Math.PI);
                    ctx.stroke();
                    ctx.fill();
                } else if (s.type === 'triangle') {
                    ctx.moveTo(sx + sw / 2, sy);
                    ctx.lineTo(sx + sw, sy + sh);
                    ctx.lineTo(sx, sy + sh);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.fill();
                } else if (s.type === 'line') {
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + sw, sy + sh);
                    ctx.stroke();
                }

                // 선택 영역 활성화 점선 가이드 상자 및 조절자
                if (selectedShape && selectedShape.id === s.id) {
                    ctx.save();
                    ctx.strokeStyle = "#ff4d4f";
                    ctx.lineWidth = 1;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(sx - 4, sy - 4, sw + 8, sh + 8);
                    ctx.restore();

                    ctx.fillStyle = "#ff4d4f";
                    const handles = [
                        { x: sx, y: sy },
                        { x: sx + sw, y: sy },
                        { x: sx + sw, y: sy + sh },
                        { x: sx, y: sy + sh }
                    ];
                    handles.forEach(h => {
                        ctx.fillRect(h.x - 5, h.y - 5, 10, 10);
                    });
                }
            });
        }

        function checkShapeHit(clickX, clickY) {
            if (!simData) return null;
            const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
            const offsetX = (simCanvas.width - simData.width * scale) / 2;
            const offsetY = (simCanvas.height - simData.height * scale) / 2;

            if (selectedShape) {
                const s = selectedShape;
                const sx = s.x * scale + offsetX;
                const sy = s.y * scale + offsetY;
                const sw = s.w * scale;
                const sh = s.h * scale;

                const handles = [
                    { x: sx, y: sy },
                    { x: sx + sw, y: sy },
                    { x: sx + sw, y: sy + sh },
                    { x: sx, y: sy + sh }
                ];
                for (let i = 0; i < handles.length; i++) {
                    if (Math.hypot(clickX - handles[i].x, clickY - handles[i].y) < 12) {
                        dragMode = 'resize';
                        resizeHandleIdx = i;
                        return selectedShape;
                    }
                }
            }

            for (let i = shapes.length - 1; i >= 0; i--) {
                const s = shapes[i];
                const sx = s.x * scale + offsetX;
                const sy = s.y * scale + offsetY;
                const sw = s.w * scale;
                const sh = s.h * scale;

                const minX = Math.min(sx, sx + sw);
                const maxX = Math.max(sx, sx + sw);
                const minY = Math.min(sy, sy + sh);
                const maxY = Math.max(sy, sy + sh);

                if (clickX >= minX - 10 && clickX <= maxX + 10 && clickY >= minY - 10 && clickY <= maxY + 10) {
                    dragMode = 'move';
                    return s;
                }
            }
            return null;
        }

        function addShape(type) {
            if (!simData) return;
            setEditTool('shape');

            const defaultW = 80;
            const defaultH = 80;
            const defaultX = (simData.width - defaultW) / 2;
            const defaultY = (simData.height - defaultH) / 2;

            shapeIdCounter++;
            const newShape = {
                id: shapeIdCounter,
                type: type,
                x: defaultX,
                y: defaultY,
                w: defaultW,
                h: defaultH
            };

            shapes.push(newShape);
            selectedShape = newShape;
            updateDeleteBar();

            // 도형 추가 후 서브 팝업 메뉴만 닫고, 도형 조작(크기/위치 이동) 상태 유지
            const sPanel = document.getElementById('shape-picker-panel');
            if (sPanel) {
                sPanel.classList.remove('show');
                sPanel.style.display = 'none';
            }
            const popupTray = document.getElementById('popup-tray');
            if (popupTray) popupTray.classList.remove('has-popup');

            drawAll();
        }

        function deleteSelectedShape() {
            if (selectedShape) {
                shapes = shapes.filter(s => s.id !== selectedShape.id);
                selectedShape = null;
                updateDeleteBar();
                drawAll();
            } else {
                alert("삭제할 도형을 먼저 선택해 주세요.");
            }
        }

        function convertShapesToContours() {
            // shapeToContour()와 동일한 밀집 샘플링으로 변환 (지우개 부분 지우기 호환)
            const output = [];
            shapes.forEach(s => {
                const pts = shapeToContour(s); // 80분할 밀집 샘플링 재사용
                if (pts.length > 1) {
                    output.push(pts);
                }
            });
            return output;
        }

        function startEditing() {
            if (!simData) return;
            if (animationId) skipSimulation();

            // 1. 현재 벡터 데이터를 딥카피하여 수정용 배열로 준비
            activeContours = JSON.parse(JSON.stringify(simData.contours));
            shapes = [];
            selectedShape = null;

            // 2. 화면 초기화 후 현재 벡터 렌더링
            inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
            drawAll();

            setMode('editing');
        }

        async function confirmEditing() {
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            // 도형 변환 병합
            const shapesContours = convertShapesToContours();
            activeContours = activeContours.concat(shapesContours);
            shapes = [];
            selectedShape = null;

            // 길이가 2 미만인 점들은 무시
            simData.contours = activeContours.filter(c => c.length > 1);

            try {
                // 이미지를 다시 보내지 않고, 수정된 벡터 데이터를 통해 G-Code만 업데이트
                const response = await fetch('/api/update-gcode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        width: simData.width,
                        height: simData.height,
                        contours: simData.contours
                    })
                });

                const result = await response.json();
                progressBar.style.width = '100%';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 500);

                if (result.status === 'success') {
                    simData.gcode = result.gcode;
                    inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
                    setMode('simulating');
                    skipSimulation(); // 결과 즉시 표시
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                progressContainer.style.display = 'none';
                alert("수정 업데이트 실패: " + err.message);
            }
        }

        async function uploadToQueue() {
            if (!simData || !simData.gcode) {
                alert("전송할 데이터가 없습니다.");
                return;
            }

            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '50%';

            try {
                const response = await fetch('/api/push-task', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        gcode: simData.gcode,
                        contours: simData.contours
                    })
                });

                if (!response.ok) {
                    const errorDetail = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorDetail}`);
                }

                const result = await response.json();

                if (result.status === 'success') {
                    progressBar.style.width = '100%';
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                        alert("ESP32로 전송 준비 완료! (Task ID: " + result.task_id + ")");
                    }, 500);
                } else {
                    throw new Error(result.message || "서버에서 실패 응답을 보냈습니다.");
                }
            } catch (err) {
                progressContainer.style.display = 'none';
                console.error("Upload Error:", err);
                alert("전송 오류: " + err.message);
            }
        }

        async function confirmDrawing() {

            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            // 도형 변환 병합

                        width: simData.width,

                        contours: simData.contours
                    })

                const result = await response.json();

        async function processImage(imageBlob, isDrawing = false) {
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');

            // 프로그레스 바 시작
            progressContainer.style.display = 'block';
            progressBar.style.width = '10%';

            try {
                // 1. 이미지 최적화 (모바일 고화질 대응)
                const optimizedBlob = await resizeImage(imageBlob, 1024);
                progressBar.style.width = '30%';

                const formData = new FormData();
                formData.append('file', optimizedBlob, 'image.jpg');
                formData.append('is_drawing', isDrawing);

                // 가짜 프로그레스 애니메이션
                let progress = 30;
                const progressInterval = setInterval(() => {
                    if (progress < 90) {
                        progress += (90 - progress) * 0.1;
                        progressBar.style.width = progress + '%';
                    }
                }, 200);

                const response = await fetch('/api/process-image', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                clearInterval(progressInterval);
                progressBar.style.width = '100%';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 500);

                if (data.error) throw new Error(data.error);
                if (!data.contours || data.contours.length === 0) {
                    alert("추출된 선이 없습니다. 더 명확하게 그려주세요.");
                    setMode('drawing');
                    return;
                }

                simData = data;
                activeContours = simData.contours; // 추출된 벡터 선을 라이브 펜/지우개 편집 배열과 즉시 동기화
                startSimulation(data);
            } catch (err) {
                progressContainer.style.display = 'none';
                console.error(err);
                alert("처리 중 오류가 발생했습니다: " + err.message);
                setMode('idle');
            }
        }

        // 이미지 크기 조절 함수
        function resizeImage(blob, maxSize) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxSize) {
                            height *= maxSize / width;
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width *= maxSize / height;
                            height = maxSize;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((result) => resolve(result), 'image/jpeg', 0.8);
                };
                img.src = URL.createObjectURL(blob);
            });
        }

        // 이미지 업로드 시에도 호출
        function startUpload() {
            if (fileInput.files[0]) {
                processImage(fileInput.files[0]);
            }
        }

        // 시뮬레이션 로직
        function startSimulation(data) {
            setMode('simulating');
            if (animationId) cancelAnimationFrame(animationId);

            document.getElementById('skip-button').style.display = 'block'; // 시뮬레이션 시작 시 버튼 표시

            const container = document.getElementById('canvas-container');
            if (container) {
                simCanvas.width = container.offsetWidth || 800;
                simCanvas.height = container.offsetHeight || 600;
            }

            // 비율 계산
            const scale = Math.min(simCanvas.width / data.width, simCanvas.height / data.height);
            const offsetX = (simCanvas.width - data.width * scale) / 2;
            const offsetY = (simCanvas.height - data.height * scale) / 2;

            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            simCtx.strokeStyle = "#4a90e2";
            simCtx.lineWidth = (lastInputMode === 'drawing') ? 5 : 2; // 그리기 모드였으면 2배 굵게
            simCtx.lineCap = 'round';
            simCtx.lineJoin = 'round';

            let contourIdx = 0;
            let pointIdx = 0;
            const speed = 30; // 그리기 시뮬레이션 속도 2배 향상 (15 -> 30)

            function animate() {
                if (mode !== 'simulating') return; // 모드가 바뀌면 중단

                if (contourIdx >= data.contours.length) {
                    animationId = null;
                    document.getElementById('skip-button').style.display = 'none'; // 시뮬레이션 완료 시 버튼 숨김
                    return;
                }

                for (let i = 0; i < speed; i++) {
                    if (contourIdx >= data.contours.length) break;

                    const contour = data.contours[contourIdx];
                    if (pointIdx === 0) {
                        simCtx.beginPath();
                        simCtx.moveTo(contour[0].x * scale + offsetX, contour[0].y * scale + offsetY);
                    } else {
                        simCtx.lineTo(contour[pointIdx].x * scale + offsetX, contour[pointIdx].y * scale + offsetY);
                        simCtx.stroke();
                    }

                    pointIdx++;
                    if (pointIdx >= contour.length) {
                        contourIdx++;
                        pointIdx = 0;
                    }
                }
                animationId = requestAnimationFrame(animate);
            }
            animationId = requestAnimationFrame(animate);
        }

        function skipSimulation() {
            if (animationId) cancelAnimationFrame(animationId);
            const data = simData;
            if (!data) return;

            const scale = Math.min(simCanvas.width / data.width, simCanvas.height / data.height);
            const offsetX = (simCanvas.width - data.width * scale) / 2;
            const offsetY = (simCanvas.height - data.height * scale) / 2;

            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            simCtx.strokeStyle = "#4a90e2";
            simCtx.lineWidth = (lastInputMode === 'drawing') ? 5 : 2; // 스킵 시에도 동일 적용

            data.contours.forEach(contour => {
                simCtx.beginPath();
                simCtx.moveTo(contour[0].x * scale + offsetX, contour[0].y * scale + offsetY);
                for (let i = 1; i < contour.length; i++) {
                    simCtx.lineTo(contour[i].x * scale + offsetX, contour[i].y * scale + offsetY);
                }
                simCtx.stroke();
            });
            animationId = null;
            document.getElementById('skip-button').style.display = 'none'; // 스킵 시 버튼 숨김
        }

        function cancelSimulation() {
            if (animationId) cancelAnimationFrame(animationId);
            animationId = null;
        }
    </script>
</body>
