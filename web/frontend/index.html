        // 카드 순서 저장/조회
        function getTaskOrder() {
            const data = localStorage.getItem('vico_task_order');
            return data ? JSON.parse(data) : [];
        }

        function saveTaskOrder(orderArr) {
            localStorage.setItem('vico_task_order', JSON.stringify(orderArr));
        }

        // 실시간 상태 목록 렌더링 (시안 4번 스타일)
        function renderStatusList(tasks) {
            const container = document.getElementById('history-card-list');
            if (!container) return;

            // 태스크 캐시 저장 (별표 즉시 복원용)
            cachedTasks = tasks;

            if (tasks.length === 0) {
                container.innerHTML = `<div style="color: #94a3b8; text-align: center; padding: 30px 0; font-size: 0.9rem;">전송된 작업이 없습니다</div>`;
                return;
            }

            // 사용자 지정 순서 정렬
            const savedOrder = getTaskOrder();
            if (savedOrder.length > 0) {
                tasks.sort((a, b) => {
                    const idxA = savedOrder.indexOf(a.task_id);
                    const idxB = savedOrder.indexOf(b.task_id);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return 0;
                });
            }

            const savedList = getLocalSavedDrawings();
            const customNames = getTaskCustomNames();

            container.innerHTML = tasks.map(task => {
                let badgeHtml = '';
                if (task.status === 'pending') {
                    badgeHtml = `<span class="badge-pending">대기 중</span>`;
                } else if (task.status === 'drawing') {
                    badgeHtml = `<span class="badge-pending" style="background:#e0f2fe; color:#0284c7;">출력 중</span>`;
                } else if (task.status === 'complete') {
                    badgeHtml = `<span class="badge-success">출력 완료</span>`;
                } else {
                    badgeHtml = `<span class="badge-error">오류</span>`;
                }

                const encodedContour = encodeURIComponent(JSON.stringify(task.contours));
                const isSaved = savedList.some(item => item.server_task_id === task.task_id);
                const starAction = isSaved
                    ? `onclick="unsaveTaskFromServer(event, ${task.task_id})"`
                    : `onclick="saveTaskToLocal(event, ${task.task_id}, '${encodedContour}')"`;

                const displayName = customNames[task.task_id] || `#${task.task_id}`;

                return `
                    <div class="history-card" data-task-id="${task.task_id}" draggable="false">
                        <div class="history-card-left">
                            <div class="drag-handle" title="드래그하여 순서 변경">⋮⋮</div>
                            <div class="history-thumb-box">
                                <canvas class="thumb-canvas-svr-${task.task_id}" width="70" height="56" style="width:70px;height:56px;display:block;"></canvas>
                            </div>
                            <div class="history-info">
                                <div class="history-info-top">
                                    <span class="task-num" id="task-name-${task.task_id}">${displayName}</span>
                                    ${badgeHtml}
                                </div>
                                <span class="task-date">생성일 2026.08.13</span>
                            </div>
                        </div>
                        <div class="history-actions">
                            <button class="star-btn ${isSaved ? 'active' : ''}" ${starAction} title="${isSaved ? '보관됨' : '보관'}">${isSaved ? '★' : '☆'}</button>
                            <button class="more-btn" onclick="toggleCardMenu(event, ${task.task_id})" title="메뉴">⋮</button>

                            <!-- 삼선 팝업 메뉴 -->
                            <div class="card-menu-popover" id="card-menu-${task.task_id}">
                                <button class="card-menu-item" onclick="renameTask(event, ${task.task_id})">
                                    <span>✏️</span> 이름 변경
                                </button>
                                <button class="card-menu-item danger" onclick="deleteServerTask(event, ${task.task_id})">
                                    <span>🗑️</span> 삭제
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // 드래그 앤 드롭 이벤트 바인딩
            initCardDragAndDrop(container);

            setTimeout(() => {
                tasks.forEach(task => {
                    const canvas = document.querySelector(`.thumb-canvas-svr-${task.task_id}`);
                    if (canvas) {
                        const w = simData ? simData.width : simCanvas.width;
                        const h = simData ? simData.height : simCanvas.height;
                        drawThumb(canvas, task.contours, w, h);
                    }
                });
            }, 50);
        }

        // 내 그림 카드 순서 변경 핸들러 (길게 누를 때만 드래그 활성화 - 마우스/터치 동일)
        function initCardDragAndDrop(container) {
            const cards = container.querySelectorAll('.history-card');
            let draggedCard = null;

            cards.forEach(card => {
                let longPressTimer = null;
                let isDragReady = false;

                function activateDrag() {
                    isDragReady = true;
                    card.setAttribute('draggable', 'true');
                    card.style.transform = 'scale(0.97)';
                    card.style.boxShadow = '0 8px 24px rgba(99, 102, 241, 0.35)';
                    card.style.borderColor = '#6366f1';
                    if (navigator.vibrate) navigator.vibrate(30);
                }

                function cancelLongPress() {
                    clearTimeout(longPressTimer);
                    isDragReady = false;
                }

                function resetCard() {
                    clearTimeout(longPressTimer);
                    isDragReady = false;
                    if (!draggedCard) {
                        card.setAttribute('draggable', 'false');
                        card.style.transform = '';
                        card.style.boxShadow = '';
                        card.style.borderColor = '';
                    }
                }

                const handle = card.querySelector('.drag-handle');

                // 마우스: drag-handle은 즉시, 나머지는 500ms
                card.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    if (handle && handle.contains(e.target)) {
                        activateDrag(); // 핸들 클릭 시 즉시 드래그 활성화
                    } else {
                        longPressTimer = setTimeout(activateDrag, 500);
                    }
                });
                card.addEventListener('mouseup', resetCard);
                card.addEventListener('mouseleave', (e) => {
                    if (!draggedCard) cancelLongPress();
                });

                // 터치: drag-handle은 즉시, 나머지는 500ms
                card.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    const target = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (handle && handle.contains(target)) {
                        activateDrag(); // 핸들 터치 시 즉시 드래그 활성화
                    } else {
                        longPressTimer = setTimeout(activateDrag, 500);
                    }
                }, { passive: true });
                card.addEventListener('touchend', resetCard);
                card.addEventListener('touchmove', () => {
                    if (!isDragReady) cancelLongPress();
                }, { passive: true });

                card.addEventListener('dragstart', (e) => {
                    if (!isDragReady) {
                        e.preventDefault();
                        return;
                    }
                    draggedCard = card;
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    card.setAttribute('draggable', 'false');
                    card.style.transform = '';
                    card.style.boxShadow = '';
                    card.style.borderColor = '';
                    isDragReady = false;
                    draggedCard = null;
                    const newOrder = Array.from(container.querySelectorAll('.history-card'))
                        .map(el => parseInt(el.getAttribute('data-task-id')));
                    saveTaskOrder(newOrder);
                });

                card.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (!draggedCard || draggedCard === card) return;
                    const rect = card.getBoundingClientRect();
                    const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                    container.insertBefore(draggedCard, next ? card.nextSibling : card);
                });
            });
        }

        // 메뉴 토글 함수
        function toggleMenu(e) {
            e.stopPropagation();
            const willShow = !menuDropdown.classList.contains('show');
            menuDropdown.classList.toggle('show');
            eraserSizeMenu.classList.remove('show');

            if (willShow) {
                fetchTasksStatus();
                renderSavedList();
                if (!statusPollInterval) {
                    statusPollInterval = setInterval(fetchTasksStatus, 3000);
                }
            } else {
                if (statusPollInterval) {
                    clearInterval(statusPollInterval);
                    statusPollInterval = null;
                }
            }
        }

        // 외부 클릭 시 메뉴 및 카드 팝업 닫기
        window.addEventListener('click', () => {
            document.querySelectorAll('.card-menu-popover').forEach(el => el.classList.remove('show'));
            menuDropdown.classList.remove('show');
            eraserSizeMenu.classList.remove('show');
            const sm = document.getElementById('shape-select-menu');
            if (sm) sm.classList.remove('show');
            if (statusPollInterval) {
                clearInterval(statusPollInterval);
                statusPollInterval = null;
            }
        });

        // 서버 대기열 초기화 함수
        async function clearServerQueue() {
            const ok = await showConfirm('별표(★) 보관된 그림을 제외하고 전체 삭제하시겠습니까?', true);
            if (!ok) return;

            try {
                const savedList = getLocalSavedDrawings();
                const savedIds = savedList.map(item => item.server_task_id).filter(id => id !== undefined);

                const response = await fetch('/api/clear-task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ saved_ids: savedIds })
                });

                if (!response.ok) {
                    const errorMsg = await response.text();
                    throw new Error(`서버 응답 오류 (${response.status}): ${errorMsg}`);
                }

                const result = await response.json();
                if (result.status === 'success') {
                    await showAlert(result.message || '삭제 완료!');
                    fetchTasksStatus();
                } else {
                    throw new Error(result.message || '삭제 실패');
                }
            } catch (err) {
                console.error('Clear Task Error:', err);
                await showAlert('삭제 중 오류가 발생했습니다: ' + err.message);
            }
        }

        // 서버 개별 태스크 삭제 함수
        async function deleteServerTask(event, taskId) {
            event.stopPropagation();
            const menu = document.getElementById(`card-menu-${taskId}`);
            if (menu) menu.classList.remove('show');

            const ok = await showConfirm(`그림 #${taskId}를 삭제할까요?`, true);
            if (!ok) return;

            try {
                const response = await fetch(`/api/delete-task?task_id=${taskId}`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    const errorMsg = await response.text();
                    throw new Error(`서버 응답 오류 (${response.status}): ${errorMsg}`);
                }

                const result = await response.json();
                if (result.status === 'success') {
                    fetchTasksStatus();
                } else {
                    throw new Error(result.message || '삭제 실패');
                }
            } catch (err) {
                console.error('Delete Task Error:', err);
                await showAlert('삭제 중 오류가 발생했습니다: ' + err.message);
            }
        }

        // 초기화 및 캔버스 설정
        function initCanvas() {
            const container = document.getElementById('canvas-container');
            if (container) {
                inputCanvas.width = container.offsetWidth || 800;
                inputCanvas.height = container.offsetHeight || 600;
                simCanvas.width = container.offsetWidth || 800;
                simCanvas.height = container.offsetHeight || 600;
            }

            inputCtx.lineCap = 'round';
            inputCtx.lineJoin = 'round';
            inputCtx.lineWidth = 3;
            inputCtx.strokeStyle = '#000';
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();

        if (workArea) {
            workArea.addEventListener('click', (e) => {
                if (e.target.closest('#skip-button')) return;
                if (mode === 'idle' || mode === 'uploaded') {
                    fileInput.click();
                }
            });
        }

        // 그리기 로직 (마우스)
        inputCanvas.addEventListener('mousedown', startDrawing);
        inputCanvas.addEventListener('mousemove', (e) => {
            drawEraserCursor(e);
            draw(e);
        });
        inputCanvas.addEventListener('mouseup', stopDrawing);
        inputCanvas.addEventListener('mouseleave', (e) => {
            clearEraserCursor();
            stopDrawing(e);
        });

        // 그리기 로직 (터치 - 모바일 지원)
        inputCanvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        inputCanvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        inputCanvas.addEventListener('touchend', stopDrawing);

        function getTouchPos(touchEvent) {
            const rect = inputCanvas.getBoundingClientRect();
            return {
                x: (touchEvent.touches[0].clientX - rect.left) * (inputCanvas.width / rect.width),
                y: (touchEvent.touches[0].clientY - rect.top) * (inputCanvas.height / rect.height)
            };
        }

        // 지우개 커서 원형 미리보기
        let eraserCursorPos = null;
        let lastCanvasPos = null;

        function drawEraserCursor(e) {
            if (activeTool !== 'eraser' || (mode !== 'editing' && mode !== 'drawing')) {
                clearEraserCursor();
                return;
            }
            const pos = getMousePos(e);
            eraserCursorPos = pos;
            renderEraserCursorAt(pos.x, pos.y);
        }

        function clearEraserCursor() {
            eraserCursorPos = null;
            // isDrawing 중이 아닐 때만 inputCtx 지움
            if (!isDrawing) {
                inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
            }
        }

        function renderEraserCursorAt(x, y) {
            inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
            inputCtx.save();
            inputCtx.beginPath();
            inputCtx.arc(x, y, currentEraseRadius, 0, 2 * Math.PI);
            inputCtx.fillStyle = 'rgba(255, 77, 79, 0.12)';
            inputCtx.fill();
            inputCtx.strokeStyle = 'rgba(255, 77, 79, 0.55)';
            inputCtx.lineWidth = 1.5;
            inputCtx.setLineDash([4, 3]);
            inputCtx.stroke();
            inputCtx.setLineDash([]);
            inputCtx.restore();
        }

        function getMousePos(e) {
            const rect = inputCanvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (inputCanvas.width / rect.width),
                y: (e.clientY - rect.top) * (inputCanvas.height / rect.height)
            };
        }

        function toSimCoords(x, y) {
            const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
            const offsetX = (simCanvas.width - simData.width * scale) / 2;
            const offsetY = (simCanvas.height - simData.height * scale) / 2;
            return {
                x: (x - offsetX) / scale,
                y: (y - offsetY) / scale
            };
        }

        function handleTouchStart(e) {
            if (mode !== 'drawing' && mode !== 'editing') return;
            e.preventDefault();
            const pos = getTouchPos(e);
            startDrawingAt(pos.x, pos.y);
        }

        function handleTouchMove(e) {
            if (!isDrawing || (mode !== 'drawing' && mode !== 'editing')) return;
            e.preventDefault();
            const pos = getTouchPos(e);
            drawTo(pos.x, pos.y);
        }

        function startDrawing(e) {
            if (mode !== 'drawing' && mode !== 'editing') return;
            const pos = getMousePos(e);
            startDrawingAt(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            drawTo(pos.x, pos.y);
        }

        function startDrawingAt(x, y) {
            isDrawing = true;

            if (mode === 'editing' || mode === 'drawing') {
                const pos = toSimCoords(x, y);

                // activeTool === 'shape' 모드일 때만 도형 클릭/드래그 선택 허용
                if (activeTool === 'shape') {
                    const hit = checkShapeHit(x, y);
                    if (hit) {
                        selectedShape = hit;
                        if (dragMode === 'delete_btn') {
                            deleteSelectedShape();
                            return;
                        }
                        // 도형 각 코너의 시뮬레이션(월드) 좌표 계산 함수
                        const getSimCorner = (s, lx, ly) => {
                            const cx = s.x + s.w / 2;
                            const cy = s.y + s.h / 2;
                            const dx = s.x + lx - cx;
                            const dy = s.y + ly - cy;
                            const r = (s.rotation || 0) * Math.PI / 180;
                            return {
                                x: cx + dx * Math.cos(r) - dy * Math.sin(r),
                                y: cy + dx * Math.sin(r) + dy * Math.cos(r)
                            };
                        };

                        // 잡은 모서리 핸들의 대각선 반대쪽 꼭짓점을 고정점(anchor)으로 설정
                        let anchor = { x: hit.x, y: hit.y };
                        if (dragMode === 'resize') {
                            if (resizeHandleIdx === 0) {       // Top-Left (0, 0) 잡음 -> Anchor: Bottom-Right (w, h)
                                anchor = getSimCorner(hit, hit.w, hit.h);
                            } else if (resizeHandleIdx === 1) { // Top-Right (w, 0) 잡음 -> Anchor: Bottom-Left (0, h)
                                anchor = getSimCorner(hit, 0, hit.h);
                            } else if (resizeHandleIdx === 2) { // Bottom-Right (w, h) 잡음 -> Anchor: Top-Left (0, 0)
                                anchor = getSimCorner(hit, 0, 0);
                            } else if (resizeHandleIdx === 3) { // Bottom-Left (0, h) 잡음 -> Anchor: Top-Right (w, 0)
                                anchor = getSimCorner(hit, hit.w, 0);
                            }
                        }

                        dragStartPos = {
                            x: x,
                            y: y,
                            shapeX: hit.x,
                            shapeY: hit.y,
                            shapeW: hit.w,
                            shapeH: hit.h,
                            anchor: anchor
                        };
                        updateDeleteBar();
                        drawAll();
                        return;
                    } else {
                        // 허공 클릭 시 선택 해제하되 도형 모드 유지 (펜 모드로 자동 전환되지 않음)
                        selectedShape = null;
                        updateDeleteBar();
                        drawAll();
                        return;
                    }
                }

                if (activeTool === 'pen') {
                    selectedShape = null;
                    updateDeleteBar();
                    drawAll();

                    currentContour = [pos];
                    lastCanvasPos = { x: x, y: y };

                    inputCtx.beginPath();
                    inputCtx.moveTo(x, y);
                    inputCtx.strokeStyle = "#4a90e2";
                    inputCtx.lineWidth = 3.5;
                    inputCtx.lineCap = 'round';
                    inputCtx.lineJoin = 'round';
                } else if (activeTool === 'eraser') {
                    saveHistoryState(); // 지우개 시작 시 히스토리 1회 기록
                    selectedShape = null;
                    updateDeleteBar();
                    eraseAt(pos);
                }
            }
        }

        function drawTo(x, y) {
            if (mode === 'editing' || mode === 'drawing') {
                const pos = toSimCoords(x, y);

                if (activeTool === 'shape' && selectedShape && dragStartPos) {
                    const dx = x - dragStartPos.x;
                    const dy = y - dragStartPos.y;
                    const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
                    const simDx = dx / scale;
                    const simDy = dy / scale;

                    if (dragMode === 'move') {
                        selectedShape.x = dragStartPos.shapeX + simDx;
                        selectedShape.y = dragStartPos.shapeY + simDy;
                    } else if (dragMode === 'rotate') {
                        const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
                        const offsetX = (simCanvas.width - simData.width * scale) / 2;
                        const offsetY = (simCanvas.height - simData.height * scale) / 2;
                        const cx = (selectedShape.x + selectedShape.w / 2) * scale + offsetX;
                        const cy = (selectedShape.y + selectedShape.h / 2) * scale + offsetY;
                        // 중심점과 현재 좌표 간 각도 계산 (+90도로 상단 방향 정렬)
                        const rad = Math.atan2(y - cy, x - cx);
                        let deg = rad * (180 / Math.PI) + 90;
                        selectedShape.rotation = (deg % 360 + 360) % 360;
                    } else if (dragMode === 'resize') {
                        // 완벽한 Anchor(월드 고정점) 기반 2D 변환 리사이즈
                        const anchor = dragStartPos.anchor; // 월드(Sim) 좌표계 고정점
                        const rad = (selectedShape.rotation || 0) * Math.PI / 180;

                        // Anchor -> 현재 마우스(pos) 로 가는 월드 벡터
                        const V_world = { x: pos.x - anchor.x, y: pos.y - anchor.y };

                        // -rad 회전하여 Anchor 기준 로컬 벡터로 변환
                        const cos_r = Math.cos(-rad);
                        const sin_r = Math.sin(-rad);
                        const V_local = {
                            x: V_world.x * cos_r - V_world.y * sin_r,
                            y: V_world.x * sin_r + V_world.y * cos_r
                        };

                        // Anchor 위치 기준 새로운 Width, Height 구하기
                        let newW = dragStartPos.shapeW;
                        let newH = dragStartPos.shapeH;
                        let newAnchorLocal = { x: 0, y: 0 };

                        if (resizeHandleIdx === 0) {       // Top-Left 잡음 (Anchor: Bottom-Right w, h)
                            newW = Math.max(15, -V_local.x);
                            newH = Math.max(15, -V_local.y);
                            newAnchorLocal = { x: newW, y: newH };
                        } else if (resizeHandleIdx === 1) { // Top-Right 잡음 (Anchor: Bottom-Left 0, h)
                            newW = Math.max(15, V_local.x);
                            newH = Math.max(15, -V_local.y);
                            newAnchorLocal = { x: 0, y: newH };
                        } else if (resizeHandleIdx === 2) { // Bottom-Right 잡음 (Anchor: Top-Left 0, 0)
                            newW = Math.max(15, V_local.x);
                            newH = Math.max(15, V_local.y);
                            newAnchorLocal = { x: 0, y: 0 };
                        } else if (resizeHandleIdx === 3) { // Bottom-Left 잡음 (Anchor: Top-Right w, 0)
                            newW = Math.max(15, -V_local.x);
                            newH = Math.max(15, V_local.y);
                            newAnchorLocal = { x: newW, y: 0 };
                        }

                        const offset_local = {
                            x: newW / 2 - newAnchorLocal.x,
                            y: newH / 2 - newAnchorLocal.y
                        };

                        // +rad 회전하여 월드 오프셋 벡터로 변환
                        const cosA = Math.cos(rad);
                        const sinA = Math.sin(rad);
                        const offset_world = {
                            x: offset_local.x * cosA - offset_local.y * sinA,
                            y: offset_local.x * sinA + offset_local.y * cosA
                        };

                        // 새 도형의 월드 중심
                        const newCenter_world = {
                            x: anchor.x + offset_world.x,
                            y: anchor.y + offset_world.y
                        };

                        // 새 도형의 월드 좌상단(origin x, y) 결정
                        selectedShape.x = newCenter_world.x - newW / 2;
                        selectedShape.y = newCenter_world.y - newH / 2;
                        selectedShape.w = newW;
                        selectedShape.h = newH;
                    }
                    updateDeleteBar();
                    drawAll();
                    return;
                }

                if (activeTool === 'pen' && currentContour) {
                    const lastPt = currentContour[currentContour.length - 1];
                    if (lastPt) {
                        const dist = Math.hypot(pos.x - lastPt.x, pos.y - lastPt.y);
                        // 4px 미만 이동은 손떨림으로 무시하여 선을 매우 부드럽게 유지
                        if (dist < 4) return;

                        // 로패스 가우시안 필터링 (alpha=0.35) 부드러운 호 그리기
                        const alpha = 0.35;
                        const smoothed = {
                            x: lastPt.x + (pos.x - lastPt.x) * alpha,
                            y: lastPt.y + (pos.y - lastPt.y) * alpha
                        };

                        currentContour.push(smoothed);
                        // 화면 픽셀 복원 렌더링
                        const scale = Math.min(inputCanvas.width / simData.width, inputCanvas.height / simData.height);
                        const offX = (inputCanvas.width - simData.width * scale) / 2;
                        const offY = (inputCanvas.height - simData.height * scale) / 2;

                        // 커브 곡선 보정 (quadraticCurveTo)
                        const prevPt = currentContour[currentContour.length - 2] || lastPt;
                        const midX = (prevPt.x + smoothed.x) / 2 * scale + offX;
                        const midY = (prevPt.y + smoothed.y) / 2 * scale + offY;
                        const prevX = prevPt.x * scale + offX;
                        const prevY = prevPt.y * scale + offY;

                        inputCtx.quadraticCurveTo(prevX, prevY, midX, midY);
                        inputCtx.stroke();
                    }
                } else if (activeTool === 'eraser') {
                    eraseAt(pos);
                    renderEraserCursorAt(x, y);
                }
            }
        }

        // 도형을 촘촘한 벡터 점으로 변환 (지우개 처리 및 G-code 변환용, 회전 반영)
        function shapeToContour(s) {
            const rawPts = [];
            const SEG = 80; // 분할 수
            if (s.type === 'rect') {
                const n = Math.ceil(SEG / 4);
                for (let i = 0; i <= n; i++) rawPts.push({ x: s.x + s.w * i / n, y: s.y });
                for (let i = 1; i <= n; i++) rawPts.push({ x: s.x + s.w, y: s.y + s.h * i / n });
                for (let i = 1; i <= n; i++) rawPts.push({ x: s.x + s.w - s.w * i / n, y: s.y + s.h });
                for (let i = 1; i <= n; i++) rawPts.push({ x: s.x, y: s.y + s.h - s.h * i / n });
            } else if (s.type === 'circle') {
                const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
                const rx = Math.abs(s.w / 2), ry = Math.abs(s.h / 2);
                for (let i = 0; i <= SEG; i++) {
                    const rad = (i / SEG) * 2 * Math.PI;
                    rawPts.push({ x: cx + rx * Math.cos(rad), y: cy + ry * Math.sin(rad) });
                }
            } else if (s.type === 'triangle') {
                const n = Math.ceil(SEG / 3);
                const p1 = { x: s.x + s.w / 2, y: s.y };
                const p2 = { x: s.x + s.w, y: s.y + s.h };
                const p3 = { x: s.x, y: s.y + s.h };
                for (let i = 0; i < n; i++) { const t = i / n; rawPts.push({ x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t }); }
                for (let i = 0; i < n; i++) { const t = i / n; rawPts.push({ x: p2.x + (p3.x - p2.x) * t, y: p2.y + (p3.y - p2.y) * t }); }
                for (let i = 0; i <= n; i++) { const t = i / n; rawPts.push({ x: p3.x + (p1.x - p3.x) * t, y: p3.y + (p1.y - p3.y) * t }); }
            } else if (s.type === 'line') {
                for (let i = 0; i <= SEG; i++) {
                    rawPts.push({ x: s.x + s.w * i / SEG, y: s.y + s.h * i / SEG });
                }
            }

            // 회전 각도가 적용된 최종 점 좌표 계산
            const angle = (s.rotation || 0) * Math.PI / 180;
            if (!angle) return rawPts;

            const cx = s.x + s.w / 2;
            const cy = s.y + s.h / 2;
            return rawPts.map(pt => {
                const dx = pt.x - cx;
                const dy = pt.y - cy;
                return {
                    x: cx + dx * Math.cos(angle) - dy * Math.sin(angle),
                    y: cy + dx * Math.sin(angle) + dy * Math.cos(angle)
                };
            });
        }

        // 선택 도형 삭제 버튼 위치 갱신 및 도형 4종 추가 서브메뉴 표시 동기화
        function updateDeleteBar() {
            const btn = document.getElementById('floating-shape-delete-btn');
            const sm = document.getElementById('shape-select-menu');
            if (selectedShape && simData) {
                const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
                const offsetX = (simCanvas.width - simData.width * scale) / 2;
                const offsetY = (simCanvas.height - simData.height * scale) / 2;

                const sx = selectedShape.x * scale + offsetX;
                const sy = selectedShape.y * scale + offsetY;
                const sw = selectedShape.w * scale;
                const sh = selectedShape.h * scale;

                const topY = Math.min(sy, sy + sh);
                const centerX = sx + sw / 2;

                if (btn) {
                    btn.style.left = centerX + 'px';
                    btn.style.top = (topY - 12) + 'px';
                    btn.style.display = 'block';
                }
                if (sm) sm.classList.remove('show');
            } else {
                if (btn) btn.style.display = 'none';
                if (sm) {
                    if (activeTool === 'shape') {
                        sm.classList.add('show');
                    } else {
                        sm.classList.remove('show');
                    }
                }
            }
        }

        // 점 P와 선분 AB 사이의 최단 거리 제곱 계산 함수
        function distToSegmentSquared(p, v, w) {
            const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
            if (l2 === 0) return (p.x - v.x) ** 2 + (p.y - v.y) ** 2;
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return (p.x - (v.x + t * (w.x - v.x))) ** 2 + (p.y - (v.y + t * (w.y - v.y))) ** 2;
        }

        let lastErasePos = null;

        function eraseAt(pos) {
            if (!simData) return;

            const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
            const offsetX = (simCanvas.width - simData.width * scale) / 2;
            const offsetY = (simCanvas.height - simData.height * scale) / 2;

            // 지우개의 실제 화면 픽셀 반경 (+2px 넉넉한 터치 버퍼)
            const rPx = currentEraseRadius + 2;
            const rPxSq = rPx * rPx;

            // 시뮬레이션 좌표 pos를 다시 화면 픽셀 좌표로 변환
            const erasePx = {
                x: pos.x * scale + offsetX,
                y: pos.y * scale + offsetY
            };

            const erasePoints = [erasePx];
            if (lastErasePos) {
                const lastPx = {
                    x: lastErasePos.x * scale + offsetX,
                    y: lastErasePos.y * scale + offsetY
                };
                const dist = Math.hypot(erasePx.x - lastPx.x, erasePx.y - lastPx.y);
                const steps = Math.ceil(dist / Math.max(2, rPx * 0.5));
                for (let i = 1; i <= steps; i++) {
                    const t = i / steps;
                    erasePoints.push({
                        x: lastPx.x + (erasePx.x - lastPx.x) * t,
                        y: lastPx.y + (erasePx.y - lastPx.y) * t
                    });
                }
            }
            lastErasePos = pos;

            // 1. 선(contour) 지우기 (화면 픽셀 좌표 기준 정밀 판단)
            let newContours = [];
            let erased = false;

            for (let contour of activeContours) {
                if (!contour || contour.length === 0) continue;
                let currentChunk = [];

                for (let i = 0; i < contour.length; i++) {
                    const pt = contour[i];
                    const ptPx = {
                        x: pt.x * scale + offsetX,
                        y: pt.y * scale + offsetY
                    };
                    const prevPt = contour[i - 1] || pt;
                    const prevPtPx = {
                        x: prevPt.x * scale + offsetX,
                        y: prevPt.y * scale + offsetY
                    };
                    const nextPt = contour[i + 1] || pt;
                    const nextPtPx = {
                        x: nextPt.x * scale + offsetX,
                        y: nextPt.y * scale + offsetY
                    };

                    let isHit = false;
                    for (const ePos of erasePoints) {
                        const d1Sq = distToSegmentSquared(ePos, prevPtPx, ptPx);
                        const d2Sq = distToSegmentSquared(ePos, ptPx, nextPtPx);
                        if (Math.min(d1Sq, d2Sq) <= rPxSq) {
                            isHit = true;
                            break;
                        }
                    }

                    if (!isHit) {
                        currentChunk.push(pt);
                    } else {
                        erased = true;
                        if (currentChunk.length > 0) {
                            newContours.push(currentChunk);
                            currentChunk = [];
                        }
                    }
                }
                if (currentChunk.length > 0) {
                    newContours.push(currentChunk);
                }
            }
            if (erased) {
                activeContours = newContours;
            }

            // 2. 도형(shape) 부분 지우기 - 지우개 원 범위에 드는 점만 지우고 쪼개기
            const newShapes = [];
            let shapeChanged = false;

            for (const s of shapes) {
                // 바운딩 박스로 빠르게 오버랩 점검 (속도 향상)
                const minX = Math.min(s.x, s.x + s.w) - eraseRadius;
                const maxX = Math.max(s.x, s.x + s.w) + eraseRadius;
                const minY = Math.min(s.y, s.y + s.h) - eraseRadius;
                const maxY = Math.max(s.y, s.y + s.h) + eraseRadius;
                const inBox = pos.x >= minX && pos.x <= maxX && pos.y >= minY && pos.y <= maxY;

                if (!inBox) {
                    newShapes.push(s); // 바깥이면 유지
                    continue;
                }

                // 점으로 분산하여 지우개 내부의 영역만 부분 커팅
                const pts = shapeToContour(s);
                let currentChunk = [];
                let shapePartErased = false;

                for (const pt of pts) {
                    const d = Math.hypot(pt.x - pos.x, pt.y - pos.y);
                    if (d > eraseRadius) {
                        currentChunk.push(pt);
                    } else {
                        shapePartErased = true;
                        if (currentChunk.length > 1) {
                            activeContours.push(currentChunk); // 살아남은 조각은 영속적인 펜으로 전송
                        }
                        currentChunk = [];
                    }
                }
                if (currentChunk.length > 1) {
                    activeContours.push(currentChunk);
                }

                if (shapePartErased) {
                    shapeChanged = true;
                    if (selectedShape && selectedShape.id === s.id) {
                        selectedShape = null;
                        updateDeleteBar();
                    }
                    erased = true;
                    // shapes 배열에 추가하지 않고 완전히 쪼개진 벡터 선들로 흡수됨
                } else {
                    newShapes.push(s); // 실제로 지우개에 걸치는 부분이 없으면 유지
                }
            }

            shapes = newShapes;

            if (erased || shapeChanged) {
                drawAll();
            }
        }

        function stopDrawing() {
            lastCanvasPos = null;
            lastErasePos = null;
            const wasDrawingShape = (activeTool === 'shape' && dragMode);
            isDrawing = false;
            if (activeTool === 'shape') {
                if (wasDrawingShape) {
                    saveHistoryState(); // 도형 이동/회전/리사이즈 조작 완료 시 히스토리 저장
                }
                dragMode = null;
                dragStartPos = null;
                return;
            }
            if ((mode === 'editing' || mode === 'drawing') && activeTool === 'pen') {
                if (currentContour && currentContour.length < 2) {
                    currentContour = null;
                } else if (currentContour && currentContour.length >= 2) {
                    activeContours.push(currentContour);
                    currentContour = null;
                    // 성공적으로 한 스트로크를 완주했을 때 최소 단위 히스토리 1회 저장
                    saveHistoryState();
                }
            }
            if (mode === 'editing' || mode === 'drawing') {
                drawAll();
                inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
                // 지우개 커서 포지션이 있으면 재렌더 (손가락을 떼도 원형 미리보기 유지)
                if (activeTool === 'eraser' && eraserCursorPos) {
                    renderEraserCursorAt(eraserCursorPos.x, eraserCursorPos.y);
                }
            } else {
                inputCtx.globalCompositeOperation = 'source-over';
            }
        }

        // 파일 선택 시 이벤트 처리
        fileInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                switchView('workspace'); // 업로드 시 드로잉/시뮬레이션 워크스페이스로 화면 자동 전환
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImage.src = e.target.result;
                    lastInputMode = 'uploaded';
                    // 파일 선택 즉시 서버로 전송하여 처리 및 시뮬레이션 시작
                    processImage(file);
                }
                reader.readAsDataURL(file);
            }
        });

        function setMode(newMode) {
            mode = newMode;
            if (workArea) workArea.className = 'canvas-container';

            // 모드 전환 시 도형 초기화
            shapes = [];
            selectedShape = null;
            updateDeleteBar();

            const btnEdit = document.getElementById('btn-edit-action');
            const btnComplete = document.getElementById('btn-complete-action');
            const toolsRowContainer = document.querySelector('.tools-row-container');
            const btnCanvasUpload = document.getElementById('btn-canvas-upload');

            if (mode === 'simulating') {
                // 완료 후 (시뮬레이션 모드): 도구 행 전체 숨기기 + 수정 버튼 및 전송 버튼 노출
                if (toolsRowContainer) toolsRowContainer.style.display = 'none';
                if (btnCanvasUpload) btnCanvasUpload.style.display = 'none';
                if (btnEdit) btnEdit.style.display = 'block';
                if (btnComplete) {
                    btnComplete.style.display = 'block';
                    btnComplete.textContent = '전송';
                }
            } else {
                // 그리기/편집 중: 도구 행 노출 + 수정 버튼 완전히 숨기기 + 완료 버튼만 노출
                if (toolsRowContainer) toolsRowContainer.style.display = 'flex';
                if (btnCanvasUpload) btnCanvasUpload.style.display = 'flex';
                if (btnEdit) btnEdit.style.display = 'none';
                if (btnComplete) {
                    btnComplete.style.display = 'block';
                    btnComplete.textContent = '완료';
                }
            }

            if (mode === 'idle') {
                resetEditToolsPos();
                previewImage.src = '#';
                inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
                simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
                fileInput.value = '';
                simData = null;
                lastInputMode = 'idle';
            }
            else if (mode === 'uploaded') {
                if (workArea) workArea.classList.add('has-image');
            }
            else if (mode === 'drawing') {
                if (workArea) workArea.classList.add('drawing');
                lastInputMode = 'drawing';
                setEditTool('pen');

                // 직접 그리기용 빈 벡터 데이터 초기 데이터 설정
                simData = {
                    width: simCanvas.width || 800,
                    height: simCanvas.height || 600,
                    contours: []
                };
                activeContours = simData.contours;

                inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
                simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            }
            else if (mode === 'editing') {
                if (workArea) {
                    workArea.classList.add('editing');
                    if (previewImage.src !== '#') workArea.classList.add('has-image');
                }
                setEditTool('pen');
            }

            // UI 요소 가시성 변경 후 캔버스 해상도 및 비율 재동기화
            setTimeout(resizeCanvas, 0);
        }

        function handleCompleteBtn() {
            if (mode === 'drawing') {
                confirmDrawing();
            } else if (mode === 'editing') {
                confirmEditing();
            } else if (mode === 'simulating') {
                uploadToQueue();
            } else {
                confirmDrawing();
            }
        }

        function toggleShapeMenu(e) {
            e.stopPropagation();
            selectedShape = null;
            setEditTool('shape');
            updateDeleteBar();
            menuDropdown.classList.remove('show');
            eraserSizeMenu.classList.remove('show');
            if (statusPollInterval) {
                clearInterval(statusPollInterval);
                statusPollInterval = null;
            }
        }

        function setEraserSize(radius, btnEl) {
            currentEraseRadius = radius;
            // 활성 표시 갱신
            const btns = eraserSizeMenu ? eraserSizeMenu.querySelectorAll('.eraser-size-option') : [];
            btns.forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
        }

        function toggleEraserSizeMenu(e) {
            // 더 이상 사용하지 않지만 하위 호환성을 위해 남겨둠
            if (e) e.stopPropagation();
        }

        function setEditTool(tool) {
            activeTool = tool;
            if (toolPen) toolPen.classList.toggle('active', tool === 'pen');
            if (toolEraser) toolEraser.classList.toggle('active', tool === 'eraser');

            const toolShape = document.getElementById('tool-shape');
            if (toolShape) toolShape.classList.toggle('active', tool === 'shape');

            // 팝업 트레이 영역 높이 확장 제어 (지우개/도형 활성 시 60px로 확장되어 완료 버튼이 하단으로 밀림)
            const popupTray = document.getElementById('popup-tray');
            if (popupTray) {
                const hasPopup = (tool === 'eraser' || tool === 'shape');
                popupTray.classList.toggle('has-popup', hasPopup);
            }

            // 지우개 팝업 제어
            const ePanel = document.getElementById('eraser-size-panel');
            if (ePanel) {
                ePanel.classList.toggle('show', tool === 'eraser');
                ePanel.style.display = (tool === 'eraser') ? 'flex' : 'none';
            }

            if (tool === 'eraser') {
                // 지우개 선택 시 기본값을 가장 작은 크기(8px)로 설정
                const optS = document.getElementById('eraser-opt-s');
                setEraserSize(8, optS);
            } else {
                clearEraserCursor();
            }

            // 도형 선택 팝업 제어
            const sPanel = document.getElementById('shape-picker-panel');
            if (sPanel) {
                sPanel.classList.toggle('show', tool === 'shape');
                sPanel.style.display = (tool === 'shape') ? 'flex' : 'none';
            }

            if (tool !== 'shape') {
                selectedShape = null;
                updateDeleteBar();
                drawAll();
            }
        }

        function drawAll() {
            if (!simData) return;
            // 1. 기존 선 렌더링
            renderContours(activeContours, simCtx);
            // 2. 추가된 도형 렌더링
            renderShapes(shapes, simCtx);
        }

        function renderContours(contours, ctx) {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            if (!simData) return;
            drawContoursOnly(contours, ctx);
        }

        function drawContoursOnly(contours, ctx) {
            const scale = Math.min(ctx.canvas.width / simData.width, ctx.canvas.height / simData.height);
            const offsetX = (ctx.canvas.width - simData.width * scale) / 2;
            const offsetY = (ctx.canvas.height - simData.height * scale) / 2;

            ctx.strokeStyle = "#4a90e2";
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            contours.forEach(contour => {
                if (!contour || contour.length === 0) return;
                ctx.beginPath();
                ctx.moveTo(contour[0].x * scale + offsetX, contour[0].y * scale + offsetY);
                for (let i = 1; i < contour.length; i++) {
                    ctx.lineTo(contour[i].x * scale + offsetX, contour[i].y * scale + offsetY);
                }
                ctx.stroke();
            });
        }

        function renderShapes(shapesList, ctx) {
            if (!simData) return;
            const scale = Math.min(ctx.canvas.width / simData.width, ctx.canvas.height / simData.height);
            const offsetX = (ctx.canvas.width - simData.width * scale) / 2;
            const offsetY = (ctx.canvas.height - simData.height * scale) / 2;

            shapesList.forEach(s => {
                const sx = s.x * scale + offsetX;
                const sy = s.y * scale + offsetY;
                const sw = s.w * scale;
                const sh = s.h * scale;
                const angle = (s.rotation || 0) * Math.PI / 180;
                const cx = sx + sw / 2;
                const cy = sy + sh / 2;

                ctx.save();
                // 중심점 기준 도형 회전 좌표계 설정
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.translate(-cx, -cy);

                ctx.lineWidth = 3;
                ctx.strokeStyle = "#4a90e2";
                ctx.fillStyle = "rgba(74, 144, 226, 0.05)";

                ctx.beginPath();
                if (s.type === 'rect') {
                    ctx.rect(sx, sy, sw, sh);
                    ctx.stroke();
                    ctx.fill();
                } else if (s.type === 'circle') {
                    const rx = Math.abs(sw / 2);
                    const ry = Math.abs(sh / 2);
                    ctx.ellipse(sx + sw / 2, sy + sh / 2, rx, ry, 0, 0, 2 * Math.PI);
                    ctx.stroke();
                    ctx.fill();
                } else if (s.type === 'triangle') {
                    ctx.moveTo(sx + sw / 2, sy);
                    ctx.lineTo(sx + sw, sy + sh);
                    ctx.lineTo(sx, sy + sh);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.fill();
                } else if (s.type === 'line') {
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + sw, sy + sh);
                    ctx.stroke();
                }

                // 선택 영역 활성화 점선 가이드 상자 및 조절자
                if (selectedShape && selectedShape.id === s.id) {
                    ctx.strokeStyle = "#ff4d4f";
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(sx - 4, sy - 4, sw + 8, sh + 8);
                    ctx.setLineDash([]); // 원복

                    // 4개 코너 빨간점 (크기 조절)
                    ctx.fillStyle = "#ff4d4f";
                    const handles = [
                        { x: sx - 4, y: sy - 4 },
                        { x: sx + sw + 4, y: sy - 4 },
                        { x: sx + sw + 4, y: sy + sh + 4 },
                        { x: sx - 4, y: sy + sh + 4 }
                    ];
                    handles.forEach(h => {
                        ctx.beginPath();
                        ctx.arc(h.x, h.y, 5, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    // 바운딩 박스의 실제 상단 Y좌표(topY) 계산 (도형이 뒤집혀도 상단 유지)
                    const topY = Math.min(sy - 4, sy + sh + 4);

                    // 1. 위 2개 점 가운데 (상단 중앙) 회전 버튼 (↻)
                    ctx.beginPath();
                    ctx.moveTo(cx, topY);
                    ctx.lineTo(cx, topY - 22);
                    ctx.strokeStyle = "#ff4d4f";
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(cx, topY - 22, 11, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffffff";
                    ctx.fill();
                    ctx.strokeStyle = "#cbd5e1";
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // 간단하고 직관적인 회전 화살표 ↻
                    ctx.font = "bold 13px sans-serif";
                    ctx.fillStyle = "#475569";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("↻", cx, topY - 22);

                    // 2. 오른쪽 위 (Top-Right) 위치 X 도형 삭제 버튼 (✕)
                    const delX = Math.max(sx - 4, sx + sw + 4);
                    const delY = topY;
                    ctx.beginPath();
                    ctx.arc(delX, delY, 11, 0, Math.PI * 2);
                    ctx.fillStyle = "#ff4d4f";
                    ctx.fill();

                    ctx.font = "bold 12px sans-serif";
                    ctx.fillStyle = "#ffffff";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("✕", delX, delY);
                }

                ctx.restore();
            });
        }

        function checkShapeHit(clickX, clickY) {
            if (!simData) return null;
            const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
            const offsetX = (simCanvas.width - simData.width * scale) / 2;
            const offsetY = (simCanvas.height - simData.height * scale) / 2;

            if (selectedShape) {
                const s = selectedShape;
                const sx = s.x * scale + offsetX;
                const sy = s.y * scale + offsetY;
                const sw = s.w * scale;
                const sh = s.h * scale;
                const angle = (s.rotation || 0) * Math.PI / 180;
                const cx = sx + sw / 2;
                const cy = sy + sh / 2;

                // 회전 전 로컬 좌표를 화면 픽셀 좌표로 회전 변환
                const getRotatedPt = (px, py) => {
                    const dx = px - cx;
                    const dy = py - cy;
                    return {
                        x: cx + dx * Math.cos(angle) - dy * Math.sin(angle),
                        y: cy + dx * Math.sin(angle) + dy * Math.cos(angle)
                    };
                };

                const topY = Math.min(sy - 4, sy + sh + 4);
                const delX = Math.max(sx - 4, sx + sw + 4);

                // 1. 우측 상단 X 삭제 버튼 검사 (가장 우선순위 - 터치 마진 24px)
                const delPt = getRotatedPt(delX, topY);
                if (Math.hypot(clickX - delPt.x, clickY - delPt.y) <= 24) {
                    dragMode = 'delete_btn';
                    return selectedShape;
                }

                // 2. 상단 중앙 회전 핸들 검사 (터치 마진 24px)
                const rotPt = getRotatedPt(cx, topY - 22);
                if (Math.hypot(clickX - rotPt.x, clickY - rotPt.y) <= 24) {
                    dragMode = 'rotate';
                    return selectedShape;
                }

                // 3. 4개 코너 크기 조절 핸들 검사 (터치 마진 22px)
                const handles = [
                    getRotatedPt(sx - 4, sy - 4),           // 0: Top-Left
                    getRotatedPt(sx + sw + 4, sy - 4),       // 1: Top-Right
                    getRotatedPt(sx + sw + 4, sy + sh + 4),   // 2: Bottom-Right
                    getRotatedPt(sx - 4, sy + sh + 4)        // 3: Bottom-Left
                ];
                for (let i = 0; i < handles.length; i++) {
                    if (Math.hypot(clickX - handles[i].x, clickY - handles[i].y) <= 22) {
                        dragMode = 'resize';
                        resizeHandleIdx = i;
                        return selectedShape;
                    }
                }
            }

            for (let i = shapes.length - 1; i >= 0; i--) {
                const s = shapes[i];
                const sx = s.x * scale + offsetX;
                const sy = s.y * scale + offsetY;
                const sw = s.w * scale;
                const sh = s.h * scale;

                // 클릭 지점을 도형 로컬(회전 보정) 좌표로 역변환하여 감지
                const angle = -(s.rotation || 0) * Math.PI / 180;
                const cx = sx + sw / 2;
                const cy = sy + sh / 2;
                const dx = clickX - cx;
                const dy = clickY - cy;
                const localX = cx + dx * Math.cos(angle) - dy * Math.sin(angle);
                const localY = cy + dx * Math.sin(angle) + dy * Math.cos(angle);

                const minX = Math.min(sx, sx + sw);
                const maxX = Math.max(sx, sx + sw);
                const minY = Math.min(sy, sy + sh);
                const maxY = Math.max(sy, sy + sh);

                if (localX >= minX - 10 && localX <= maxX + 10 && localY >= minY - 10 && localY <= maxY + 10) {
                    dragMode = 'move';
                    return s;
                }
            }
            return null;
        }

        function addShape(type) {
            if (!simData) return;
            saveHistoryState(); // 도형 추가 전 히스토리 저장
            setEditTool('shape');

            const defaultW = 80;
            const defaultH = 80;
            const defaultX = (simData.width - defaultW) / 2;
            const defaultY = (simData.height - defaultH) / 2;

            shapeIdCounter++;
            const newShape = {
                id: shapeIdCounter,
                type: type,
                x: defaultX,
                y: defaultY,
                w: defaultW,
                h: defaultH
            };

            shapes.push(newShape);
            selectedShape = newShape;
            updateDeleteBar();

            // 도형 추가 후 서브 팝업 메뉴만 닫고, 도형 조작(크기/위치 이동) 상태 유지
            const sPanel = document.getElementById('shape-picker-panel');
            if (sPanel) {
                sPanel.classList.remove('show');
                sPanel.style.display = 'none';
            }
            const popupTray = document.getElementById('popup-tray');
            if (popupTray) popupTray.classList.remove('has-popup');

            drawAll();
        }

        function deleteSelectedShape() {
            if (selectedShape) {
                saveHistoryState(); // 도형 삭제 전 히스토리 저장
                shapes = shapes.filter(s => s.id !== selectedShape.id);
                selectedShape = null;
                updateDeleteBar();
                drawAll();
            } else {
                alert("삭제할 도형을 먼저 선택해 주세요.");
            }
        }

        function convertShapesToContours() {
            // shapeToContour()와 동일한 밀집 샘플링으로 변환 (지우개 부분 지우기 호환)
            const output = [];
            shapes.forEach(s => {
                const pts = shapeToContour(s); // 80분할 밀집 샘플링 재사용
                if (pts.length > 1) {
                    output.push(pts);
                }
            });
            return output;
        }

        function startEditing() {
            if (!simData) return;
            if (animationId) skipSimulation();

            // 1. 현재 벡터 데이터를 딥카피하여 수정용 배열로 준비
            activeContours = JSON.parse(JSON.stringify(simData.contours));
            shapes = [];
            selectedShape = null;

            // 2. 모드 변경 (툴바 레이아웃 반영) 후 캔버스 해상도 재계산 및 렌더링
            setMode('editing');
            resizeCanvas();
            inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
            drawAll();
        }

        async function confirmEditing() {
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            // 도형 변환 병합
            const shapesContours = convertShapesToContours();
            activeContours = activeContours.concat(shapesContours);
            shapes = [];
            selectedShape = null;

            // 길이가 2 미만인 점들은 무시
            simData.contours = activeContours.filter(c => c.length > 1);

            try {
                // 이미지를 다시 보내지 않고, 수정된 벡터 데이터를 통해 G-Code만 업데이트
                const response = await fetch('/api/update-gcode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        width: simData.width,
                        height: simData.height,
                        contours: simData.contours
                    })
                });

                const result = await response.json();
                progressBar.style.width = '100%';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 500);

                if (result.status === 'success') {
                    simData.gcode = result.gcode;
                    inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
                    setMode('simulating');
                    skipSimulation(); // 결과 즉시 표시
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                progressContainer.style.display = 'none';
                await showAlert("수정 업데이트 실패: " + err.message);
            }
        }

        async function uploadToQueue() {
            if (!simData || !simData.gcode) {
                await showAlert("전송할 데이터가 없습니다.");
                return;
            }

            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '50%';

            try {
                const response = await fetch('/api/push-task', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        gcode: simData.gcode,
                        contours: simData.contours
                    })
                });

                if (!response.ok) {
                    const errorDetail = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorDetail}`);
                }

                const result = await response.json();

                if (result.status === 'success') {
                    progressBar.style.width = '100%';
                    setTimeout(async () => {
                        progressContainer.style.display = 'none';
                        await showAlert("전송 완료! (Task ID: " + result.task_id + ")");
                    }, 500);
                } else {
                    throw new Error(result.message || "서버에서 실패 응답을 보냈습니다.");
                }
            } catch (err) {
                progressContainer.style.display = 'none';
                console.error("Upload Error:", err);
                await showAlert("전송 오류: " + err.message);
            }
        }

        async function confirmDrawing() {
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            // 도형 변환 병합
            const shapesContours = convertShapesToContours();
            activeContours = activeContours.concat(shapesContours);
            shapes = [];
            selectedShape = null;

            // 길이가 2 미만인 점들은 무시
            simData.contours = activeContours.filter(c => c.length > 1);

            try {
                // 직접 수집된 정교한 벡터 직선 데이터로 G-Code 생성 요청
                const response = await fetch('/api/update-gcode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        width: simData.width,
                        height: simData.height,
                        contours: simData.contours
                    })
                });

                const result = await response.json();
                progressBar.style.width = '100%';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 500);

                if (result.status === 'success') {
                    simData.gcode = result.gcode;
                    inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
                    setMode('simulating');
                    skipSimulation(); // 결과 즉시 표시
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                progressContainer.style.display = 'none';
                alert("드로잉 벡터 G-Code 생성 실패: " + err.message);
            }
        }

        async function processImage(imageBlob, isDrawing = false) {
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');

            // 프로그레스 바 시작
            progressContainer.style.display = 'block';
            progressBar.style.width = '10%';

            try {
                // 1. 이미지 최적화 (모바일 고화질 대응)
                const optimizedBlob = await resizeImage(imageBlob, 1024);
                progressBar.style.width = '30%';

                const formData = new FormData();
                formData.append('file', optimizedBlob, 'image.jpg');
                formData.append('is_drawing', isDrawing);

                // 가짜 프로그레스 애니메이션
                let progress = 30;
                const progressInterval = setInterval(() => {
                    if (progress < 90) {
                        progress += (90 - progress) * 0.1;
                        progressBar.style.width = progress + '%';
                    }
                }, 200);

                const response = await fetch('/api/process-image', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                clearInterval(progressInterval);
                progressBar.style.width = '100%';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 500);

                if (data.error) throw new Error(data.error);
                if (!data.contours || data.contours.length === 0) {
                    alert("추출된 선이 없습니다. 더 명확하게 그려주세요.");
                    setMode('drawing');
                    return;
                }

                simData = data;
                activeContours = simData.contours; // 추출된 벡터 선을 라이브 펜/지우개 편집 배열과 즉시 동기화
                startSimulation(data);
            } catch (err) {
                progressContainer.style.display = 'none';
                console.error(err);
                alert("처리 중 오류가 발생했습니다: " + err.message);
                setMode('idle');
            }
        }

        // 이미지 크기 조절 함수
        function resizeImage(blob, maxSize) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxSize) {
                            height *= maxSize / width;
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width *= maxSize / height;
                            height = maxSize;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((result) => resolve(result), 'image/jpeg', 0.8);
                };
                img.src = URL.createObjectURL(blob);
            });
        }

        // 이미지 업로드 시에도 호출
        function startUpload() {
            if (fileInput.files[0]) {
                processImage(fileInput.files[0]);
            }
        }

        // 시뮬레이션 로직
        function startSimulation(data) {
            setMode('simulating');
            if (animationId) cancelAnimationFrame(animationId);

            document.getElementById('skip-button').style.display = 'block'; // 시뮬레이션 시작 시 버튼 표시

            const container = document.getElementById('canvas-container');
            if (container) {
                simCanvas.width = container.offsetWidth || 800;
                simCanvas.height = container.offsetHeight || 600;
            }

            // 비율 계산
            const scale = Math.min(simCanvas.width / data.width, simCanvas.height / data.height);
            const offsetX = (simCanvas.width - data.width * scale) / 2;
            const offsetY = (simCanvas.height - data.height * scale) / 2;

            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            simCtx.strokeStyle = "#4a90e2";
            simCtx.lineWidth = (lastInputMode === 'drawing') ? 5 : 2; // 그리기 모드였으면 2배 굵게
            simCtx.lineCap = 'round';
            simCtx.lineJoin = 'round';

            let contourIdx = 0;
            let pointIdx = 0;
            const speed = 30; // 그리기 시뮬레이션 속도 2배 향상 (15 -> 30)

            function animate() {
                if (mode !== 'simulating') return; // 모드가 바뀌면 중단

                if (contourIdx >= data.contours.length) {
                    animationId = null;
                    document.getElementById('skip-button').style.display = 'none'; // 시뮬레이션 완료 시 버튼 숨김
                    return;
                }

                for (let i = 0; i < speed; i++) {
                    if (contourIdx >= data.contours.length) break;

                    const contour = data.contours[contourIdx];
                    if (pointIdx === 0) {
                        simCtx.beginPath();
                        simCtx.moveTo(contour[0].x * scale + offsetX, contour[0].y * scale + offsetY);
                    } else {
                        simCtx.lineTo(contour[pointIdx].x * scale + offsetX, contour[pointIdx].y * scale + offsetY);
                        simCtx.stroke();
                    }

                    pointIdx++;
                    if (pointIdx >= contour.length) {
                        contourIdx++;
                        pointIdx = 0;
                    }
                }
                animationId = requestAnimationFrame(animate);
            }
            animationId = requestAnimationFrame(animate);
        }

        function skipSimulation() {
            if (animationId) cancelAnimationFrame(animationId);
            const data = simData;
            if (!data) return;

            const scale = Math.min(simCanvas.width / data.width, simCanvas.height / data.height);
            const offsetX = (simCanvas.width - data.width * scale) / 2;
            const offsetY = (simCanvas.height - data.height * scale) / 2;

            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            simCtx.strokeStyle = "#4a90e2";
            simCtx.lineWidth = (lastInputMode === 'drawing') ? 5 : 2; // 스킵 시에도 동일 적용

            data.contours.forEach(contour => {
                simCtx.beginPath();
                simCtx.moveTo(contour[0].x * scale + offsetX, contour[0].y * scale + offsetY);
                for (let i = 1; i < contour.length; i++) {
                    simCtx.lineTo(contour[i].x * scale + offsetX, contour[i].y * scale + offsetY);
                }
                simCtx.stroke();
            });
            animationId = null;
            document.getElementById('skip-button').style.display = 'none'; // 스킵 시 버튼 숨김
        }

        function cancelSimulation() {
            if (animationId) cancelAnimationFrame(animationId);
            animationId = null;
        }
    </script>
