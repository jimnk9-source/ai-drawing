<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vico - Ai Drawing</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --container-bg: #ffffff;
            --primary-color: #4a90e2;
            --secondary-color: #6c757d;
            --danger-color: #ff4d4f;
            --border-color: #dee2e6;
            --text-color: #212529;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 40px;
            background: var(--container-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--primary-color);
        }

        .work-area {
            width: 100%;
            height: 350px;
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        #preview-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        /* 캔버스 공통 스타일 */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #input-canvas {
            display: none;
            cursor: crosshair;
            z-index: 5;
        }

        #simulation-canvas {
            display: none;
            pointer-events: none;
            z-index: 10;
        }

        .work-area.has-image #preview-image {
            display: block;
        }

        .work-area.has-image .center-msg {
            display: none;
        }

        .work-area.drawing #input-canvas {
            display: block;
        }

        .work-area.drawing #simulation-canvas {
            display: block;
        }

        .work-area.drawing .center-msg {
            display: none;
        }

        .work-area.simulating #simulation-canvas {
            display: block;
        }

        .work-area.simulating #preview-image {
            opacity: 0.1;
        }

        .work-area:hover:not(.simulating):not(.drawing) {
            border-color: var(--primary-color);
            background-color: #f0f7ff;
            cursor: pointer;
        }

        .center-msg {
            color: var(--secondary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            /* 클릭 이벤트가 부모인 work-area로 전달되도록 설정 */
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            min-width: 120px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #e9ecef;
            color: var(--secondary-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        #file-input {
            display: none;
        }

        #skip-button {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 16px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--secondary-color);
            cursor: pointer;
            display: none;
            z-index: 20;
        }

        .work-area.simulating #skip-button {
            display: block;
        }

        /* 프로그레스 바 스타일 */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: transparent;
            z-index: 9999;
            display: none;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.5);
        }

        /* 햄버거 메뉴 스타일 */
        .menu-container {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 1000;
        }

        .menu-button {
            width: 30px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            min-width: auto;
        }

        .menu-button span {
            width: 100%;
            height: 3px;
            background-color: var(--secondary-color);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .menu-dropdown {
            position: absolute;
            top: 35px;
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
            padding: 15px;
            display: none;
            width: 320px;
            max-height: 500px;
            overflow-y: auto;
            text-align: left;
        }

        .menu-dropdown.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menu-item {
            padding: 12px 15px;
            font-size: 0.9rem;
            color: var(--text-color);
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item:hover {
            background-color: #f8f9fa;
        }

        .menu-item.danger {
            color: var(--danger-color);
        }

        .menu-item.danger:hover {
            background-color: #fff1f0;
        }

        /* 수정 도구 스타일 */
        #edit-tools {
            display: none;
            flex-direction: column;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.93);
            padding: 8px 14px 8px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.13);
            z-index: 30;
            gap: 6px;
            align-items: stretch;
        }

        /* 도구 버튼 가로 행 */
        .tool-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .edit-tool-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            transition: all 0.2s;
            padding: 0;
            min-width: auto;
        }

        .edit-tool-btn.active {
            border-color: var(--primary-color);
            background-color: #f0f7ff;
        }

        .edit-tool-btn:hover {
            background-color: #f8f9fa;
        }

        .work-area.editing #input-canvas {
            display: block;
            z-index: 15;
            cursor: crosshair;
        }

        .work-area.editing #simulation-canvas {
            display: block;
            opacity: 1;
            /* 투명도 원복 */
        }

        /* 지우개 확장 메뉴 스타일 */
        .eraser-container {
            display: flex;
            align-items: center;
            position: relative;
        }

        .eraser-more-btn {
            background: none;
            border: none;
            color: var(--secondary-color);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 0 4px;
            /* 좌우 여백을 줄여서 버튼 크기 최소화 */
            margin-left: 2px;
            display: none;
            min-width: auto;
        }

        .eraser-more-btn:hover {
            color: var(--primary-color);
        }

        .eraser-size-menu {
            position: absolute;
            left: 100%;
            top: -10px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: row;
            padding: 4px;
            gap: 3px;
            z-index: 100;
        }

        .eraser-size-menu.show {
            display: flex;
        }

        .shape-select-menu {
            position: static;
            background: rgba(240, 247, 255, 0.95);
            border-radius: 12px;
            border: 1px solid rgba(74, 144, 226, 0.2);
            display: none;
            flex-direction: row !important;
            padding: 6px 10px;
            gap: 6px;
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap !important;
            width: 100% !important;
            max-width: 220px !important;
            min-width: 160px !important;
            box-sizing: border-box;
        }

        .shape-select-menu.show {
            display: flex !important;
        }

        .shape-item-btn {
            flex-shrink: 0 !important;
            flex-grow: 0 !important;
        }

        /* 모바일 대응 */
        @media (max-width: 480px) {
            #edit-tools {
                bottom: 14px;
                padding: 6px 10px;
                border-radius: 16px;
                gap: 5px;
                max-width: calc(100vw - 32px);
                width: auto;
                min-width: 200px;
            }

            .edit-tool-btn {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }

            .shape-select-menu {
                padding: 4px 6px;
                gap: 4px;
                width: 100% !important;
                max-width: 190px !important;
                min-width: 150px !important;
            }

            .size-btn {
                width: 32px;
                height: 32px;
                font-size: 15px !important;
            }
        }

        .size-btn {
            background: none;
            border: 1px solid transparent;
            border-radius: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            min-width: unset;
        }

        .size-btn:hover {
            background: #f8f9fa;
        }

        .size-btn.active {
            border-color: var(--primary-color);
            background: #f0f7ff;
        }

        /* 점 모양 아이콘 */
        .dot {
            background-color: var(--text-color);
            border-radius: 50%;
            display: block;
            flex-shrink: 0;
        }

        .size-btn.active .dot {
            background-color: var(--primary-color);
        }

        .dot-sm {
            width: 5px;
            height: 5px;
        }

        .dot-md {
            width: 12px;
            height: 12px;
        }

        .dot-lg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>

<body>
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="container">
        <div style="text-align: right; font-size: 10px; color: #ccc; margin-bottom: -15px; padding-right: 40px;">v1.3
        </div>

        <!-- 햄버거 메뉴 -->
        <div class="menu-container">
            <button class="menu-button" onclick="toggleMenu(event)">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="menu-dropdown" id="menu-dropdown">
                <h3
                    style="margin: 0 0 10px 0; font-size: 1rem; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; color: var(--primary-color);">
                    📈 실시간 출력 현황</h3>
                <div id="status-task-list"
                    style="margin-bottom: 15px; font-size: 0.85rem; max-height: 180px; overflow-y: auto;">
                    <div style="color: var(--secondary-color); text-align: center; padding: 10px 0;">전송된 작업이 없습니다</div>
                </div>

                <h3
                    style="margin: 15px 0 10px 0; font-size: 1rem; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; color: var(--primary-color);">
                    ⭐ 보관된 그림 목록</h3>
                <div id="saved-task-list"
                    style="margin-bottom: 15px; font-size: 0.85rem; max-height: 180px; overflow-y: auto;">
                    <div style="color: var(--secondary-color); text-align: center; padding: 10px 0;">보관된 그림이 없습니다</div>
                </div>

                <div class="menu-item danger" onclick="clearServerQueue()"
                    style="margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px; justify-content: center; font-weight: bold;">
                    🗑️ 모두 삭제
                </div>
            </div>
        </div>

        <h1>Ai Drawing</h1>

        <div class="work-area" id="work-area">
            <div class="center-msg" id="center-msg">
                <div class="upload-icon">🎨</div>
                <div class="upload-text">클릭하여 이미지를 업로드하거나 직접 그려보세요</div>
            </div>

            <img id="preview-image" src="#" alt="Preview">
            <canvas id="input-canvas"></canvas>
            <canvas id="simulation-canvas"></canvas>

            <button id="skip-button" onclick="skipSimulation()">스킵</button>
            <input type="file" id="file-input" accept="image/*">

            <!-- 수정 도구 -->
            <div id="edit-tools">
                <!-- 첫 번째 행: 도구 버튼들 -->
                <div class="tool-row">
                    <button class="edit-tool-btn active" id="tool-pen" onclick="setEditTool('pen')" title="펜">✏️</button>
                    <div class="eraser-container">
                        <button class="edit-tool-btn" id="tool-eraser" onclick="setEditTool('eraser')"
                            title="지우개">🧽</button>
                        <button class="eraser-more-btn" id="eraser-more" onclick="toggleEraserSizeMenu(event)"
                            title="굵기 조절">></button>
                        <div class="eraser-size-menu" id="eraser-size-menu">
                            <button class="size-btn" onclick="setEraserSize(5, this)" title="얇게"><span
                                    class="dot dot-sm"></span></button>
                            <button class="size-btn active" onclick="setEraserSize(15, this)" title="중간"><span
                                    class="dot dot-md"></span></button>
                            <button class="size-btn" onclick="setEraserSize(30, this)" title="두껍게"><span
                                    class="dot dot-lg"></span></button>
                        </div>
                    </div>
                    <!-- 도형 추가 버튼 -->
                    <button class="edit-tool-btn" id="tool-shape" onclick="toggleShapeMenu(event)" title="도형">📐</button>
                </div>

                <!-- 두 번째 행: 도형 서브메뉴 (📐 누르면 아래에 나타남) -->
                <div class="shape-select-menu" id="shape-select-menu" style="display: none; flex-wrap: nowrap; align-items: center; justify-content: center; gap: 6px;">
                    <button class="size-btn shape-item-btn" onclick="addShape('line')" title="직선" style="font-size: 16px; font-weight: bold; flex-shrink: 0;">➖</button>
                    <button class="size-btn shape-item-btn" onclick="addShape('triangle')" title="삼각형" style="font-size: 16px; flex-shrink: 0;">▲</button>
                    <button class="size-btn shape-item-btn" onclick="addShape('rect')" title="사각형" style="font-size: 16px; flex-shrink: 0;">■</button>
                    <button class="size-btn shape-item-btn" onclick="addShape('circle')" title="원" style="font-size: 16px; flex-shrink: 0;">●</button>
                </div>

                <!-- 세 번째 행: 도형 선택 시 삭제 바 -->
                <div id="shape-delete-bar" style="display: none; justify-content: center; align-items: center; gap: 8px; padding: 6px 12px; background: rgba(255, 77, 79, 0.08); border-radius: 12px; border: 1px solid rgba(255, 77, 79, 0.25); flex-shrink: 0; margin-top: 4px;">
                    <span style="font-size: 12px; color: var(--danger-color); font-weight: bold;">선택된 도형</span>
                    <button class="size-btn" id="shape-delete-btn" onclick="deleteSelectedShape()" title="선택된 도형 삭제" style="font-size: 16px; color: var(--danger-color); background: none; border: none; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">🗑️</button>
                </div>
            </div>
        </div>

        <div class="button-group" id="button-group">
            <button class="btn-primary" id="btn-left" onclick="handleLeftBtn()">이미지 업로드</button>
            <button class="btn-secondary" id="btn-middle" onclick="handleMiddleBtn()" style="display: none;">수정</button>
            <button class="btn-primary" id="btn-right" onclick="handleRightBtn()">직접 그리기</button>
        </div>
    </div>

    <script>
        const workArea = document.getElementById('work-area');
        const fileInput = document.getElementById('file-input');
        const previewImage = document.getElementById('preview-image');
        const inputCanvas = document.getElementById('input-canvas');
        const simCanvas = document.getElementById('simulation-canvas');
        const btnLeft = document.getElementById('btn-left');
        const btnMiddle = document.getElementById('btn-middle');
        const btnRight = document.getElementById('btn-right');
        const menuDropdown = document.getElementById('menu-dropdown');
        const editTools = document.getElementById('edit-tools');
        const toolPen = document.getElementById('tool-pen');
        const toolEraser = document.getElementById('tool-eraser');
        const eraserMoreBtn = document.getElementById('eraser-more');
        const eraserSizeMenu = document.getElementById('eraser-size-menu');

        const inputCtx = inputCanvas.getContext('2d');
        const simCtx = simCanvas.getContext('2d');

        let mode = 'idle'; // idle, uploaded, drawing, simulating, editing
        let lastInputMode = 'idle';
        let isDrawing = false;
        let animationId = null;
        let currentContours = null;
        let simData = null;
        let activeTool = 'pen'; // 'pen', 'eraser', 'shape'
        let activeContours = null; // 수정 중 벡터 데이터 라이브 렌더링용
        let currentContour = null;
        let currentEraseRadius = 15; // 기본 지우개 굵기 (중)

        // 도형 제어 상태 변수
        let shapes = [];
        let selectedShape = null;
        let dragMode = null; // 'move' or 'resize'
        let resizeHandleIdx = -1; // 0, 1, 2, 3
        let dragStartPos = null;
        let shapeIdCounter = 0;

        // 완료 알림 관리
        let completedTaskNotificationSet = new Set();

        // 삼선 메뉴 갱신용 폴링 타이머
        let statusPollInterval = null;

        // 로컬 보관 목록 불러오기
        function getLocalSavedDrawings() {
            const data = localStorage.getItem('vico_saved_drawings');
            return data ? JSON.parse(data) : [];
        }

        // 로컬 보관 목록 저장하기
        function saveLocalSavedDrawings(list) {
            localStorage.setItem('vico_saved_drawings', JSON.stringify(list));
        }

        // 실시간 대기열에서 로컬 보관 목록으로 복제/저장
        function saveTaskToLocal(event, taskId, contourDataString) {
            event.stopPropagation(); // 버블링 차단 - 메뉴 닫힘 방지
            try {
                const contours = JSON.parse(decodeURIComponent(contourDataString));
                const list = getLocalSavedDrawings();

                const exists = list.some(item => item.server_task_id === taskId);
                if (exists) return; // 이미 있으면 경유

                list.push({
                    id: Date.now(),
                    server_task_id: taskId,
                    contours: contours,
                    width: simData ? simData.width : simCanvas.width,
                    height: simData ? simData.height : simCanvas.height
                });

                saveLocalSavedDrawings(list);
                renderSavedList();
                fetchTasksStatus(); // 별표 아이콘 동기화
            } catch (e) {
                console.error("Save to Local Error:", e);
            }
        }

        // 서버 task_id 기준 보관 해제
        function unsaveTaskFromServer(event, taskId) {
            event.stopPropagation(); // 버블링 차단 - 메뉴 닫힘 방지
            const list = getLocalSavedDrawings();
            const newList = list.filter(item => item.server_task_id !== taskId);
            saveLocalSavedDrawings(newList);
            renderSavedList();
            fetchTasksStatus(); // 별표 아이콘 동기화
        }


        // 보관함에 속한 그림 삭제
        function removeLocalSaved(id) {
            if (!confirm("보관함에서 이 그림을 삭제하시겠습니까?")) return;
            const list = getLocalSavedDrawings();
            const newList = list.filter(item => item.id !== id);
            saveLocalSavedDrawings(newList);
            renderSavedList();
        }

        // 보관함에 속한 그림 재전송(재출력)
        async function republishSaved(id) {
            const list = getLocalSavedDrawings();
            const item = list.find(d => d.id === id);
            if (!item) return;

            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            try {
                const gcodeResponse = await fetch('/api/update-gcode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        width: item.width,
                        height: item.height,
                        contours: item.contours
                    })
                });
                const gcodeResult = await gcodeResponse.json();
                if (gcodeResult.status !== 'success') throw new Error(gcodeResult.message);

                progressBar.style.width = '60%';

                const response = await fetch('/api/push-task', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        gcode: gcodeResult.gcode,
                        contours: item.contours
                    })
                });
                const result = await response.json();

        // 미니 썸네일 드로잉
        function drawThumb(canvas, contours, w, h) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!contours || contours.length === 0) return;

            const scale = Math.min(canvas.width / w, canvas.height / h);
            const offsetX = (canvas.width - w * scale) / 2;
            const offsetY = (canvas.height - h * scale) / 2;

            ctx.strokeStyle = "#4a90e2";
            ctx.lineWidth = 1;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            contours.forEach(contour => {
                if (!contour || contour.length === 0) return;
                ctx.beginPath();
                ctx.moveTo(contour[0].x * scale + offsetX, contour[0].y * scale + offsetY);
                for (let i = 1; i < contour.length; i++) {
                    ctx.lineTo(contour[i].x * scale + offsetX, contour[i].y * scale + offsetY);
                }
                ctx.stroke();
            });
        }

        // 서버 대기열 초기화 함수

        // 초기화 및 캔버스 설정
        function initCanvas() {
            inputCanvas.width = workArea.offsetWidth;
            inputCanvas.height = workArea.offsetHeight;
            simCanvas.width = workArea.offsetWidth;
            simCanvas.height = workArea.offsetHeight;

            inputCtx.lineCap = 'round';
            inputCtx.lineJoin = 'round';
            inputCtx.lineWidth = 3;
            inputCtx.strokeStyle = '#000';
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();

        // 영역 클릭 시 파일 업로드 트리거
        workArea.addEventListener('click', (e) => {
            // 스킵 버튼을 클릭한 경우 등 다른 요소의 이벤트를 방해하지 않기 위해 확인
            if (e.target.closest('#skip-button')) return;

            if (mode === 'idle' || mode === 'uploaded') {
                fileInput.click();
            }
        });

        // 그리기 로직 (마우스)
        inputCanvas.addEventListener('mousedown', startDrawing);
        inputCanvas.addEventListener('mousemove', draw);
        inputCanvas.addEventListener('mouseup', stopDrawing);
        inputCanvas.addEventListener('mouseleave', stopDrawing);

        // 그리기 로직 (터치 - 모바일 지원)
        inputCanvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        inputCanvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        inputCanvas.addEventListener('touchend', stopDrawing);

        function getTouchPos(touchEvent) {
            const rect = inputCanvas.getBoundingClientRect();
            return {
                x: (touchEvent.touches[0].clientX - rect.left) * (inputCanvas.width / rect.width),
                y: (touchEvent.touches[0].clientY - rect.top) * (inputCanvas.height / rect.height)
            };
        }

        function getMousePos(e) {
            const rect = inputCanvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (inputCanvas.width / rect.width),
                y: (e.clientY - rect.top) * (inputCanvas.height / rect.height)
            };
        }

        function toSimCoords(x, y) {
            const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
            const offsetX = (simCanvas.width - simData.width * scale) / 2;
            const offsetY = (simCanvas.height - simData.height * scale) / 2;
            return {
                x: (x - offsetX) / scale,
                y: (y - offsetY) / scale
            };
        }

        function handleTouchStart(e) {
            if (mode !== 'drawing' && mode !== 'editing') return;
            e.preventDefault();
            const pos = getTouchPos(e);
            startDrawingAt(pos.x, pos.y);
        }

        function handleTouchMove(e) {
            if (!isDrawing || (mode !== 'drawing' && mode !== 'editing')) return;
            e.preventDefault();
            const pos = getTouchPos(e);
            drawTo(pos.x, pos.y);
        }

        function startDrawing(e) {
            if (mode !== 'drawing' && mode !== 'editing') return;
            const pos = getMousePos(e);
            startDrawingAt(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            drawTo(pos.x, pos.y);
        }

        function startDrawingAt(x, y) {
            isDrawing = true;

            if (mode === 'editing' || mode === 'drawing') {
                const pos = toSimCoords(x, y);

                // 지우개가 아닐 때, 지점을 검사하여 도형 히트 시 도형 편집 툴로 자동 전환
                if (activeTool !== 'eraser') {
                    const hit = checkShapeHit(x, y);
                    if (hit) {
                        setEditTool('shape');
                        selectedShape = hit;
                        dragStartPos = {
                            x: x,
                            y: y,
                            shapeX: hit.x,
                            shapeY: hit.y,
                            shapeW: hit.w,
                            shapeH: hit.h
                        };
                        updateDeleteBar();
                        drawAll();
                        return;
                    }
                }

                if (activeTool === 'shape') {
                    selectedShape = null;
                    setEditTool('pen'); // 허공 클릭 시 펜 툴로 깔끔하게 돌아가게 함
                    updateDeleteBar();
                    drawAll();
                    return;
                }

                if (activeTool === 'pen') {
                    selectedShape = null;
                    updateDeleteBar();
                    drawAll();

                    currentContour = [pos];
                    activeContours.push(currentContour);

                    inputCtx.beginPath();
                    inputCtx.moveTo(x, y);
                    inputCtx.strokeStyle = "#4a90e2"; // 수정 시뮬레이션 색상
                    inputCtx.lineWidth = 2; // 화면 출력 굵기
                    inputCtx.lineCap = 'round';
                    inputCtx.lineJoin = 'round';
                } else if (activeTool === 'eraser') {
                    selectedShape = null;
                    updateDeleteBar();
                    eraseAt(pos);
                }
            }
        }

        function drawTo(x, y) {
            if (mode === 'editing' || mode === 'drawing') {
                const pos = toSimCoords(x, y);

                if (activeTool === 'shape' && selectedShape && dragStartPos) {
                    const dx = x - dragStartPos.x;
                    const dy = y - dragStartPos.y;
                    const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
                    const simDx = dx / scale;
                    const simDy = dy / scale;

                    if (dragMode === 'move') {
                        selectedShape.x = dragStartPos.shapeX + simDx;
                        selectedShape.y = dragStartPos.shapeY + simDy;
                    } else if (dragMode === 'resize') {
                        if (resizeHandleIdx === 0) { // Top-Left
                            selectedShape.x = dragStartPos.shapeX + simDx;
                            selectedShape.y = dragStartPos.shapeY + simDy;
                            selectedShape.w = dragStartPos.shapeW - simDx;
                            selectedShape.h = dragStartPos.shapeH - simDy;
                        } else if (resizeHandleIdx === 1) { // Top-Right
                            selectedShape.y = dragStartPos.shapeY + simDy;
                            selectedShape.w = dragStartPos.shapeW + simDx;
                            selectedShape.h = dragStartPos.shapeH - simDy;
                        } else if (resizeHandleIdx === 2) { // Bottom-Right
                            selectedShape.w = dragStartPos.shapeW + simDx;
                            selectedShape.h = dragStartPos.shapeH + simDy;
                        } else if (resizeHandleIdx === 3) { // Bottom-Left
                            selectedShape.x = dragStartPos.shapeX + simDx;
                            selectedShape.w = dragStartPos.shapeW - simDx;
                            selectedShape.h = dragStartPos.shapeH + simDy;
                        }
                    }
                    drawAll();
                    return;
                }

                if (activeTool === 'pen' && currentContour) {
                    const lastPt = currentContour[currentContour.length - 1];
                    if (lastPt) {
                        const dist = Math.hypot(pos.x - lastPt.x, pos.y - lastPt.y);
                        // 초당 수집되는 점의 개수가 부족하여 각져 보이는 문제를 해결하기 위해,
                        // 마우스 이동 간격이 1.5px보다 벌어지는 경우 그 사이에 선형 보간 점들을 촘촘히 보충
                        const step = 1.5;
                        if (dist > step) {
                            const stepsCount = Math.floor(dist / step);
                            for (let k = 1; k < stepsCount; k++) {
                                const t = k / stepsCount;
                                const interpPt = {
                                    x: lastPt.x + (pos.x - lastPt.x) * t,
                                    y: lastPt.y + (pos.y - lastPt.y) * t
                                };
                                currentContour.push(interpPt);
                            }
                        }
                    }
                    currentContour.push(pos);
                    inputCtx.lineTo(x, y);
                    inputCtx.stroke();
                } else if (activeTool === 'eraser') {
                    eraseAt(pos);
                }
            }
        }

        // 도형을 촘촘한 벡터 점으로 변환 (지우개 처리용)
        function shapeToContour(s) {
            const pts = [];
            const SEG = 80; // 분할 수
            if (s.type === 'rect') {
                const n = Math.ceil(SEG / 4);
                for (let i = 0; i <= n; i++) pts.push({ x: s.x + s.w * i / n, y: s.y });
                for (let i = 1; i <= n; i++) pts.push({ x: s.x + s.w, y: s.y + s.h * i / n });
                for (let i = 1; i <= n; i++) pts.push({ x: s.x + s.w - s.w * i / n, y: s.y + s.h });
                for (let i = 1; i <= n; i++) pts.push({ x: s.x, y: s.y + s.h - s.h * i / n });
            } else if (s.type === 'circle') {
                const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
                const rx = Math.abs(s.w / 2), ry = Math.abs(s.h / 2);
                for (let i = 0; i <= SEG; i++) {
                    const rad = (i / SEG) * 2 * Math.PI;
                    pts.push({ x: cx + rx * Math.cos(rad), y: cy + ry * Math.sin(rad) });
                }
            } else if (s.type === 'triangle') {
                const n = Math.ceil(SEG / 3);
                const p1 = { x: s.x + s.w / 2, y: s.y };
                const p2 = { x: s.x + s.w, y: s.y + s.h };
                const p3 = { x: s.x, y: s.y + s.h };
                for (let i = 0; i < n; i++) { const t = i / n; pts.push({ x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t }); }
                for (let i = 0; i < n; i++) { const t = i / n; pts.push({ x: p2.x + (p3.x - p2.x) * t, y: p2.y + (p3.y - p2.y) * t }); }
                for (let i = 0; i <= n; i++) { const t = i / n; pts.push({ x: p3.x + (p1.x - p3.x) * t, y: p3.y + (p1.y - p3.y) * t }); }
            } else if (s.type === 'line') {
                for (let i = 0; i <= SEG; i++) {
                    pts.push({ x: s.x + s.w * i / SEG, y: s.y + s.h * i / SEG });
                }
            }
            return pts;
        }

        // 선택 도형 삭제 바 표시/숨김 및 도형 4종 추가 서브메뉴 표시 동기화
        function updateDeleteBar() {
            const bar = document.getElementById('shape-delete-bar');
            const sm = document.getElementById('shape-select-menu');
            if (selectedShape) {
                if (bar) bar.style.display = 'flex';
                if (sm) sm.classList.remove('show');
            } else {
                if (bar) bar.style.display = 'none';
                if (sm) {
                    if (activeTool === 'shape') {
                        sm.classList.add('show');
                    } else {
                        sm.classList.remove('show');
                    }
                }
            }
        }

        function eraseAt(pos) {
            const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
            const eraseRadius = currentEraseRadius / scale; // 동적 지우개 반경

            // 1. 선(contour) 지우기
            let newContours = [];
            let erased = false;

            for (let contour of activeContours) {
                let currentChunk = [];
                for (let pt of contour) {
                    let d = Math.hypot(pt.x - pos.x, pt.y - pos.y);
                    if (d > eraseRadius) {
                        currentChunk.push(pt);
                    } else {
                        erased = true;
                        if (currentChunk.length > 0) {
                            newContours.push(currentChunk);
                            currentChunk = [];
                        }
                    }
                }
                if (currentChunk.length > 0) {
                    newContours.push(currentChunk);
                }
            }
            if (erased) {
                activeContours = newContours;
            }

            // 2. 도형(shape) 부분 지우기 - 지우개 원 범위에 드는 점만 지우고 쪼개기
            const newShapes = [];
            let shapeChanged = false;

            for (const s of shapes) {
                // 바운딩 박스로 빠르게 오버랩 점검 (속도 향상)
                const minX = Math.min(s.x, s.x + s.w) - eraseRadius;
                const maxX = Math.max(s.x, s.x + s.w) + eraseRadius;
                const minY = Math.min(s.y, s.y + s.h) - eraseRadius;
                const maxY = Math.max(s.y, s.y + s.h) + eraseRadius;
                const inBox = pos.x >= minX && pos.x <= maxX && pos.y >= minY && pos.y <= maxY;

                if (!inBox) {
                    newShapes.push(s); // 바깥이면 유지
                    continue;
                }

                // 점으로 분산하여 지우개 내부의 영역만 부분 커팅
                const pts = shapeToContour(s);
                let currentChunk = [];
                let shapePartErased = false;

                for (const pt of pts) {
                    const d = Math.hypot(pt.x - pos.x, pt.y - pos.y);
                    if (d > eraseRadius) {
                        currentChunk.push(pt);
                    } else {
                        shapePartErased = true;
                        if (currentChunk.length > 1) {
                            activeContours.push(currentChunk); // 살아남은 조각은 영속적인 펜으로 전송
                        }
                        currentChunk = [];
                    }
                }
                if (currentChunk.length > 1) {
                    activeContours.push(currentChunk);
                }

                if (shapePartErased) {
                    shapeChanged = true;
                    if (selectedShape && selectedShape.id === s.id) {
                        selectedShape = null;
                        updateDeleteBar();
                    }
                    erased = true; 
                    // shapes 배열에 추가하지 않고 완전히 쪼개진 벡터 선들로 흡수됨
                } else {
                    newShapes.push(s); // 실제로 지우개에 걸치는 부분이 없으면 유지
                }
            }

            shapes = newShapes;

            if (erased || shapeChanged) {
                drawAll();
            }
        }

        function stopDrawing() {
            isDrawing = false;
            if (activeTool === 'shape') {
                dragMode = null;
                dragStartPos = null;
                return;
            }
            if ((mode === 'editing' || mode === 'drawing') && activeTool === 'pen' && currentContour && currentContour.length < 2) {
                activeContours.pop(); // 너무 짧은 점 제거
            }
            if (mode === 'editing' || mode === 'drawing') {
                drawAll();
                inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
            } else {
                inputCtx.globalCompositeOperation = 'source-over';
            }
        }

        function drawAll() {
            if (!simData) return;
            // 1. 기존 선 렌더링
            renderContours(activeContours, simCtx);
            // 2. 추가된 도형 렌더링
            renderShapes(shapes, simCtx);
        }

        function renderContours(contours, ctx) {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            if (!simData) return;
            drawContoursOnly(contours, ctx);
        }

        function drawContoursOnly(contours, ctx) {
            const scale = Math.min(ctx.canvas.width / simData.width, ctx.canvas.height / simData.height);
            const offsetX = (ctx.canvas.width - simData.width * scale) / 2;
            const offsetY = (ctx.canvas.height - simData.height * scale) / 2;

            ctx.strokeStyle = "#4a90e2";
            ctx.lineWidth = (lastInputMode === 'drawing') ? 5 : 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            contours.forEach(contour => {
                if (!contour || contour.length === 0) return;
                ctx.beginPath();
                ctx.moveTo(contour[0].x * scale + offsetX, contour[0].y * scale + offsetY);
                for (let i = 1; i < contour.length; i++) {
                    ctx.lineTo(contour[i].x * scale + offsetX, contour[i].y * scale + offsetY);
                }
                ctx.stroke();
            });
        }

        function renderShapes(shapesList, ctx) {
            if (!simData) return;
            const scale = Math.min(ctx.canvas.width / simData.width, ctx.canvas.height / simData.height);
            const offsetX = (ctx.canvas.width - simData.width * scale) / 2;
            const offsetY = (ctx.canvas.height - simData.height * scale) / 2;

            shapesList.forEach(s => {
                const sx = s.x * scale + offsetX;
                const sy = s.y * scale + offsetY;
                const sw = s.w * scale;
                const sh = s.h * scale;

                ctx.lineWidth = 3;
                ctx.strokeStyle = "#4a90e2";
                ctx.fillStyle = "rgba(74, 144, 226, 0.05)";

                ctx.beginPath();
                if (s.type === 'rect') {
                    ctx.rect(sx, sy, sw, sh);
                    ctx.stroke();
                    ctx.fill();
                } else if (s.type === 'circle') {
                    const rx = Math.abs(sw / 2);
                    const ry = Math.abs(sh / 2);
                    ctx.ellipse(sx + sw/2, sy + sh/2, rx, ry, 0, 0, 2 * Math.PI);
                    ctx.stroke();
                    ctx.fill();
                } else if (s.type === 'triangle') {
                    ctx.moveTo(sx + sw/2, sy);
                    ctx.lineTo(sx + sw, sy + sh);
                    ctx.lineTo(sx, sy + sh);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.fill();
                } else if (s.type === 'line') {
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + sw, sy + sh);
                    ctx.stroke();
                }

                // 선택 영역 활성화 점선 가이드 상자 및 조절자
                if (selectedShape && selectedShape.id === s.id) {
                    ctx.save();
                    ctx.strokeStyle = "#ff4d4f";
                    ctx.lineWidth = 1;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(sx - 4, sy - 4, sw + 8, sh + 8);
                    ctx.restore();

                    ctx.fillStyle = "#ff4d4f";
                    const handles = [
                        {x: sx, y: sy},
                        {x: sx + sw, y: sy},
                        {x: sx + sw, y: sy + sh},
                        {x: sx, y: sy + sh}
                    ];
                    handles.forEach(h => {
                        ctx.fillRect(h.x - 5, h.y - 5, 10, 10);
                    });
                }
            });
        }

        function checkShapeHit(clickX, clickY) {
            if (!simData) return null;
            const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
            const offsetX = (simCanvas.width - simData.width * scale) / 2;
            const offsetY = (simCanvas.height - simData.height * scale) / 2;

            if (selectedShape) {
                const s = selectedShape;
                const sx = s.x * scale + offsetX;
                const sy = s.y * scale + offsetY;
                const sw = s.w * scale;
                const sh = s.h * scale;

                const handles = [
                    {x: sx, y: sy},
                    {x: sx + sw, y: sy},
                    {x: sx + sw, y: sy + sh},
                    {x: sx, y: sy + sh}
                ];
                for (let i = 0; i < handles.length; i++) {
                    if (Math.hypot(clickX - handles[i].x, clickY - handles[i].y) < 12) {
                        dragMode = 'resize';
                        resizeHandleIdx = i;
                        return selectedShape;
                    }
                }
            }

            for (let i = shapes.length - 1; i >= 0; i--) {
                const s = shapes[i];
                const sx = s.x * scale + offsetX;
                const sy = s.y * scale + offsetY;
                const sw = s.w * scale;
                const sh = s.h * scale;

                const minX = Math.min(sx, sx + sw);
                const maxX = Math.max(sx, sx + sw);
                const minY = Math.min(sy, sy + sh);
                const maxY = Math.max(sy, sy + sh);

                if (clickX >= minX - 10 && clickX <= maxX + 10 && clickY >= minY - 10 && clickY <= maxY + 10) {
                    dragMode = 'move';
                    return s;
                }
            }
            return null;
        }

        function addShape(type) {
            if (!simData) return;
            setEditTool('shape');

            const defaultW = 80;
            const defaultH = 80;
            const defaultX = (simData.width - defaultW) / 2;
            const defaultY = (simData.height - defaultH) / 2;

            shapeIdCounter++;
            const newShape = {
                id: shapeIdCounter,
                type: type,
                x: defaultX,
                y: defaultY,
                w: defaultW,
                h: defaultH
            };

            shapes.push(newShape);
            selectedShape = newShape;
            updateDeleteBar();

            const sm = document.getElementById('shape-select-menu');
            if (sm) sm.classList.remove('show');
            drawAll();
        }

        function deleteSelectedShape() {
            if (selectedShape) {
                shapes = shapes.filter(s => s.id !== selectedShape.id);
                selectedShape = null;
                updateDeleteBar();
                drawAll();
            } else {
                alert("삭제할 도형을 먼저 선택해 주세요.");
            }
        }

        function convertShapesToContours() {
            const output = [];
            shapes.forEach(s => {
                const pts = [];
                if (s.type === 'rect') {
                    // 사각형 닫힌 루프 생성
                    pts.push({ x: s.x, y: s.y });
                    pts.push({ x: s.x + s.w, y: s.y });
                    pts.push({ x: s.x + s.w, y: s.y + s.h });
                    pts.push({ x: s.x, y: s.y + s.h });
                    pts.push({ x: s.x, y: s.y });
                } else if (s.type === 'circle') {
                    // 원 36분할 벡터 생성
                    const cx = s.x + s.w/2;
                    const cy = s.y + s.h/2;
                    const rx = Math.abs(s.w/2);
                    const ry = Math.abs(s.h/2);
                    for (let i = 0; i <= 36; i++) {
                        const rad = (i * 10 * Math.PI) / 180;
                        pts.push({ x: cx + rx * Math.cos(rad), y: cy + ry * Math.sin(rad) });
                    }
                } else if (s.type === 'triangle') {
                    // 삼각형 생성
                    pts.push({ x: s.x + s.w/2, y: s.y });
                    pts.push({ x: s.x + s.w, y: s.y + s.h });
                    pts.push({ x: s.x, y: s.y + s.h });
                    pts.push({ x: s.x + s.w/2, y: s.y });
                } else if (s.type === 'line') {
                    // 직선 생성
                    pts.push({ x: s.x, y: s.y });
                    pts.push({ x: s.x + s.w, y: s.y + s.h });
                }
                if (pts.length > 0) {
                    output.push(pts);
                }
            });
            return output;
        }

        function startEditing() {
            if (!simData) return;
            if (animationId) skipSimulation();

            // 1. 현재 벡터 데이터를 딥카피하여 수정용 배열로 준비
            activeContours = JSON.parse(JSON.stringify(simData.contours));
            shapes = [];
            selectedShape = null;

            // 2. 화면 초기화 후 현재 벡터 렌더링
            inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
            drawAll();

            setMode('editing');
        }

        async function confirmEditing() {
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            // 도형 변환 병합
            const shapesContours = convertShapesToContours();
            activeContours = activeContours.concat(shapesContours);
            shapes = [];
            selectedShape = null;

            // 길이가 2 미만인 점들은 무시
            simData.contours = activeContours.filter(c => c.length > 1);

            try {
                // 이미지를 다시 보내지 않고, 수정된 벡터 데이터를 통해 G-Code만 업데이트
                const response = await fetch('/api/update-gcode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        width: simData.width,
                        height: simData.height,
                        contours: simData.contours
                    })
                });

                const result = await response.json();
                progressBar.style.width = '100%';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 500);

                if (result.status === 'success') {
                    simData.gcode = result.gcode;
                    inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
                    setMode('simulating');
                    skipSimulation(); // 결과 즉시 표시
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                progressContainer.style.display = 'none';
                alert("수정 업데이트 실패: " + err.message);
            }
        }

        async function uploadToQueue() {
            if (!simData || !simData.gcode) {
                alert("전송할 데이터가 없습니다.");
                return;
            }

            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '50%';

            try {
                const response = await fetch('/api/push-task', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        gcode: simData.gcode,
                        contours: simData.contours
                    })
                });

                if (!response.ok) {
                    const errorDetail = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorDetail}`);
                }

                const result = await response.json();

                if (result.status === 'success') {
                    progressBar.style.width = '100%';
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                        alert("ESP32로 전송 준비 완료! (Task ID: " + result.task_id + ")");
                    }, 500);
                } else {
                    throw new Error(result.message || "서버에서 실패 응답을 보냈습니다.");
                }
            } catch (err) {
                progressContainer.style.display = 'none';
                console.error("Upload Error:", err);
                alert("전송 오류: " + err.message);
            }
        }

        async function confirmDrawing() {
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            // 도형 변환 병합
            const shapesContours = convertShapesToContours();
            activeContours = activeContours.concat(shapesContours);
            shapes = [];
            selectedShape = null;

            // 길이가 2 미만인 점들은 무시
            simData.contours = activeContours.filter(c => c.length > 1);

            try {

                const response = await fetch('/api/update-gcode', {
                    method: 'POST',

                    })
                });

                }

        async function processImage(imageBlob, isDrawing = false) {
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');

            // 프로그레스 바 시작
            progressContainer.style.display = 'block';
            progressBar.style.width = '10%';

            try {
                // 1. 이미지 최적화 (모바일 고화질 대응)
                const optimizedBlob = await resizeImage(imageBlob, 1024);
                progressBar.style.width = '30%';

                const formData = new FormData();
                formData.append('file', optimizedBlob, 'image.jpg');
                formData.append('is_drawing', isDrawing);

                // 가짜 프로그레스 애니메이션
                let progress = 30;
                const progressInterval = setInterval(() => {
                    if (progress < 90) {
                        progress += (90 - progress) * 0.1;
                        progressBar.style.width = progress + '%';
                    }
                }, 200);

                const response = await fetch('/api/process-image', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                clearInterval(progressInterval);
                progressBar.style.width = '100%';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 500);

                if (data.error) throw new Error(data.error);
                if (!data.contours || data.contours.length === 0) {
                    alert("추출된 선이 없습니다. 더 명확하게 그려주세요.");
                    setMode('drawing');
                    return;
                }

                simData = data;
                startSimulation(data);
            } catch (err) {
                progressContainer.style.display = 'none';
                console.error(err);
                alert("처리 중 오류가 발생했습니다: " + err.message);
                setMode('idle');
            }
        }

        // 이미지 크기 조절 함수
        function resizeImage(blob, maxSize) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxSize) {
                            height *= maxSize / width;
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width *= maxSize / height;
                            height = maxSize;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((result) => resolve(result), 'image/jpeg', 0.8);
                };
                img.src = URL.createObjectURL(blob);
            });
        }

        // 이미지 업로드 시에도 호출
        function startUpload() {
            if (fileInput.files[0]) {
                processImage(fileInput.files[0]);
            }
        }

        // 시뮬레이션 로직
        function startSimulation(data) {
            setMode('simulating');
            if (animationId) cancelAnimationFrame(animationId);

            document.getElementById('skip-button').style.display = 'block'; // 시뮬레이션 시작 시 버튼 표시

            simCanvas.width = workArea.offsetWidth;
            simCanvas.height = workArea.offsetHeight;

            // 비율 계산
            const scale = Math.min(simCanvas.width / data.width, simCanvas.height / data.height);
            const offsetX = (simCanvas.width - data.width * scale) / 2;
            const offsetY = (simCanvas.height - data.height * scale) / 2;

            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            simCtx.strokeStyle = "#4a90e2";
            simCtx.lineWidth = (lastInputMode === 'drawing') ? 5 : 2; // 그리기 모드였으면 2배 굵게
            simCtx.lineCap = 'round';
            simCtx.lineJoin = 'round';

            let contourIdx = 0;
            let pointIdx = 0;
            const speed = 30; // 그리기 시뮬레이션 속도 2배 향상 (15 -> 30)

            function animate() {
                if (mode !== 'simulating') return; // 모드가 바뀌면 중단

                if (contourIdx >= data.contours.length) {
                    animationId = null;
                    document.getElementById('skip-button').style.display = 'none'; // 시뮬레이션 완료 시 버튼 숨김
                    return;
                }

                for (let i = 0; i < speed; i++) {
                    if (contourIdx >= data.contours.length) break;

                    const contour = data.contours[contourIdx];
                    if (pointIdx === 0) {
                        simCtx.beginPath();
                        simCtx.moveTo(contour[0].x * scale + offsetX, contour[0].y * scale + offsetY);
                    } else {
                        simCtx.lineTo(contour[pointIdx].x * scale + offsetX, contour[pointIdx].y * scale + offsetY);
                        simCtx.stroke();
                    }

                    pointIdx++;
                    if (pointIdx >= contour.length) {
                        contourIdx++;
                        pointIdx = 0;
                    }
                }
                animationId = requestAnimationFrame(animate);
            }
            animationId = requestAnimationFrame(animate);
        }

        function skipSimulation() {
            if (animationId) cancelAnimationFrame(animationId);
            const data = simData;
            if (!data) return;

            const scale = Math.min(simCanvas.width / data.width, simCanvas.height / data.height);
            const offsetX = (simCanvas.width - data.width * scale) / 2;
            const offsetY = (simCanvas.height - data.height * scale) / 2;

            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            simCtx.strokeStyle = "#4a90e2";
            simCtx.lineWidth = (lastInputMode === 'drawing') ? 5 : 2; // 스킵 시에도 동일 적용

            data.contours.forEach(contour => {
                simCtx.beginPath();
                simCtx.moveTo(contour[0].x * scale + offsetX, contour[0].y * scale + offsetY);
                for (let i = 1; i < contour.length; i++) {
                    simCtx.lineTo(contour[i].x * scale + offsetX, contour[i].y * scale + offsetY);
                }
                simCtx.stroke();
            });
            animationId = null;
            document.getElementById('skip-button').style.display = 'none'; // 스킵 시 버튼 숨김
        }

        function cancelSimulation() {
            if (animationId) cancelAnimationFrame(animationId);
            animationId = null;
        }
    </script>
