            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, displayW, displayH);
            if (!contours || contours.length === 0) return;

            // 썸네일 테두리 마스킹
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, displayW, displayH);
            ctx.clip();

            // contour 점들의 최대 X, Y좌표를 계산하여 캔버스 크기가 잘리지 않도록 안전 지대를 산출
            let maxPtX = 0, maxPtY = 0;
            contours.forEach(contour => {
                if (!contour) return;
                contour.forEach(pt => {
                    if (pt.x > maxPtX) maxPtX = pt.x;
                    if (pt.y > maxPtY) maxPtY = pt.y;
                });
            });

            // 유효하지 않은 w, h (falsy 또는 화면 DOM 픽셀 크기 500 미만) 처리
            let canvasW = (w && w >= 500) ? w : 0;
            let canvasH = (h && h >= 500) ? h : 0;

            if (!canvasW || !canvasH) {
                if (maxPtX > 600 || (w && w > h)) {
                    canvasW = 800;
                    canvasH = 600;
                } else {
                    canvasW = 600;
                    canvasH = 800;
                }
            }

            // 그림 좌표가 기본 캔버스 규격을 초과하는 경우 자르지 않도록 바운딩 박스 자동 확장
            if (maxPtX > canvasW) canvasW = Math.ceil(maxPtX + 10);
            if (maxPtY > canvasH) canvasH = Math.ceil(maxPtY + 10);

            const padding = 2;
            const availW = displayW - padding * 2;
            const availH = displayH - padding * 2;

            const scale = Math.min(availW / canvasW, availH / canvasH);
            const offsetX = padding + (availW - canvasW * scale) / 2;
            const offsetY = padding + (availH - canvasH * scale) / 2;

            // 0.8mm 출력 펜 굵기 반영: 썸네일 스케일에 맞춘 비례 두께 계산
            const strokeMm = 0.8;
            const thumbStrokePx = Math.max(1.2, (scale * strokeMm));
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = thumbStrokePx;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalAlpha = 0.95;

            contours.forEach(contour => {
                if (!contour || contour.length === 0) return;
                ctx.beginPath();

                const getTransformedPt = (pt) => {
                    return {
                        x: offsetX + (pt.x / canvasW) * (canvasW * scale),
                        y: offsetY + (pt.y / canvasH) * (canvasH * scale)
                    };
                };

                const startPt = getTransformedPt(contour[0]);
                ctx.moveTo(startPt.x, startPt.y);

                for (let i = 1; i < contour.length - 1; i++) {
                    const pCurr = getTransformedPt(contour[i]);
                    const pNext = getTransformedPt(contour[i + 1]);
                    const mx = (pCurr.x + pNext.x) / 2;
                    const my = (pCurr.y + pNext.y) / 2;
                    ctx.quadraticCurveTo(pCurr.x, pCurr.y, mx, my);
                }
                if (contour.length > 1) {
                    const lastPt = getTransformedPt(contour[contour.length - 1]);
                    ctx.lineTo(lastPt.x, lastPt.y);
                }
                ctx.stroke();
            });
            ctx.restore();
        }

        // 서버 대기열 현황 조회 수집 (모바일/데스크톱 로컬 캐싱 적용)
        async function fetchTasksStatus() {
            try {
                const response = await fetch('/api/tasks-status');
                let tasks = await response.json();

                if (Array.isArray(tasks) && tasks.length > 0) {
                    // 모바일 브라우저용 로컬 캐시 백업
                    localStorage.setItem('vico_cached_tasks', JSON.stringify(tasks));
                } else {
                    // 서버 응답이 비어있으면 모바일 로컬 캐시에서 복원 시도
                    const localData = localStorage.getItem('vico_cached_tasks');
                    if (localData) {
                        try { tasks = JSON.parse(localData); } catch (e) {}
                    }
                }

                // 완료 알림 브로드캐스트 감지
                if (Array.isArray(tasks)) {
                    tasks.forEach(async task => {
                        if (task.status === 'complete' && !completedTaskNotificationSet.has(task.task_id)) {
                            completedTaskNotificationSet.add(task.task_id);
                            await showAlert(`🎉 작업 #${task.task_id} 출력이 완료되었습니다!\n플로터가 자동으로 원점으로 복귀하였습니다.`);
                        }
                    });
                    renderStatusList(tasks);
                }
            } catch (e) {
                console.error("Fetch Status Error:", e);
                // 네트워크 에러 시 모바일 캐시에서 복원
                const localData = localStorage.getItem('vico_cached_tasks');
                if (localData) {
                    try { renderStatusList(JSON.parse(localData)); } catch (err) {}
                }
            }
        }

        // 카드 팝업 메뉴 토글
        function toggleCardMenu(event, taskId) {
            event.stopPropagation();
            // 기존 열려있던 팝업들 닫기
            document.querySelectorAll('.card-menu-popover').forEach(el => {
                if (el.id !== `card-menu-${taskId}`) el.classList.remove('show');
            });
            const menu = document.getElementById(`card-menu-${taskId}`);
            if (!menu) return;

            const isShown = menu.classList.contains('show');
            if (isShown) {
                menu.classList.remove('show');
            } else {
                menu.classList.add('show');
                const card = menu.closest('.history-card');
                const list = document.getElementById('history-card-list');
                if (card && list) {
                    const cardRect = card.getBoundingClientRect();
                    const listRect = list.getBoundingClientRect();
                    if (cardRect.bottom + 90 > listRect.bottom) {
                        menu.style.top = 'auto';
                        menu.style.bottom = '35px';
                    } else {
                        menu.style.top = '35px';
                        menu.style.bottom = 'auto';
                    }
                }
            }
        }

        // ─── 커스텀 모달 ───────────────────────────────────────
        let _modalResolve = null;

        function closeCustomModal(value) {
            const overlay = document.getElementById('custom-modal-overlay');
            if (overlay) {
                overlay.classList.remove('show');
                overlay.style.display = 'none';
            }
            if (_modalResolve) { _modalResolve(value ?? null); _modalResolve = null; }
        }

        // 그림 확대 미리보기 모달 열기/닫기
        function openPreviewModal(event, taskId) {
            if (event) event.stopPropagation();
            const task = cachedTasks.find(t => t.task_id === taskId);
            if (!task || !task.contours) return;

            const overlay = document.getElementById('preview-modal-overlay');
            if (!overlay) return;

            const customNames = getTaskCustomNames();
            const displayName = customNames[taskId] || `#${taskId}`;
            document.getElementById('preview-modal-title').textContent = `${displayName}`;

            const reeditBtn = document.getElementById('preview-reedit-btn');
            if (reeditBtn) {
                reeditBtn.onclick = (e) => {
                    closePreviewModal();
                    reEditTask(e, taskId);
                };
            }

            overlay.style.display = 'flex';

            // 고해상도 팝업 캔버스 드로잉
            setTimeout(() => {
                const canvas = document.getElementById('preview-large-canvas');
                if (canvas) {
                    let maxPtX = 0, maxPtY = 0;
                    if (task.contours) {
                        task.contours.forEach(c => { if (c) c.forEach(p => { if (p.x > maxPtX) maxPtX = p.x; if (p.y > maxPtY) maxPtY = p.y; }); });
                    }
                    let w = (task.width && task.width >= 500) ? task.width : (maxPtX > 600 ? 800 : 600);
                    let h = (task.height && task.height >= 500) ? task.height : (maxPtX > 600 ? 600 : 800);
                    if (h === 1200) h = 800; // 레거시 1200 높이 보정
                    if (maxPtX > w) w = Math.ceil(maxPtX + 10);
                    if (maxPtY > h) h = Math.ceil(maxPtY + 10);
                    
                    // 모달 안 캔버스 크기 지정 (최대 380x360 뷰포트 맞춤)
                    const containerBox = canvas.parentElement;
                    const maxW = containerBox.clientWidth - 24;
                    const maxH = containerBox.clientHeight - 24;
                    
                    const ratio = w / h;
                    let drawW = maxW;
                    let drawH = drawW / ratio;

                    if (drawH > maxH) {
                        drawH = maxH;
                        drawW = drawH * ratio;
                    }

                    canvas.style.width = Math.round(drawW) + 'px';
                    canvas.style.height = Math.round(drawH) + 'px';

                    drawThumb(canvas, task.contours, w, h);
                }
            }, 30);
        }

        function closePreviewModal(event) {
            if (event && event.target.id !== 'preview-modal-overlay' && event.target.tagName !== 'BUTTON') return;
            const overlay = document.getElementById('preview-modal-overlay');
            if (overlay) overlay.style.display = 'none';
        }

        // 확인/취소 팝업
        function showConfirm(title, isDanger = false) {
            return new Promise(resolve => {
                _modalResolve = resolve;
                document.getElementById('custom-modal-title').textContent = title;
                const input = document.getElementById('custom-modal-input');
                input.style.display = 'none';
                const confirmBtn = document.getElementById('custom-modal-confirm');
                confirmBtn.textContent = '확인';
                confirmBtn.classList.toggle('danger', isDanger);
                confirmBtn.onclick = () => closeCustomModal(true);
                document.getElementById('custom-modal-cancel').style.display = '';
                const overlay = document.getElementById('custom-modal-overlay');
                overlay.style.display = 'flex';
                overlay.classList.add('show');
            });
        }

        // 입력 팝업 (prompt 대체)
        function showPromptModal(title, defaultVal = '') {
            return new Promise(resolve => {
                _modalResolve = resolve;
                document.getElementById('custom-modal-title').textContent = title;
                const input = document.getElementById('custom-modal-input');
                input.style.display = '';
                input.value = defaultVal;
                const confirmBtn = document.getElementById('custom-modal-confirm');
                confirmBtn.textContent = '저장';
                confirmBtn.classList.remove('danger');
                confirmBtn.onclick = () => closeCustomModal(input.value.trim() || null);
                document.getElementById('custom-modal-cancel').style.display = '';
                const overlay = document.getElementById('custom-modal-overlay');
                overlay.style.display = 'flex';
                overlay.classList.add('show');
                setTimeout(() => input.focus(), 80);
                input.onkeydown = (e) => { if (e.key === 'Enter') confirmBtn.click(); };
            });
        }

        // 알림 팝업 (alert 대체)
        function showAlert(title) {
            return new Promise(resolve => {
                _modalResolve = resolve;
                document.getElementById('custom-modal-title').textContent = title;
                const input = document.getElementById('custom-modal-input');
                input.style.display = 'none';
                const confirmBtn = document.getElementById('custom-modal-confirm');
                confirmBtn.textContent = '확인';
                confirmBtn.classList.remove('danger');
                confirmBtn.onclick = () => closeCustomModal(true);
                document.getElementById('custom-modal-cancel').style.display = 'none';
                const overlay = document.getElementById('custom-modal-overlay');
                overlay.style.display = 'flex';
                overlay.classList.add('show');
            });
        }
        // ─────────────────────────────────────────────────────────

        // 카드 이름 변경 함수
        async function renameTask(event, taskId) {
            event.stopPropagation();
            const menu = document.getElementById(`card-menu-${taskId}`);
            if (menu) menu.classList.remove('show');

            const titleEl = document.getElementById(`task-name-${taskId}`);
            const currentTitle = titleEl ? titleEl.textContent : `#${taskId}`;

            const newTitle = await showPromptModal('그림 이름 변경', currentTitle);
            if (newTitle !== null && newTitle !== '') {
                const names = getTaskCustomNames();
                names[taskId] = newTitle;
                saveTaskCustomNames(names);
                fetchTasksStatus();
            }
        }

        // 로컬 커스텀 이름 저장/조회
        function getTaskCustomNames() {
            const data = localStorage.getItem('vico_task_custom_names');
            return data ? JSON.parse(data) : {};
        }

        function saveTaskCustomNames(dict) {
            localStorage.setItem('vico_task_custom_names', JSON.stringify(dict));
        }

        // 카드 순서 저장/조회
        function getTaskOrder() {
            const data = localStorage.getItem('vico_task_order');
            return data ? JSON.parse(data) : [];
        }

        function saveTaskOrder(orderArr) {
            localStorage.setItem('vico_task_order', JSON.stringify(orderArr));
        }

        // 실시간 상태 목록 렌더링 (시안 4번 스타일)
        function renderStatusList(tasks) {
            const container = document.getElementById('history-card-list');
            if (!container) return;

            // 태스크 캐시 저장 (별표 즉시 복원용)
            cachedTasks = tasks;

            if (tasks.length === 0) {
                container.innerHTML = `<div style="color: #94a3b8; text-align: center; padding: 30px 0; font-size: 0.9rem;">전송된 작업이 없습니다</div>`;
                return;
            }

            // 정렬 규칙: 1순위: 별표(★) 여부 (무조건 최상단)
            //            2순위: 사용자 선택 정렬 기준 (이름순 / 날짜순, 오름/내림)
            const customNames = getTaskCustomNames();
            const sm = currentSortMode;
            tasks.sort((a, b) => {
                const aStarred = isTaskSavedInLocal(a);
                const bStarred = isTaskSavedInLocal(b);
                if (aStarred && !bStarred) return -1;
                if (!aStarred && bStarred) return 1;

                const dir = sm.dir === 'asc' ? 1 : -1;
                if (sm.field === 'name') {
                    const nameA = (customNames[a.task_id] || `#${a.task_id}`).toLowerCase();
                    const nameB = (customNames[b.task_id] || `#${b.task_id}`).toLowerCase();
                    return nameA < nameB ? -dir : nameA > nameB ? dir : 0;
                } else {
                    // 날짜순: task_id를 날짜 대리로 사용 (큰 id = 최신)
                    return dir * (a.task_id - b.task_id) * -1;
                }
            });

            // 이미 존재하는 카드들의 경우, innerHTML 전체 재생성 대신 DOM 위치만 순서대로 이동 (스무스 애니메이션)
            const existingCards = Array.from(container.querySelectorAll('.history-card'));
            const canAnimate = existingCards.length > 0 && existingCards.length === tasks.length;

            if (canAnimate) {
                // 카드 순서 재배치 + 별표 상태 및 클릭 이벤트 동기화
                const cardMap = new Map();
                existingCards.forEach(c => cardMap.set(parseInt(c.dataset.taskId), c));

                tasks.forEach(t => {
                    const card = cardMap.get(t.task_id);
                    if (!card) return;
                    
                    // card-left 클릭 이벤트 갱신
                    const cardLeft = card.querySelector('.history-card-left');
                    if (cardLeft) {
                        cardLeft.onclick = (e) => openPreviewModal(e, t.task_id);
                    }

                    // 별표 버튼 상태 동기화
                    const starBtn = card.querySelector('.star-btn');
                    if (starBtn) {
                        const isSaved = isTaskSavedInLocal(t);
                        starBtn.textContent = isSaved ? '★' : '☆';
                        starBtn.title = isSaved ? '보관됨' : '보관';
                        starBtn.onclick = (e) => toggleStarTask(e, t.task_id);
                        if (isSaved) {
                            starBtn.classList.add('active');
                        } else {
                            starBtn.classList.remove('active');
                        }
                    }
                });

                animateCardReorder(container, () => {
                    const footer = container.querySelector('.history-footer');
                    tasks.forEach(t => {
                        const card = cardMap.get(t.task_id);
                        if (card) {
                            footer ? container.insertBefore(card, footer) : container.appendChild(card);
                        }
                    });
                });
                return;
            }


            const cardsHtml = tasks.map(task => {
                let badgeHtml = '';
                if (task.status === 'pending') {
                    badgeHtml = `<span class="badge-pending">대기 중</span>`;
                } else if (task.status === 'drawing') {
                    badgeHtml = `<span class="badge-pending" style="background:#e0f2fe; color:#0284c7;">출력 중</span>`;
                } else if (task.status === 'complete') {
                    badgeHtml = `<span class="badge-success">출력 완료</span>`;
                } else {
                    badgeHtml = `<span class="badge-error">오류</span>`;
                }

                const isSaved = isTaskSavedInLocal(task);

                const displayName = customNames[task.task_id] || `#${task.task_id}`;

                return `
                    <div class="history-card" data-task-id="${task.task_id}" draggable="false">
                        <div class="history-card-left" onclick="openPreviewModal(event, ${task.task_id})" style="cursor: pointer;" title="그림 크게 보기">
                            <div class="drag-handle" onclick="event.stopPropagation()" title="드래그하여 순서 변경">⋮⋮</div>
                            <div class="history-thumb-box">
                                <canvas class="thumb-canvas-svr-${task.task_id}" width="45" height="62" style="width:45px;height:62px;display:block;"></canvas>
                            </div>
                            <div class="history-info">
                                <div class="history-info-top">
                                    <span class="task-num" id="task-name-${task.task_id}">${displayName}</span>
                                    ${badgeHtml}
                                </div>
                                <span class="task-date">생성일 2026.08.13</span>
                            </div>
                        </div>
                        <div class="history-actions">
                            <button class="star-btn ${isSaved ? 'active' : ''}" onclick="toggleStarTask(event, ${task.task_id})" title="${isSaved ? '보관됨' : '보관'}">${isSaved ? '★' : '☆'}</button>
                            <button class="more-btn" onclick="toggleCardMenu(event, ${task.task_id})" title="메뉴">⋮</button>

                            <!-- 삼선 팝업 메뉴 -->
                            <div class="card-menu-popover" id="card-menu-${task.task_id}">
                                <button class="card-menu-item" onclick="reEditTask(event, ${task.task_id})">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg> 수정
                                </button>
                                <button class="card-menu-item" onclick="renameTask(event, ${task.task_id})">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg> 이름 변경
                                </button>
                                <button class="card-menu-item danger" onclick="deleteServerTask(event, ${task.task_id})">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg> 삭제
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // 카드 목록 아래에 '모두 삭제' 버튼 배치
            const clearFooterHtml = `
                <div class="history-footer" style="margin-top: 8px; margin-bottom: 24px;">
                    <button class="btn-clear-all" onclick="clearServerQueue()">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        모두 삭제
                    </button>
                </div>
            `;

            container.innerHTML = cardsHtml + (tasks.length > 0 ? clearFooterHtml : '');

            // 드래그 앤 드롭 이벤트 바인딩
            initCardDragAndDrop(container);

            setTimeout(() => {
                tasks.forEach(task => {
                    const canvas = document.querySelector(`.thumb-canvas-svr-${task.task_id}`);
                    if (canvas) {
                        const w = (task.width && task.width >= 500) ? task.width : (simData && simData.width >= 500 ? simData.width : 600);
                        const h = (task.height && task.height >= 500) ? task.height : (simData && simData.height >= 500 ? simData.height : 800);
                        drawThumb(canvas, task.contours, w, h);
                    }
                });
            }, 50);
        }

        // 내 그림 카드 순서 변경 핸들러 (우측 핸들 0초 즉시 드래그 + 본문 꾹 누르기 완벽 지원)
        function initCardDragAndDrop(container) {
            const cards = container.querySelectorAll('.history-card');
            let draggedCard = null;

            cards.forEach(card => {
                let longPressTimer = null;
                let isDragReady = false;
                let startX = 0, startY = 0;

                function activateDrag() {
                    if (isDragReady) return;
                    isDragReady = true;
                    draggedCard = card;
                    card.setAttribute('draggable', 'true');
                    card.classList.add('dragging');
                    card.style.transform = 'scale(0.97)';
                    card.style.boxShadow = '0 8px 24px rgba(99, 102, 241, 0.35)';
                    card.style.borderColor = '#6366f1';
                    if (navigator.vibrate) navigator.vibrate(30);
                }

                function cancelLongPress() {
                    if (longPressTimer) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                    }
                }

                function resetCard() {
                    cancelLongPress();
                    isDragReady = false;
                    card.classList.remove('dragging');
                    card.setAttribute('draggable', 'false');
                    card.style.transform = '';
                    card.style.boxShadow = '';
                    card.style.borderColor = '';
                }

                function updateOrderAndSave() {
                    const newOrder = Array.from(container.querySelectorAll('.history-card'))
                        .map(el => parseInt(el.getAttribute('data-task-id')));
                    saveTaskOrder(newOrder);
                }

                const handle = card.querySelector('.drag-handle');

                // ─── 마우스 이벤트 ───
                card.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    if (handle && handle.contains(e.target)) {
                        activateDrag();
                    } else {
                        longPressTimer = setTimeout(activateDrag, 350);
                    }
                });
                card.addEventListener('mouseup', () => {
                    if (draggedCard === card) {
                        updateOrderAndSave();
                    }
                    resetCard();
                    draggedCard = null;
                });
                card.addEventListener('mouseleave', () => {
                    if (draggedCard !== card) resetCard();
                });

                card.addEventListener('dragstart', (e) => {
                    if (!isDragReady) {
                        e.preventDefault();
                        return;
                    }
                    draggedCard = card;
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                card.addEventListener('dragend', () => {
                    resetCard();
                    draggedCard = null;
                    updateOrderAndSave();
                });

                card.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (!draggedCard || draggedCard === card) return;
                    const rect = card.getBoundingClientRect();
                    const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                    container.insertBefore(draggedCard, next ? card.nextSibling : card);
                });

                // ─── 터치 이벤트 (모바일 터치 및 수직 스크롤 완벽 지원) ───
                card.addEventListener('touchstart', (e) => {
                    const target = e.target;
                    // 별표 버튼, 삼점 메뉴 버튼, 팝업 메뉴 등 클릭 요소 터치 시 드래그 감지 완전 우회!
                    if (target && target.closest('.star-btn, .more-btn, .card-menu-popover, .card-menu-item, button')) {
                        return;
                    }

                    const touch = e.touches[0];
                    startX = touch.clientX;
                    startY = touch.clientY;

                    const pointTarget = document.elementFromPoint(startX, startY);
                    if (pointTarget && pointTarget.closest('.star-btn, .more-btn, .card-menu-popover, .card-menu-item, button')) {
                        return;
                    }

                    // 왼쪽 핸들(⋮⋮)을 터치하면 스크롤을 방지하고 0초 즉시 드래그 활성화!
                    if (handle && (handle.contains(pointTarget) || pointTarget === handle)) {
                        if (e.cancelable) e.preventDefault();
                        activateDrag();
                    } else {
                        // 일반 본문 터치 시에는 브라우저 기본 스크롤을 막지 않고, 350ms 꾹 누르기로 순서 변경 대기
                        longPressTimer = setTimeout(() => {
                            activateDrag();
                        }, 350);
                    }
                }, { passive: false });

                card.addEventListener('touchmove', (e) => {
                    if (e.target && e.target.closest('.star-btn, .more-btn, .card-menu-popover, .card-menu-item, button')) {
                        return;
                    }

                    const touch = e.touches[0];
                    const moveX = touch.clientX;
                    const moveY = touch.clientY;

                    // 아직 드래그 준비가 안 된 경우: 미세 손가락 떨림(12px 이내)은 롱프레스 취소하지 않음!
                    if (!isDragReady) {
                        const dist = Math.hypot(moveX - startX, moveY - startY);
                        if (dist > 12) {
                            cancelLongPress(); // 12px 이상 크게 움직였을 때만 스크롤로 인정하고 타이머 취소
                        }
                        return;
                    }

                    // 드래그 활성화 상태: 뷰포트 스크롤 완전 차단 및 실시간 이동
                    if (e.cancelable) e.preventDefault();

                    const targetEl = document.elementFromPoint(moveX, moveY);
                    if (!targetEl) return;

                    const targetCard = targetEl.closest('.history-card');
                    if (targetCard && targetCard !== draggedCard && targetCard.parentNode === container) {
                        const rect = targetCard.getBoundingClientRect();
                        const next = (moveY - rect.top) / (rect.bottom - rect.top) > 0.5;
                        container.insertBefore(draggedCard, next ? targetCard.nextSibling : targetCard);
                    }
                }, { passive: false });

                card.addEventListener('touchend', (e) => {
                    cancelLongPress();
                    if (isDragReady && draggedCard === card) {
                        updateOrderAndSave();
                    }
                    resetCard();
                    draggedCard = null;
                });

                card.addEventListener('touchcancel', () => {
                    resetCard();
                    draggedCard = null;
                });
            });
        }

        // 메뉴 토글 함수
        function toggleMenu(e) {
            e.stopPropagation();
            const willShow = !menuDropdown.classList.contains('show');
            menuDropdown.classList.toggle('show');
            eraserSizeMenu.classList.remove('show');

            if (willShow) {
                fetchTasksStatus();
                renderSavedList();
                if (!statusPollInterval) {
                    statusPollInterval = setInterval(fetchTasksStatus, 3000);
                }
            } else {
                if (statusPollInterval) {
                    clearInterval(statusPollInterval);
                    statusPollInterval = null;
                }
            }
        }

        // 내 그림 메뉴에서 '재출력 (수정)' 누를 때 호출되는 함수
        function reEditTask(e, taskId) {
            e.stopPropagation();
            document.querySelectorAll('.card-menu-popover').forEach(el => el.classList.remove('show'));
            if (menuDropdown) menuDropdown.classList.remove('show');
            if (statusPollInterval) {
                clearInterval(statusPollInterval);
                statusPollInterval = null;
            }

            const task = cachedTasks.find(t => t.task_id === taskId);
            if (!task || !task.contours) {
                showAlert("그림 데이터를 불러올 수 없습니다.");
                return;
            }

            let maxPtX = 0, maxPtY = 0;
            if (task.contours) {
                task.contours.forEach(c => { if (c) c.forEach(p => { if (p.x > maxPtX) maxPtX = p.x; if (p.y > maxPtY) maxPtY = p.y; }); });
            }
            let taskW = (task.width && task.width >= 500) ? task.width : (maxPtX > 600 ? 800 : 600);
            let taskH = (task.height && task.height >= 500) ? task.height : (maxPtX > 600 ? 600 : 800);
            if (taskH === 1200) taskH = 800;

            // 종이 방향도 태스크 비율에 맞춰 동기화
            overridePaperOrientation = (taskW > taskH) ? 'landscape' : 'portrait';
            const orientIcon = document.getElementById('paper-orient-icon');
            if (orientIcon) {
                orientIcon.className = overridePaperOrientation === 'landscape' ? 'orient-icon landscape' : 'orient-icon portrait';
            }

            // simData 세팅 및 contours 복원
            simData = {
                width: taskW,
                height: taskH,
                contours: JSON.parse(JSON.stringify(task.contours))
            };

            // workspace 화면으로 먼저 전환 후, resizeCanvas 완료 뒤 수정 모드 진입
            switchView('workspace');
            setTimeout(() => {
                startEditing();
            }, 80);
        }

        // 외부 클릭 시 메뉴 및 카드 팝업 닫기
        window.addEventListener('click', () => {
            document.querySelectorAll('.card-menu-popover').forEach(el => el.classList.remove('show'));
            menuDropdown.classList.remove('show');
            eraserSizeMenu.classList.remove('show');
            const cap = document.getElementById('canvas-add-popover');
            if (cap) cap.classList.remove('show');
            const sm = document.getElementById('shape-select-menu');
            if (sm) sm.classList.remove('show');
            const sortDd = document.getElementById('sort-dropdown');
            if (sortDd) sortDd.classList.remove('open');
            if (statusPollInterval) {
                clearInterval(statusPollInterval);
                statusPollInterval = null;
            }
        });

        // 서버 대기열 초기화 함수
        async function clearServerQueue() {
            const ok = await showConfirm('별표(★)된 그림을 제외하고 모두 삭제합니다.', true);
            if (!ok) return;

            try {
                const savedList = getLocalSavedDrawings();
                const savedIds = savedList.map(item => String(item.server_task_id)).filter(id => id !== undefined && id !== 'undefined');

                const response = await fetch('/api/clear-task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ saved_ids: savedIds })
                });

                if (!response.ok) {
                    const errorMsg = await response.text();
                    throw new Error(`서버 응답 오류 (${response.status}): ${errorMsg}`);
                }

                const result = await response.json();
                if (result.status === 'success') {
                    // 로컬 캐시 동기화: 별표 보관된 항목만 남기고 로컬 캐시 업데이트
                    const localData = localStorage.getItem('vico_cached_tasks');
                    if (localData) {
                        try {
                            const cached = JSON.parse(localData);
                            const updatedCached = cached.filter(t => savedIds.includes(String(t.task_id)) || t.status === 'drawing');
                            localStorage.setItem('vico_cached_tasks', JSON.stringify(updatedCached));
                        } catch (e) {}
                    }
                    await showAlert('삭제가 완료되었습니다.');
                    fetchTasksStatus();
                } else {
                    throw new Error(result.message || '삭제 실패');
                }
            } catch (err) {
                console.error('Clear Task Error:', err);
                await showAlert('삭제 중 오류가 발생했습니다: ' + err.message);
            }
        }

        // 서버 개별 태스크 삭제 함수
        async function deleteServerTask(event, taskId) {
            event.stopPropagation();
            const menu = document.getElementById(`card-menu-${taskId}`);
            if (menu) menu.classList.remove('show');

            const ok = await showConfirm(`그림 #${taskId}를 삭제할까요?`, true);
            if (!ok) return;

            try {
                const response = await fetch(`/api/delete-task?task_id=${taskId}`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    const errorMsg = await response.text();
                    throw new Error(`서버 응답 오류 (${response.status}): ${errorMsg}`);
                }

                const result = await response.json();
                if (result.status === 'success') {
                    // 1. 커스텀 이름 지우기
                    const customNames = getTaskCustomNames();
                    if (customNames[taskId]) {
                        delete customNames[taskId];
                        saveTaskCustomNames(customNames);
                    }
                    // 2. 로컬 캐시에서 해당 taskId 제거
                    const localData = localStorage.getItem('vico_cached_tasks');
                    if (localData) {
                        try {
                            const cached = JSON.parse(localData);
                            const updatedCached = cached.filter(t => t.task_id !== taskId);
                            localStorage.setItem('vico_cached_tasks', JSON.stringify(updatedCached));
                        } catch (e) {}
                    }
                    fetchTasksStatus();
                } else {
                    throw new Error(result.message || '삭제 실패');
                }
            } catch (err) {
                console.error('Delete Task Error:', err);
                await showAlert('삭제 중 오류가 발생했습니다: ' + err.message);
            }
        }

        // 초기화 및 캔버스 설정
        function initCanvas() {
            const container = document.getElementById('canvas-container');
            if (container) {
                inputCanvas.width = container.offsetWidth || 800;
                inputCanvas.height = container.offsetHeight || 600;
                simCanvas.width = container.offsetWidth || 800;
                simCanvas.height = container.offsetHeight || 600;
            }

            inputCtx.lineCap = 'round';
            inputCtx.lineJoin = 'round';
            inputCtx.lineWidth = 3;
            inputCtx.strokeStyle = '#000';
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();

        if (workArea) {
            workArea.addEventListener('click', (e) => {
                if (e.target.closest('#skip-button')) return;
                if (e.target.closest('.toolbar-panel') || e.target.closest('#popup-tray')) return;
                if (mode === 'idle' || mode === 'uploaded') {
                    fileInput.click();
                }
            });
        }

        // PC 마우스 휠 확대/축소 (Wheel Zoom)
        if (workArea) {
            workArea.addEventListener('wheel', (e) => {
                if (mode !== 'drawing' && mode !== 'editing' && mode !== 'simulating') return;
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.1 : -0.1;
                changeZoom(delta, { x: e.clientX, y: e.clientY });
            }, { passive: false });
        }

        // PC 마우스 드로잉 이벤트 처리
        inputCanvas.addEventListener('mousedown', startDrawing);
        inputCanvas.addEventListener('mousemove', (e) => {
            drawEraserCursor(e);
            draw(e);
        });
        inputCanvas.addEventListener('mouseup', stopDrawing);
        inputCanvas.addEventListener('mouseleave', (e) => {
            clearEraserCursor();
            stopDrawing(e);
        });

        // 모바일 2손가락 핀치 줌 (Pinch Zoom) 상태
        let initialPinchDist = null;
        let initialPinchScale = 1.0;

        // 그리기 로직 (터치 - 모바일 지원 + 핀치 줌)
        inputCanvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        inputCanvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        inputCanvas.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDist = null;
            }
            stopDrawing(e);
        });

        function getTouchPos(touchEvent) {
            const rect = inputCanvas.getBoundingClientRect();
            const touch = touchEvent.touches[0];
            return {
                x: (touch.clientX - rect.left) * (inputCanvas.width / rect.width),
                y: (touch.clientY - rect.top) * (inputCanvas.height / rect.height)
            };
        }

        // 지우개 커서 원형 미리보기
        let eraserCursorPos = null;
        let lastCanvasPos = null;

        function drawEraserCursor(e) {
            if (activeTool !== 'eraser' || (mode !== 'editing' && mode !== 'drawing')) {
                clearEraserCursor();
                return;
            }
            const pos = getMousePos(e);
            eraserCursorPos = pos;
            renderEraserCursorAt(pos.x, pos.y);
        }

        function clearEraserCursor() {
            eraserCursorPos = null;
            // isDrawing 중이 아닐 때만 inputCtx 지움
            if (!isDrawing) {
                inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
            }
        }

        function renderEraserCursorAt(x, y) {
            inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
            inputCtx.save();
            inputCtx.beginPath();
            inputCtx.arc(x, y, currentEraseRadius, 0, 2 * Math.PI);
            inputCtx.fillStyle = 'rgba(255, 77, 79, 0.12)';
            inputCtx.fill();
            inputCtx.strokeStyle = 'rgba(255, 77, 79, 0.55)';
            inputCtx.lineWidth = 1.5;
            inputCtx.setLineDash([4, 3]);
            inputCtx.stroke();
            inputCtx.setLineDash([]);
            inputCtx.restore();
        }

        function getMousePos(e) {
            const rect = inputCanvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (inputCanvas.width / rect.width),
                y: (e.clientY - rect.top) * (inputCanvas.height / rect.height)
            };
        }

        function toSimCoords(x, y) {
            const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
            const offsetX = (simCanvas.width - simData.width * scale) / 2;
            const offsetY = (simCanvas.height - simData.height * scale) / 2;
            return {
                x: (x - offsetX) / scale,
                y: (y - offsetY) / scale
            };
        }

        let simMoveStartPos = null;

        function handleTouchStart(e) {
            if (mode !== 'drawing' && mode !== 'editing' && mode !== 'simulating') return;
            e.preventDefault();

            // 손가락 2개 터치 시 -> 핀치 줌 시작
            if (e.touches.length === 2) {
                isDrawing = false;
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                initialPinchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                initialPinchScale = zoomScale;
                return;
            }

            // 손가락 1개 터치 시 -> 드로잉 시작
            if (e.touches.length === 1) {
                const pos = getTouchPos(e);
                startDrawingAt(pos.x, pos.y);
            }
        }

        function handleTouchMove(e) {
            if (mode !== 'drawing' && mode !== 'editing' && mode !== 'simulating') return;
            e.preventDefault();

            // 손가락 2개 터치 이동 시 -> 핀치 줌 실행
            if (e.touches.length === 2 && initialPinchDist) {
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                const currentDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                const scaleFactor = currentDist / initialPinchDist;
                const targetScale = initialPinchScale * scaleFactor;
                const delta = targetScale - zoomScale;
                
                const centerPt = {
                    x: (t1.clientX + t2.clientX) / 2,
                    y: (t1.clientY + t2.clientY) / 2
                };
                changeZoom(delta, centerPt);
                return;
            }

            // 손가락 1개 터치 이동 시 -> 드로잉 수행
            if (isDrawing && e.touches.length === 1) {
                const pos = getTouchPos(e);
                drawTo(pos.x, pos.y);
            }
        }

        function startDrawing(e) {
            if (mode !== 'drawing' && mode !== 'editing' && mode !== 'simulating') return;
            const pos = getMousePos(e);
            startDrawingAt(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            drawTo(pos.x, pos.y);
        }

        function startDrawingAt(x, y) {
            isDrawing = true;

            if (mode === 'simulating') {
                simMoveStartPos = { x, y };
                return;
            }

            if (mode === 'editing' || mode === 'drawing') {
                const pos = toSimCoords(x, y);

                // activeTool === 'shape' 모드일 때만 도형 클릭/드래그 선택 허용
                if (activeTool === 'shape') {
                    const hit = checkShapeHit(x, y);
                    if (hit) {
                        selectedShape = hit;
                        if (dragMode === 'delete_btn') {
                            deleteSelectedShape();
                            return;
                        }
                        if (dragMode === 'text_mode_toggle') {
                            saveHistoryState();
                            selectedShape.textMode = (selectedShape.textMode === 'outline') ? 'single' : 'outline';
                            drawAll();
                            return;
                        }
                        // 도형 각 코너의 시뮬레이션(월드) 좌표 계산 함수
                        const getSimCorner = (s, lx, ly) => {
                            const cx = s.x + s.w / 2;
                            const cy = s.y + s.h / 2;
                            const dx = s.x + lx - cx;
                            const dy = s.y + ly - cy;
                            const r = (s.rotation || 0) * Math.PI / 180;
                            return {
                                x: cx + dx * Math.cos(r) - dy * Math.sin(r),
                                y: cy + dx * Math.sin(r) + dy * Math.cos(r)
                            };
                        };

                        // 잡은 모서리 핸들의 대각선 반대쪽 꼭짓점을 고정점(anchor)으로 설정
                        let anchor = { x: hit.x, y: hit.y };
                        if (dragMode === 'resize') {
                            if (resizeHandleIdx === 0) {       // Top-Left (0, 0) 잡음 -> Anchor: Bottom-Right (w, h)
                                anchor = getSimCorner(hit, hit.w, hit.h);
                            } else if (resizeHandleIdx === 1) { // Top-Right (w, 0) 잡음 -> Anchor: Bottom-Left (0, h)
                                anchor = getSimCorner(hit, 0, hit.h);
                            } else if (resizeHandleIdx === 2) { // Bottom-Right (w, h) 잡음 -> Anchor: Top-Left (0, 0)
                                anchor = getSimCorner(hit, 0, 0);
                            } else if (resizeHandleIdx === 3) { // Bottom-Left (0, h) 잡음 -> Anchor: Top-Right (w, 0)
                                anchor = getSimCorner(hit, hit.w, 0);
                            }
                        }

                        dragStartPos = {
                            x: x,
                            y: y,
                            shapeX: hit.x,
                            shapeY: hit.y,
                            shapeW: hit.w,
                            shapeH: hit.h,
                            anchor: anchor
                        };
                        updateDeleteBar();
                        drawAll();
                        return;
                    } else {
                        // 허공 클릭 시 선택 해제하되 도형 모드 유지 (펜 모드로 자동 전환되지 않음)
                        selectedShape = null;
                        updateDeleteBar();
                        drawAll();
                        return;
                    }
                }

                if (activeTool === 'pen') {
                    selectedShape = null;
                    updateDeleteBar();
                    drawAll();

                    currentContour = [pos];
                    lastCanvasPos = { x: x, y: y };

                    inputCtx.beginPath();
                    inputCtx.moveTo(x, y);
                    inputCtx.strokeStyle = "#000000";
                    // 0.8mm 출력 펜 굵기를 화면 픽셀 단위로 환산
                    const scale = Math.min(inputCanvas.width / simData.width, inputCanvas.height / simData.height);
                    inputCtx.lineWidth = Math.max(1.5, scale * 0.8);
                    inputCtx.lineCap = 'round';
                    inputCtx.lineJoin = 'round';
                } else if (activeTool === 'eraser') {
                    saveHistoryState(); // 지우개 시작 시 히스토리 1회 기록
                    selectedShape = null;
                    updateDeleteBar();
                    eraseAt(pos);
                }
            }
        }

        function drawTo(x, y) {
            if (mode === 'simulating' && simMoveStartPos && simData && simData.contours) {
                const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
                const dx = (x - simMoveStartPos.x) / scale;
                const dy = (y - simMoveStartPos.y) / scale;

                if (dx !== 0 || dy !== 0) {
                    // contours 내의 모든 점을 dx, dy만큼 이동
                    simData.contours.forEach(contour => {
                        contour.forEach(pt => {
                            pt.x += dx;
                            pt.y += dy;
                        });
                    });
                    // activeContours 도 동기화
                    if (activeContours && activeContours !== simData.contours) {
                        activeContours.forEach(contour => {
                            contour.forEach(pt => {
                                pt.x += dx;
                                pt.y += dy;
                            });
                        });
                    }
                    simMoveStartPos = { x, y };
                    skipSimulation();
                }
                return;
            }

            if (mode === 'editing' || mode === 'drawing') {
                const pos = toSimCoords(x, y);

                if (activeTool === 'shape' && selectedShape && dragStartPos) {
                    const dx = x - dragStartPos.x;
                    const dy = y - dragStartPos.y;
                    const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
                    const simDx = dx / scale;
                    const simDy = dy / scale;

                    if (dragMode === 'move') {
                        selectedShape.x = dragStartPos.shapeX + simDx;
                        selectedShape.y = dragStartPos.shapeY + simDy;
                    } else if (dragMode === 'rotate') {
                        const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
                        const offsetX = (simCanvas.width - simData.width * scale) / 2;
                        const offsetY = (simCanvas.height - simData.height * scale) / 2;
                        const cx = (selectedShape.x + selectedShape.w / 2) * scale + offsetX;
                        const cy = (selectedShape.y + selectedShape.h / 2) * scale + offsetY;
                        // 중심점과 현재 좌표 간 각도 계산 (+90도로 상단 방향 정렬)
                        const rad = Math.atan2(y - cy, x - cx);
                        let deg = rad * (180 / Math.PI) + 90;
                        selectedShape.rotation = (deg % 360 + 360) % 360;
                    } else if (dragMode === 'resize') {
                        // 완벽한 Anchor(월드 고정점) 기반 2D 변환 리사이즈
                        const anchor = dragStartPos.anchor; // 월드(Sim) 좌표계 고정점
                        const rad = (selectedShape.rotation || 0) * Math.PI / 180;

                        // Anchor -> 현재 마우스(pos) 로 가는 월드 벡터
                        const V_world = { x: pos.x - anchor.x, y: pos.y - anchor.y };

                        // -rad 회전하여 Anchor 기준 로컬 벡터로 변환
                        const cos_r = Math.cos(-rad);
                        const sin_r = Math.sin(-rad);
                        const V_local = {
                            x: V_world.x * cos_r - V_world.y * sin_r,
                            y: V_world.x * sin_r + V_world.y * cos_r
                        };

                        // Anchor 위치 기준 새로운 Width, Height 구하기
                        let newW = dragStartPos.shapeW;
                        let newH = dragStartPos.shapeH;
                        let newAnchorLocal = { x: 0, y: 0 };

                        if (selectedShape.type === 'text') {
                            const aspect = (dragStartPos.shapeW || 1) / (dragStartPos.shapeH || 1);
                            if (resizeHandleIdx === 0) {       // Top-Left (Anchor: Bottom-Right w, h)
                                newW = Math.max(20, -V_local.x);
                                newH = newW / aspect;
                                newAnchorLocal = { x: newW, y: newH };
                            } else if (resizeHandleIdx === 1) { // Top-Right (Anchor: Bottom-Left 0, h)
                                newW = Math.max(20, V_local.x);
                                newH = newW / aspect;
                                newAnchorLocal = { x: 0, y: newH };
                            } else if (resizeHandleIdx === 2) { // Bottom-Right (Anchor: Top-Left 0, 0)
                                newW = Math.max(20, V_local.x);
                                newH = newW / aspect;
                                newAnchorLocal = { x: 0, y: 0 };
                            } else if (resizeHandleIdx === 3) { // Bottom-Left (Anchor: Top-Right w, 0)
                                newW = Math.max(20, -V_local.x);
                                newH = newW / aspect;
                                newAnchorLocal = { x: newW, y: 0 };
                            }
                        } else {
                            if (resizeHandleIdx === 0) {       // Top-Left 잡음 (Anchor: Bottom-Right w, h)
                                newW = Math.max(15, -V_local.x);
                                newH = Math.max(15, -V_local.y);
                                newAnchorLocal = { x: newW, y: newH };
                            } else if (resizeHandleIdx === 1) { // Top-Right 잡음 (Anchor: Bottom-Left 0, h)
                                newW = Math.max(15, V_local.x);
                                newH = Math.max(15, -V_local.y);
                                newAnchorLocal = { x: 0, y: newH };
                            } else if (resizeHandleIdx === 2) { // Bottom-Right 잡음 (Anchor: Top-Left 0, 0)
                                newW = Math.max(15, V_local.x);
                                newH = Math.max(15, V_local.y);
                                newAnchorLocal = { x: 0, y: 0 };
                            } else if (resizeHandleIdx === 3) { // Bottom-Left 잡음 (Anchor: Top-Right w, 0)
                                newW = Math.max(15, -V_local.x);
                                newH = Math.max(15, V_local.y);
                                newAnchorLocal = { x: newW, y: 0 };
                            }
                        }

                        const offset_local = {
                            x: newW / 2 - newAnchorLocal.x,
                            y: newH / 2 - newAnchorLocal.y
                        };

                        // +rad 회전하여 월드 오프셋 벡터로 변환
                        const cosA = Math.cos(rad);
                        const sinA = Math.sin(rad);
                        const offset_world = {
                            x: offset_local.x * cosA - offset_local.y * sinA,
                            y: offset_local.x * sinA + offset_local.y * cosA
                        };

                        // 새 도형의 월드 중심
                        const newCenter_world = {
                            x: anchor.x + offset_world.x,
                            y: anchor.y + offset_world.y
                        };

                        // 새 도형의 월드 좌상단(origin x, y) 결정
                        selectedShape.x = newCenter_world.x - newW / 2;
                        selectedShape.y = newCenter_world.y - newH / 2;
                        selectedShape.w = newW;
                        selectedShape.h = newH;
                    }
                    updateDeleteBar();
                    drawAll();
                    return;
                }

                if (activeTool === 'pen' && currentContour) {
                    const lastPt = currentContour[currentContour.length - 1];
                    if (lastPt) {
                        const dist = Math.hypot(pos.x - lastPt.x, pos.y - lastPt.y);
                        // 4px 미만 이동은 손떨림으로 무시하여 선을 매우 부드럽게 유지
                        if (dist < 4) return;

                        // 로패스 가우시안 필터링 (alpha=0.35) 부드러운 호 그리기
                        const alpha = 0.35;
                        const smoothed = {
                            x: lastPt.x + (pos.x - lastPt.x) * alpha,
                            y: lastPt.y + (pos.y - lastPt.y) * alpha
                        };

                        currentContour.push(smoothed);
                        // 화면 픽셀 복원 렌더링
                        const scale = Math.min(inputCanvas.width / simData.width, inputCanvas.height / simData.height);
                        const offX = (inputCanvas.width - simData.width * scale) / 2;
                        const offY = (inputCanvas.height - simData.height * scale) / 2;

                        // 커브 곡선 보정 (quadraticCurveTo)
                        const prevPt = currentContour[currentContour.length - 2] || lastPt;
                        const midX = (prevPt.x + smoothed.x) / 2 * scale + offX;
                        const midY = (prevPt.y + smoothed.y) / 2 * scale + offY;
                        const prevX = prevPt.x * scale + offX;
                        const prevY = prevPt.y * scale + offY;

                        inputCtx.quadraticCurveTo(prevX, prevY, midX, midY);
                        inputCtx.stroke();
                    }
                } else if (activeTool === 'eraser') {
                    eraseAt(pos);
                    renderEraserCursorAt(x, y);
                }
            }
        }

        // 도형을 촘촘한 벡터 점으로 변환 (지우개 처리 및 G-code 변환용, 회전 반영)
        function shapeToContour(s) {
            const rawPts = [];
            const SEG = 80; // 분할 수
            if (s.type === 'rect') {
                const n = Math.ceil(SEG / 4);
                for (let i = 0; i <= n; i++) rawPts.push({ x: s.x + s.w * i / n, y: s.y });
                for (let i = 1; i <= n; i++) rawPts.push({ x: s.x + s.w, y: s.y + s.h * i / n });
                for (let i = 1; i <= n; i++) rawPts.push({ x: s.x + s.w - s.w * i / n, y: s.y + s.h });
                for (let i = 1; i <= n; i++) rawPts.push({ x: s.x, y: s.y + s.h - s.h * i / n });
            } else if (s.type === 'circle') {
                const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
                const rx = Math.abs(s.w / 2), ry = Math.abs(s.h / 2);
                for (let i = 0; i <= SEG; i++) {
                    const rad = (i / SEG) * 2 * Math.PI;
                    rawPts.push({ x: cx + rx * Math.cos(rad), y: cy + ry * Math.sin(rad) });
                }
            } else if (s.type === 'triangle') {
                const n = Math.ceil(SEG / 3);
                const p1 = { x: s.x + s.w / 2, y: s.y };
                const p2 = { x: s.x + s.w, y: s.y + s.h };
                const p3 = { x: s.x, y: s.y + s.h };
                for (let i = 0; i < n; i++) { const t = i / n; rawPts.push({ x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t }); }
                for (let i = 0; i < n; i++) { const t = i / n; rawPts.push({ x: p2.x + (p3.x - p2.x) * t, y: p2.y + (p3.y - p2.y) * t }); }
                for (let i = 0; i <= n; i++) { const t = i / n; rawPts.push({ x: p3.x + (p1.x - p3.x) * t, y: p3.y + (p1.y - p3.y) * t }); }
            } else if (s.type === 'line') {
                for (let i = 0; i <= SEG; i++) {
                    rawPts.push({ x: s.x + s.w * i / SEG, y: s.y + s.h * i / SEG });
                }
            } else if (s.type === 'text') {
                if (!s.text || s.text.trim() === '') return [];
                if (s.textMode === 'outline') {
                    return extractTextOutlineContours(s); // ㅁ 윤곽선 모드
                } else {
                    return extractTextSingleLineContours(s); // ㅡ 손글씨 1선 모드 (기본값)
                }
            }

            // 일반 도형(line, rect, triangle, circle)은 단일 Contour 반환
            const angle = (s.rotation || 0) * Math.PI / 180;
            if (!angle) return rawPts;

            const cx = s.x + s.w / 2;
            const cy = s.y + s.h / 2;
            return rawPts.map(pt => {
                const dx = pt.x - cx;
                const dy = pt.y - cy;
                return {
                    x: cx + dx * Math.cos(angle) - dy * Math.sin(angle),
                    y: cy + dx * Math.sin(angle) + dy * Math.cos(angle)
                };
            });
        }

        // ㅁ 윤곽선 모드: 외곽선 및 내부 구멍 루프(Contour Loops) 추출
        function extractTextOutlineContours(s) {
            if (!s.text || s.text.trim() === '') return [];

            const fontH = 100;
            const scaleF = 2; // 고해상도 벡터 샘플링
            const offCanvas = document.createElement('canvas');
            const tmpCtx = offCanvas.getContext('2d');
            tmpCtx.font = `700 ${fontH * scaleF}px "Pretendard", -apple-system, sans-serif`;
            
            const textStr = s.text.trim();
            const metrics = tmpCtx.measureText(textStr);
            const textPixelW = Math.max(160 * scaleF, Math.ceil(metrics.width) + 60 * scaleF);
            const textPixelH = 160 * scaleF;

            offCanvas.width = textPixelW;
            offCanvas.height = textPixelH;

            const offCtx = offCanvas.getContext('2d');
            offCtx.font = `700 ${fontH * scaleF}px "Pretendard", -apple-system, sans-serif`;
            offCtx.fillStyle = "#000000";
            offCtx.textAlign = "center";
            offCtx.textBaseline = "middle";
            offCtx.fillText(textStr, textPixelW / 2, textPixelH / 2);

            const imgData = offCtx.getImageData(0, 0, textPixelW, textPixelH);
            const data = imgData.data;
            const W = textPixelW;
            const H = textPixelH;

            const grid = new Uint8Array(W * H);
            let minPX = W, maxPX = 0, minPY = H, maxPY = 0;
            let hasPixel = false;

            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    const alpha = data[(y * W + x) * 4 + 3];
                    if (alpha > 90) {
                        grid[y * W + x] = 1;
                        if (x < minPX) minPX = x;
                        if (x > maxPX) maxPX = x;
                        if (y < minPY) minPY = y;
                        if (y > maxPY) maxPY = y;
                        hasPixel = true;
                    }
                }
            }

            if (!hasPixel || maxPX <= minPX || maxPY <= minPY) return [];

            const visited = new Uint8Array(W * H);
            const rawContours = [];

            function isBnd(x, y) {
                if (!grid[y * W + x]) return false;
                if (x === 0 || x === W - 1 || y === 0 || y === H - 1) return true;
                return (
                    !grid[y * W + (x + 1)] ||
                    !grid[y * W + (x - 1)] ||
                    !grid[(y + 1) * W + x] ||
                    !grid[(y - 1) * W + x]
                );
            }

            const dx = [1, 1, 0, -1, -1, -1, 0, 1];
            const dy = [0, 1, 1, 1, 0, -1, -1, -1];

            for (let y = 1; y < H - 1; y += 2) {
                for (let x = 1; x < W - 1; x += 2) {
                    const idx = y * W + x;
                    if (grid[idx] && !visited[idx] && isBnd(x, y)) {
                        const loop = [];
                        let cx = x, cy = y;
                        let dir = 0;
                        const startX = x, startY = y;
                        let steps = 0;
                        const maxSteps = W * H;

                        while (steps < maxSteps) {
                            visited[cy * W + cx] = 1;
                            loop.push({ x: cx, y: cy });

                            let found = false;
                            const sDir = (dir + 5) % 8;
                            for (let d = 0; d < 8; d++) {
                                const cDir = (sDir + d) % 8;
                                const nx = cx + dx[cDir];
                                const ny = cy + dy[cDir];
                                if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
                                    if (grid[ny * W + nx] && isBnd(nx, ny)) {
                                        cx = nx;
                                        cy = ny;
                                        dir = cDir;
                                        found = true;
                                        break;
                                    }
                                }
                            }

                            if (!found || (cx === startX && cy === startY)) break;
                            steps++;
                        }

                        if (loop.length >= 4) {
                            loop.push({ x: loop[0].x, y: loop[0].y });
                            const smoothPts = [];
                            let lastPt = null;
                            for (const p of loop) {
                                if (!lastPt || Math.hypot(p.x - lastPt.x, p.y - lastPt.y) >= 4) {
                                    smoothPts.push(p);
                                    lastPt = p;
                                }
                            }
                            if (smoothPts.length >= 3) {
                                rawContours.push(smoothPts);
                            }
                        }
                    }
                }
            }

            // 사용자가 조절한 텍스트 박스 크기(s.w, s.h)에 1:1로 가득 채워지도록 매핑 (완료 시 작아짐 현원 방지)
            const rangeX = Math.max(maxPX - minPX, 1);
            const rangeY = Math.max(maxPY - minPY, 1);
            const angle = (s.rotation || 0) * Math.PI / 180;
            const centerSimX = s.x + s.w / 2;
            const centerSimY = s.y + s.h / 2;
            const scaleX = s.w / rangeX;
            const scaleY = s.h / rangeY;
            const uniformScale = Math.min(scaleX, scaleY);

            return rawContours.map(loop => {
                return loop.map(pt => {
                    const lx = (pt.x - (minPX + rangeX / 2)) * uniformScale;
                    const ly = (pt.y - (minPY + rangeY / 2)) * uniformScale;

                    if (!angle) {
                        return { x: centerSimX + lx, y: centerSimY + ly };
                    }
                    return {
                        x: centerSimX + lx * Math.cos(angle) - ly * Math.sin(angle),
                        y: centerSimY + lx * Math.sin(angle) + ly * Math.cos(angle)
                    };
                });
            });
        }

        // ㅡ 손글씨 모드: 윤곽선 없이 정밀한 단일 획 중심선(Zhang-Suen Thinning Skeleton) 추출
        function extractTextSingleLineContours(s) {
            if (!s.text || s.text.trim() === '') return [];

            const fontH = 100;
            const scaleF = 2;
            const textStr = s.text.trim();

            const offCanvas = document.createElement('canvas');
            const tmpCtx = offCanvas.getContext('2d');
            tmpCtx.font = `700 ${fontH * scaleF}px "Pretendard", -apple-system, sans-serif`;
            
            const metrics = tmpCtx.measureText(textStr);
            const textPixelW = Math.max(160 * scaleF, Math.ceil(metrics.width) + 60 * scaleF);
            const textPixelH = 160 * scaleF;

            offCanvas.width = textPixelW;
            offCanvas.height = textPixelH;

            const offCtx = offCanvas.getContext('2d');
            offCtx.font = `700 ${fontH * scaleF}px "Pretendard", -apple-system, sans-serif`;
            offCtx.fillStyle = "#000000";
            offCtx.textAlign = "center";
            offCtx.textBaseline = "middle";
            offCtx.fillText(textStr, textPixelW / 2, textPixelH / 2);

            const imgData = offCtx.getImageData(0, 0, textPixelW, textPixelH);
            const data = imgData.data;
            const W = textPixelW;
            const H = textPixelH;

            // 1. 이진화 그리드 및 바운딩 박스 생성
            const grid = new Uint8Array(W * H);
            let minPX = W, maxPX = 0, minPY = H, maxPY = 0;
            let hasPixel = false;

            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    if (data[(y * W + x) * 4 + 3] > 80) {
                        grid[y * W + x] = 1;
                        if (x < minPX) minPX = x;
                        if (x > maxPX) maxPX = x;
                        if (y < minPY) minPY = y;
                        if (y > maxPY) maxPY = y;
                        hasPixel = true;
                    }
                }
            }

            if (!hasPixel || maxPX <= minPX || maxPY <= minPY) return [];

            // 2. Zhang-Suen Thinning 알고리즘으로 1픽셀 두께의 중심선 스켈레톤 추출
            const skel = new Uint8Array(grid);

            function getNeighbors(x, y) {
                const p2 = skel[(y - 1) * W + x];
                const p3 = skel[(y - 1) * W + (x + 1)];
                const p4 = skel[y * W + (x + 1)];
                const p5 = skel[(y + 1) * W + (x + 1)];
                const p6 = skel[(y + 1) * W + x];
                const p7 = skel[(y + 1) * W + (x - 1)];
                const p8 = skel[y * W + (x - 1)];
                const p9 = skel[(y - 1) * W + (x - 1)];
                return [p2, p3, p4, p5, p6, p7, p8, p9];
            }

            let change = true;
            while (change) {
                change = false;
                // Step 1
                const toDelete1 = [];
                for (let y = 1; y < H - 1; y++) {
                    for (let x = 1; x < W - 1; x++) {
                        if (skel[y * W + x] === 1) {
                            const [p2, p3, p4, p5, p6, p7, p8, p9] = getNeighbors(x, y);
                            const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
                            if (B >= 2 && B <= 6) {
                                const n = [p2, p3, p4, p5, p6, p7, p8, p9, p2];
                                let A = 0;
                                for (let i = 0; i < 8; i++) {
                                    if (n[i] === 0 && n[i + 1] === 1) A++;
                                }
                                if (A === 1) {
                                    if ((p2 * p4 * p6 === 0) && (p4 * p6 * p8 === 0)) {
                                        toDelete1.push(y * W + x);
                                    }
                                }
                            }
                        }
                    }
                }
                for (let i = 0; i < toDelete1.length; i++) {
                    skel[toDelete1[i]] = 0;
                    change = true;
                }

                // Step 2
                const toDelete2 = [];
                for (let y = 1; y < H - 1; y++) {
                    for (let x = 1; x < W - 1; x++) {
                        if (skel[y * W + x] === 1) {
                            const [p2, p3, p4, p5, p6, p7, p8, p9] = getNeighbors(x, y);
                            const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
                            if (B >= 2 && B <= 6) {
                                const n = [p2, p3, p4, p5, p6, p7, p8, p9, p2];
                                let A = 0;
                                for (let i = 0; i < 8; i++) {
                                    if (n[i] === 0 && n[i + 1] === 1) A++;
                                }
                                if (A === 1) {
                                    if ((p2 * p4 * p8 === 0) && (p2 * p6 * p8 === 0)) {
                                        toDelete2.push(y * W + x);
                                    }
                                }
                            }
                        }
                    }
                }
                for (let i = 0; i < toDelete2.length; i++) {
                    skel[toDelete2[i]] = 0;
                    change = true;
                }
            }

            // 3. 스켈레톤 픽셀 추적하여 strokePaths 생성
            const visited = new Uint8Array(W * H);
            const strokePaths = [];
            const dx = [1, 1, 0, -1, -1, -1, 0, 1];
            const dy = [0, 1, 1, 1, 0, -1, -1, -1];

            for (let y = 1; y < H - 1; y++) {
                for (let x = 1; x < W - 1; x++) {
                    const idx = y * W + x;
                    if (skel[idx] && !visited[idx]) {
                        const path = [];
                        let cx = x, cy = y;
                        let steps = 0;
                        const maxSteps = W * H;

                        while (steps < maxSteps) {
                            visited[cy * W + cx] = 1;
                            path.push({ x: cx, y: cy });

                            let found = false;
                            for (let d = 0; d < 8; d++) {
                                const nx = cx + dx[d];
                                const ny = cy + dy[d];
                                if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
                                    if (skel[ny * W + nx] && !visited[ny * W + nx]) {
                                        cx = nx;
                                        cy = ny;
                                        found = true;
                                        break;
                                    }
                                }
                            }
                            if (!found) break;
                            steps++;
                        }

                        if (path.length >= 2) {
                            const smoothPts = [];
                            let lastPt = null;
                            for (const p of path) {
                                if (!lastPt || Math.hypot(p.x - lastPt.x, p.y - lastPt.y) >= 3) {
                                    smoothPts.push(p);
                                    lastPt = p;
                                }
                            }
                            if (smoothPts.length >= 2) {
                                strokePaths.push(smoothPts);
                            }
                        }
                    }
                }
            }

            // 사용자가 조절한 텍스트 박스 크기(s.w, s.h)에 1:1로 가득 채워지도록 매핑 (완료 시 작아짐 현상 방지)
            const rangeX = Math.max(maxPX - minPX, 1);
            const rangeY = Math.max(maxPY - minPY, 1);
            const angle = (s.rotation || 0) * Math.PI / 180;
            const centerSimX = s.x + s.w / 2;
            const centerSimY = s.y + s.h / 2;
            const scaleX = s.w / rangeX;
            const scaleY = s.h / rangeY;
            const uniformScale = Math.min(scaleX, scaleY);

            return strokePaths.map(path => {
                return path.map(pt => {
                    const lx = (pt.x - (minPX + rangeX / 2)) * uniformScale;
                    const ly = (pt.y - (minPY + rangeY / 2)) * uniformScale;

                    if (!angle) {
                        return { x: centerSimX + lx, y: centerSimY + ly };
                    }
                    return {
                        x: centerSimX + lx * Math.cos(angle) - ly * Math.sin(angle),
                        y: centerSimY + lx * Math.sin(angle) + ly * Math.cos(angle)
                    };
                });
            });
        }

        // 선택 도형 삭제 버튼 위치 갱신 및 도형 4종 추가 서브메뉴 표시 동기화
        function updateDeleteBar() {
            const btn = document.getElementById('floating-shape-delete-btn');
            const sm = document.getElementById('shape-select-menu');
            if (selectedShape && simData) {
                const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
                const offsetX = (simCanvas.width - simData.width * scale) / 2;
                const offsetY = (simCanvas.height - simData.height * scale) / 2;

                const sx = selectedShape.x * scale + offsetX;
                const sy = selectedShape.y * scale + offsetY;
                const sw = selectedShape.w * scale;
                const sh = selectedShape.h * scale;

                const topY = Math.min(sy, sy + sh);
                const centerX = sx + sw / 2;

                if (btn) {
                    btn.style.left = centerX + 'px';
                    btn.style.top = (topY - 12) + 'px';
                    btn.style.display = 'block';
                }
                if (sm) sm.classList.remove('show');
            } else {
                if (btn) btn.style.display = 'none';
                if (sm) {
                    if (activeTool === 'shape') {
                        sm.classList.add('show');
                    } else {
                        sm.classList.remove('show');
                    }
                }
            }
        }

        // 점 P와 선분 AB 사이의 최단 거리 제곱 계산 함수
        function distToSegmentSquared(p, v, w) {
            const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
            if (l2 === 0) return (p.x - v.x) ** 2 + (p.y - v.y) ** 2;
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return (p.x - (v.x + t * (w.x - v.x))) ** 2 + (p.y - (v.y + t * (w.y - v.y))) ** 2;
        }

        let lastErasePos = null;

        function eraseAt(pos) {
            if (!simData) return;

            const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
            const offsetX = (simCanvas.width - simData.width * scale) / 2;
            const offsetY = (simCanvas.height - simData.height * scale) / 2;

            // 지우개의 실제 화면 픽셀 반경 (+2px 넉넉한 터치 버퍼)
            const rPx = currentEraseRadius + 2;
            const rPxSq = rPx * rPx;

            // 시뮬레이션 좌표 pos를 다시 화면 픽셀 좌표로 변환
            const erasePx = {
                x: pos.x * scale + offsetX,
                y: pos.y * scale + offsetY
            };

            const erasePoints = [erasePx];
            if (lastErasePos) {
                const lastPx = {
                    x: lastErasePos.x * scale + offsetX,
                    y: lastErasePos.y * scale + offsetY
                };
                const dist = Math.hypot(erasePx.x - lastPx.x, erasePx.y - lastPx.y);
                const steps = Math.ceil(dist / Math.max(2, rPx * 0.5));
                for (let i = 1; i <= steps; i++) {
                    const t = i / steps;
                    erasePoints.push({
                        x: lastPx.x + (erasePx.x - lastPx.x) * t,
                        y: lastPx.y + (erasePx.y - lastPx.y) * t
                    });
                }
            }
            lastErasePos = pos;

            // 1. 선(contour) 지우기 (화면 픽셀 좌표 기준 정밀 판단)
            let newContours = [];
            let erased = false;

            for (let contour of activeContours) {
                if (!contour || contour.length === 0) continue;
                let currentChunk = [];

                for (let i = 0; i < contour.length; i++) {
                    const pt = contour[i];
                    const ptPx = {
                        x: pt.x * scale + offsetX,
                        y: pt.y * scale + offsetY
                    };
                    const prevPt = contour[i - 1] || pt;
                    const prevPtPx = {
                        x: prevPt.x * scale + offsetX,
                        y: prevPt.y * scale + offsetY
                    };
                    const nextPt = contour[i + 1] || pt;
