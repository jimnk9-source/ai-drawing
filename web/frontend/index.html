                    const nextPtPx = {
                        x: nextPt.x * scale + offsetX,
                        y: nextPt.y * scale + offsetY
                    };

                    let isHit = false;
                    for (const ePos of erasePoints) {
                        const d1Sq = distToSegmentSquared(ePos, prevPtPx, ptPx);
                        const d2Sq = distToSegmentSquared(ePos, ptPx, nextPtPx);
                        if (Math.min(d1Sq, d2Sq) <= rPxSq) {
                            isHit = true;
                            break;
                        }
                    }

                    if (!isHit) {
                        currentChunk.push(pt);
                    } else {
                        erased = true;
                        if (currentChunk.length > 0) {
                            newContours.push(currentChunk);
                            currentChunk = [];
                        }
                    }
                }
                if (currentChunk.length > 0) {
                    newContours.push(currentChunk);
                }
            }
            if (erased) {
                activeContours = newContours;
            }

            // 2. 도형(shape) 부분 지우기 - 지우개 원 범위에 드는 점만 지우고 쪼개기
            const newShapes = [];
            let shapeChanged = false;

            for (const s of shapes) {
                // 바운딩 박스로 빠르게 오버랩 점검 (속도 향상)
                const minX = Math.min(s.x, s.x + s.w) - eraseRadius;
                const maxX = Math.max(s.x, s.x + s.w) + eraseRadius;
                const minY = Math.min(s.y, s.y + s.h) - eraseRadius;
                const maxY = Math.max(s.y, s.y + s.h) + eraseRadius;
                const inBox = pos.x >= minX && pos.x <= maxX && pos.y >= minY && pos.y <= maxY;

                if (!inBox) {
                    newShapes.push(s); // 바깥이면 유지
                    continue;
                }

                // 점으로 분산하여 지우개 내부의 영역만 부분 커팅
                let ptsOrContours = shapeToContour(s);
                // 단일 컨투어면 모양 통일을 위해 배열로 감싸줌
                if (ptsOrContours.length > 0 && !Array.isArray(ptsOrContours[0])) {
                    ptsOrContours = [ptsOrContours];
                }

                let shapePartErased = false;

                for (const pts of ptsOrContours) {
                    let currentChunk = [];
                    for (const pt of pts) {
                        const d = Math.hypot(pt.x - pos.x, pt.y - pos.y);
                        if (d > eraseRadius) {
                            currentChunk.push(pt);
                        } else {
                            shapePartErased = true;
                            if (currentChunk.length > 1) {
                                activeContours.push(currentChunk); // 살아남은 조각은 영속적인 펜으로 전송
                            }
                            currentChunk = [];
                        }
                    }
                    if (currentChunk.length > 1) {
                        activeContours.push(currentChunk);
                    }
                }

                if (shapePartErased) {
                    shapeChanged = true;
                    if (selectedShape && selectedShape.id === s.id) {
                        selectedShape = null;
                        updateDeleteBar();
                    }
                    erased = true;
                    // shapes 배열에 추가하지 않고 완전히 쪼개진 벡터 선들로 흡수됨
                } else {
                    newShapes.push(s); // 실제로 지우개에 걸치는 부분이 없으면 유지
                }
            }

            shapes = newShapes;

            if (erased || shapeChanged) {
                drawAll();
            }
        }

        function stopDrawing() {
            lastCanvasPos = null;
            lastErasePos = null;
            simMoveStartPos = null;
            const wasDrawingShape = (activeTool === 'shape' && dragMode);
            isDrawing = false;
            if (activeTool === 'shape') {
                if (wasDrawingShape) {
                    saveHistoryState(); // 도형 이동/회전/리사이즈 조작 완료 시 히스토리 저장
                }
                dragMode = null;
                dragStartPos = null;
                return;
            }
            if ((mode === 'editing' || mode === 'drawing') && activeTool === 'pen') {
                if (currentContour && currentContour.length < 2) {
                    currentContour = null;
                } else if (currentContour && currentContour.length >= 2) {
                    activeContours.push(currentContour);
                    currentContour = null;
                    // 성공적으로 한 스트로크를 완주했을 때 최소 단위 히스토리 1회 저장
                    saveHistoryState();
                }
            }
            if (mode === 'editing' || mode === 'drawing') {
                drawAll();
                inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
                // 지우개 커서 포지션이 있으면 재렌더 (손가락을 떼도 원형 미리보기 유지)
                if (activeTool === 'eraser' && eraserCursorPos) {
                    renderEraserCursorAt(eraserCursorPos.x, eraserCursorPos.y);
                }
            } else {
                inputCtx.globalCompositeOperation = 'source-over';
            }
        }

        // 파일 선택 시 이벤트 처리
        fileInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                switchView('workspace'); // 업로드 시 드로잉/시뮬레이션 워크스페이스로 화면 자동 전환
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImage.src = e.target.result;
                    lastInputMode = 'uploaded';
                    // 파일 선택 즉시 서버로 전송하여 처리 및 시뮬레이션 시작
                    processImage(file);
                }
                reader.readAsDataURL(file);
            }
        });

        function setMode(newMode) {
            // simulating으로 전환 시 기존 캔버스 상태(drawing 클래스 등) 보존
            const prevMode = mode;
            mode = newMode;
            if (workArea && mode !== 'simulating') workArea.className = 'canvas-container';

            // 모드 전환 시 도형 초기화 (simulating 전환 시에는 유지)
            if (mode !== 'simulating') {
                shapes = [];
                selectedShape = null;
                updateDeleteBar();
            }

            const btnEdit = document.getElementById('btn-edit-action');
            const btnComplete = document.getElementById('btn-complete-action');
            const toolsRowContainer = document.querySelector('.tools-row-container');
            const btnCanvasUpload = document.getElementById('btn-canvas-upload');
            const zoomController = document.querySelector('.zoom-controller');

            if (mode === 'simulating') {
                // 완료 후: 도구 행 숨기기 + 수정 버튼 및 전송 버튼 노출
                // 캔버스(종이)는 그대로 유지
                if (toolsRowContainer) toolsRowContainer.style.display = 'none';
                if (btnCanvasUpload) btnCanvasUpload.style.display = 'none';
                if (zoomController) zoomController.style.display = 'none';
                if (btnEdit) btnEdit.style.display = 'block';
                if (btnComplete) {
                    btnComplete.style.display = 'block';
                    btnComplete.textContent = '전송';
                }
            } else {
                // 그리기/편집 중: 도구 행 노출 + 수정 버튼 숨기기 + 완료 버튼 노출
                if (toolsRowContainer) toolsRowContainer.style.display = 'flex';
                if (btnCanvasUpload) btnCanvasUpload.style.display = 'flex';
                if (zoomController) zoomController.style.display = 'flex';
                if (btnEdit) btnEdit.style.display = 'none';
                if (btnComplete) {
                    btnComplete.style.display = 'block';
                    btnComplete.textContent = '완료';
                }
            }

            if (mode === 'idle') {
                resetEditToolsPos();
                previewImage.src = '#';
                inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
                simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
                fileInput.value = '';
                simData = null;
                lastInputMode = 'idle';
            }
            else if (mode === 'uploaded') {
                if (workArea) workArea.classList.add('has-image');
            }
            else if (mode === 'drawing') {
                if (workArea) workArea.classList.add('drawing');
                lastInputMode = 'drawing';
                setEditTool('pen');

                // 이미 진행 중인 드로잉 데이터가 없다면 새로 생성 (기존 작업 유지)
                if (!simData || !simData.contours) {
                    const isLandscapeNow = (overridePaperOrientation === 'landscape');
                    simData = {
                        width: isLandscapeNow ? 800 : 600,
                        height: isLandscapeNow ? 600 : 800,
                        contours: []
                    };
                    activeContours = simData.contours;
                    inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
                    simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
                } else {
                    activeContours = simData.contours;
                    drawAll();
                }
            }
            else if (mode === 'editing') {
                if (workArea) {
                    workArea.classList.add('editing');
                    if (previewImage.src !== '#') workArea.classList.add('has-image');
                }
                setEditTool('pen');
            }
            else if (mode === 'simulating') {
                // 이전 drawing/editing 클래스 복원 (캔버스 유지)
                if (workArea && prevMode === 'drawing') workArea.classList.add('drawing');
                else if (workArea && prevMode === 'editing') workArea.classList.add('editing');
                // 그림 그대로 재렌더
                setTimeout(drawAll, 50);
            }

            // UI 요소 가시성 변경 후 캔버스 해상도 및 비율 재동기화
            if (mode !== 'simulating') setTimeout(resizeCanvas, 0);
        }

        function drawAll() {
            if (!simData) return;
            // 1. 기존 선 렌더링
            renderContours(activeContours, simCtx);
            // 2. 추가된 도형 렌더링
            renderShapes(shapes, simCtx);
        }

        function renderContours(contours, ctx) {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            if (!simData) return;
            drawContoursOnly(contours, ctx);
        }

        function drawContoursOnly(contours, ctx) {
            const scale = Math.min(ctx.canvas.width / simData.width, ctx.canvas.height / simData.height);
            const offsetX = (ctx.canvas.width - simData.width * scale) / 2;
            const offsetY = (ctx.canvas.height - simData.height * scale) / 2;

            // 0.8mm 실제 출력 펜 굵기를 논리 단위/화면 scale에 맞춰 실감나게 계산
            const strokeMm = 0.8;
            const strokePx = Math.max(1.5, scale * strokeMm);

            ctx.strokeStyle = "#000000";
            ctx.lineWidth = strokePx;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            contours.forEach(contour => {
                if (!contour || contour.length === 0) return;
                ctx.beginPath();
                ctx.moveTo(contour[0].x * scale + offsetX, contour[0].y * scale + offsetY);
                for (let i = 1; i < contour.length; i++) {
                    ctx.lineTo(contour[i].x * scale + offsetX, contour[i].y * scale + offsetY);
                }
                ctx.stroke();
            });
        }

        function renderShapes(shapesList, ctx) {
            if (!simData) return;
            const scale = Math.min(ctx.canvas.width / simData.width, ctx.canvas.height / simData.height);
            const offsetX = (ctx.canvas.width - simData.width * scale) / 2;
            const offsetY = (ctx.canvas.height - simData.height * scale) / 2;

            shapesList.forEach(s => {
                const sx = s.x * scale + offsetX;
                const sy = s.y * scale + offsetY;
                const sw = s.w * scale;
                const sh = s.h * scale;
                const angle = (s.rotation || 0) * Math.PI / 180;
                const cx = sx + sw / 2;
                const cy = sy + sh / 2;

                ctx.save();
                // 중심점 기준 도형 회전 좌표계 설정
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.translate(-cx, -cy);

                const strokeMm = 0.8;
                ctx.lineWidth = Math.max(1.5, scale * strokeMm);
                ctx.strokeStyle = "#000000";
                ctx.fillStyle = "rgba(0, 0, 0, 0.04)";

                ctx.beginPath();
                if (s.type === 'rect') {
                    ctx.rect(sx, sy, sw, sh);
                    ctx.stroke();
                    ctx.fill();
                } else if (s.type === 'circle') {
                    const rx = Math.abs(sw / 2);
                    const ry = Math.abs(sh / 2);
                    ctx.ellipse(sx + sw / 2, sy + sh / 2, rx, ry, 0, 0, 2 * Math.PI);
                    ctx.stroke();
                    ctx.fill();
                } else if (s.type === 'triangle') {
                    ctx.moveTo(sx + sw / 2, sy);
                    ctx.lineTo(sx + sw, sy + sh);
                    ctx.lineTo(sx, sy + sh);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.fill();
                } else if (s.type === 'line') {
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + sw, sy + sh);
                    ctx.stroke();
                } else if (s.type === 'text') {
                    const fontSize = Math.max(20, Math.abs(sh * 0.7));
                    ctx.font = `700 ${fontSize}px "Pretendard", -apple-system, sans-serif`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    
                    if (s.textMode === 'outline') {
                        // 윤곽선 모드: 글자의 외곽 테두리를 따라 그리는 모습 (이중선 strokeText)
                        ctx.strokeStyle = "#000000";
                        ctx.lineWidth = Math.max(1.5, Math.min(3, fontSize * 0.06));
                        ctx.strokeText(s.text || '', cx, cy);
                    } else {
                        // ㅡ 손글씨 1선 모드: 외곽선 없이 사람이 쓰는 듯한 꽉 찬 단일 글씨 모습 (fillText)
                        ctx.fillStyle = "#000000";
                        ctx.fillText(s.text || '', cx, cy);
                    }
                }

                // 선택 영역 활성화 점선 가이드 상자 및 조절자
                if (selectedShape && selectedShape.id === s.id) {
                    ctx.strokeStyle = "#ff4d4f";
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(sx - 4, sy - 4, sw + 8, sh + 8);
                    ctx.setLineDash([]); // 원복

                    // 4개 코너 빨간점 (크기 조절)
                    ctx.fillStyle = "#ff4d4f";
                    const handles = [
                        { x: sx - 4, y: sy - 4 },
                        { x: sx + sw + 4, y: sy - 4 },
                        { x: sx + sw + 4, y: sy + sh + 4 },
                        { x: sx - 4, y: sy + sh + 4 }
                    ];
                    handles.forEach(h => {
                        ctx.beginPath();
                        ctx.arc(h.x, h.y, 5, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    // 바운딩 박스의 실제 상단 Y좌표(topY) 계산 (도형이 뒤집혀도 상단 유지)
                    const topY = Math.min(sy - 4, sy + sh + 4);

                    // 1. 위 2개 점 가운데 (상단 중앙) 회전 버튼 (↻)
                    ctx.beginPath();
                    ctx.moveTo(cx, topY);
                    ctx.lineTo(cx, topY - 22);
                    ctx.strokeStyle = "#ff4d4f";
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(cx, topY - 22, 11, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffffff";
                    ctx.fill();
                    ctx.strokeStyle = "#cbd5e1";
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // 간단하고 직관적인 회전 화살표 ↻
                    ctx.font = "bold 13px sans-serif";
                    ctx.fillStyle = "#475569";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("↻", cx, topY - 22);

                    // 2. 오른쪽 위 (Top-Right) 위치 X 도형 삭제 버튼 (✕)
                    const delX = Math.max(sx - 4, sx + sw + 4);
                    const delY = topY;
                    ctx.beginPath();
                    ctx.arc(delX, delY, 11, 0, Math.PI * 2);
                    ctx.fillStyle = "#ff4d4f";
                    ctx.fill();

                    ctx.font = "bold 12px sans-serif";
                    ctx.fillStyle = "#ffffff";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("✕", delX, delY);

                    // 3. 텍스트 도형 전용 ㅡ / ㅁ 출력 모드 전환 버튼 (위치: X버튼 좌측)
                    if (s.type === 'text') {
                        const modeBtnX = delX - 34;
                        const modeBtnY = topY;
                        const isSingleLine = (s.textMode !== 'outline'); // 기본값: ㅡ 단일 획 손글씨 모드

                        const btnW = 30; // ㅁ 모양이 가로로 충분히 길게 보이도록 너비 확대
                        const btnH = 18;
                        const btnX = modeBtnX - btnW / 2;
                        const btnY = modeBtnY - btnH / 2;

                        ctx.beginPath();
                        if (ctx.roundRect) {
                            ctx.roundRect(btnX, btnY, btnW, btnH, 5);
                        } else {
                            ctx.rect(btnX, btnY, btnW, btnH);
                        }
                        ctx.fillStyle = "#ffffff";
                        ctx.fill();
                        ctx.strokeStyle = "#64748b"; // 파란색 테두리 대신 일관된 회색 테두리
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        ctx.font = "bold 13px sans-serif";
                        ctx.fillStyle = "#334155"; // 일관된 회색 아이콘 텍스트
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        const iconStr = isSingleLine ? "ㅡ" : "ㅁ";
                        ctx.fillText(iconStr, modeBtnX, modeBtnY);
                    }
                }

                ctx.restore();
            });
        }

        function checkShapeHit(clickX, clickY) {
            if (!simData) return null;
            const scale = Math.min(simCanvas.width / simData.width, simCanvas.height / simData.height);
            const offsetX = (simCanvas.width - simData.width * scale) / 2;
            const offsetY = (simCanvas.height - simData.height * scale) / 2;

            if (selectedShape) {
                const s = selectedShape;
                const sx = s.x * scale + offsetX;
                const sy = s.y * scale + offsetY;
                const sw = s.w * scale;
                const sh = s.h * scale;
                const angle = (s.rotation || 0) * Math.PI / 180;
                const cx = sx + sw / 2;
                const cy = sy + sh / 2;

                // 회전 전 로컬 좌표를 화면 픽셀 좌표로 회전 변환
                const getRotatedPt = (px, py) => {
                    const dx = px - cx;
                    const dy = py - cy;
                    return {
                        x: cx + dx * Math.cos(angle) - dy * Math.sin(angle),
                        y: cy + dx * Math.sin(angle) + dy * Math.cos(angle)
                    };
                };

                const topY = Math.min(sy - 4, sy + sh + 4);
                const delX = Math.max(sx - 4, sx + sw + 4);

                // 1. 우측 상단 X 삭제 버튼 검사 (가장 우선순위 - 터치 마진 24px)
                const delPt = getRotatedPt(delX, topY);
                if (Math.hypot(clickX - delPt.x, clickY - delPt.y) <= 24) {
                    dragMode = 'delete_btn';
                    return selectedShape;
                }

                // 1-1. 텍스트 모드(ㅡ 손글씨 vs ㅁ 윤곽선) 전환 버튼 검사 (X버튼 좌측 - 터치 마진 22px)
                if (s.type === 'text') {
                    const modePt = getRotatedPt(delX - 32, topY);
                    if (Math.hypot(clickX - modePt.x, clickY - modePt.y) <= 22) {
                        dragMode = 'text_mode_toggle';
                        return selectedShape;
                    }
                }

                // 2. 상단 중앙 회전 핸들 검사 (터치 마진 24px)
                const rotPt = getRotatedPt(cx, topY - 22);
                if (Math.hypot(clickX - rotPt.x, clickY - rotPt.y) <= 24) {
                    dragMode = 'rotate';
                    return selectedShape;
                }

                // 3. 4개 코너 크기 조절 핸들 검사 (터치 마진 22px)
                const handles = [
                    getRotatedPt(sx - 4, sy - 4),           // 0: Top-Left
                    getRotatedPt(sx + sw + 4, sy - 4),       // 1: Top-Right
                    getRotatedPt(sx + sw + 4, sy + sh + 4),   // 2: Bottom-Right
                    getRotatedPt(sx - 4, sy + sh + 4)        // 3: Bottom-Left
                ];
                for (let i = 0; i < handles.length; i++) {
                    if (Math.hypot(clickX - handles[i].x, clickY - handles[i].y) <= 22) {
                        dragMode = 'resize';
                        resizeHandleIdx = i;
                        return selectedShape;
                    }
                }
            }

            for (let i = shapes.length - 1; i >= 0; i--) {
                const s = shapes[i];
                const sx = s.x * scale + offsetX;
                const sy = s.y * scale + offsetY;
                const sw = s.w * scale;
                const sh = s.h * scale;

                // 클릭 지점을 도형 로컬(회전 보정) 좌표로 역변환하여 감지
                const angle = -(s.rotation || 0) * Math.PI / 180;
                const cx = sx + sw / 2;
                const cy = sy + sh / 2;
                const dx = clickX - cx;
                const dy = clickY - cy;
                const localX = cx + dx * Math.cos(angle) - dy * Math.sin(angle);
                const localY = cy + dx * Math.sin(angle) + dy * Math.cos(angle);

                const minX = Math.min(sx, sx + sw);
                const maxX = Math.max(sx, sx + sw);
                const minY = Math.min(sy, sy + sh);
                const maxY = Math.max(sy, sy + sh);

                if (localX >= minX - 10 && localX <= maxX + 10 && localY >= minY - 10 && localY <= maxY + 10) {
                    dragMode = 'move';
                    return s;
                }
            }
            return null;
        }

        function addShape(type) {
            if (!simData) return;
            saveHistoryState(); // 도형 추가 전 히스토리 저장
            setEditTool('shape');

            const defaultW = 80;
            const defaultH = 80;
            const defaultX = (simData.width - defaultW) / 2;
            const defaultY = (simData.height - defaultH) / 2;

            shapeIdCounter++;
            const newShape = {
                id: shapeIdCounter,
                type: type,
                x: defaultX,
                y: defaultY,
                w: defaultW,
                h: defaultH
            };

            shapes.push(newShape);
            selectedShape = newShape;
            updateDeleteBar();

            // 도형 추가 후 서브 팝업 메뉴만 닫고, 도형 조작(크기/위치 이동) 상태 유지
            const sPanel = document.getElementById('shape-picker-panel');
            if (sPanel) {
                sPanel.classList.remove('show');
                sPanel.style.display = 'none';
            }
            const popupTray = document.getElementById('popup-tray');
            if (popupTray) popupTray.classList.remove('has-popup');

            drawAll();
        }

            if (event) event.stopPropagation();
            const popover = document.getElementById('canvas-add-popover');
            if (popover) {
                popover.classList.toggle('show');
            }

        function triggerFileInput(event) {
            if (event) event.stopPropagation();
            const popover = document.getElementById('canvas-add-popover');
            if (popover) popover.classList.remove('show');

        async function promptAddText(event) {
            if (event) event.stopPropagation();
            const popover = document.getElementById('canvas-add-popover');
            if (popover) popover.classList.remove('show');

            const text = await showPromptModal('텍스트 입력', 'Vico AI');
            if (!text || text.trim() === '') return;

            if (!simData) {
                const isLandscapeNow = (overridePaperOrientation === 'landscape');
                simData = {
                    width: isLandscapeNow ? 800 : 600,
                    height: isLandscapeNow ? 600 : 800,
                    contours: []
                };
            }

            // 임시 Canvas로 텍스트 폭 측정하여 w, h 선명한 기본크기 구하기
            const tmpCanvas = document.createElement('canvas');
            const tmpCtx = tmpCanvas.getContext('2d');
            tmpCtx.font = "bold 44px sans-serif";
            const metrics = tmpCtx.measureText(text.trim());
            const textW = Math.max(140, Math.ceil(metrics.width) + 40);
            const textH = 75;

            const cx = simData.width / 2;
            const cy = simData.height / 2;

            saveHistoryState(); // 텍스트 추가 전 히스토리 기록

            shapeIdCounter++;
            const newShape = {
                id: shapeIdCounter,
                type: 'text',
                text: text.trim(),
                textMode: 'single', // 기본값: ㅡ 손글씨 1선 모드
                x: cx - textW / 2,
                y: cy - textH / 2,
                w: textW,
                h: textH,
                rotation: 0
            };

            shapes.push(newShape);
            selectedShape = newShape;
            setEditTool('shape'); // 텍스트 생성 후 자유로운 크기/위치 조작 모드로 자동 전환

            updateDeleteBar();
            drawAll();
        }

        function deleteSelectedShape() {
            if (selectedShape) {
                saveHistoryState(); // 도형 삭제 전 히스토리 저장
                shapes = shapes.filter(s => s.id !== selectedShape.id);
                selectedShape = null;
                updateDeleteBar();
                drawAll();
            } else {
                alert("삭제할 도형을 먼저 선택해 주세요.");
            }
        }

        function convertShapesToContours() {
            // shapeToContour()와 동일한 밀집 샘플링으로 변환 (지우개 부분 지우기 호환)
            const output = [];
            shapes.forEach(s => {
                const result = shapeToContour(s); // 80분할 밀집 혹은 다중 컨투어 반환
                if (result.length > 0) {
                    if (Array.isArray(result[0])) {
                        // 다중 컨투어 (텍스트 등)인 경우
                        result.forEach(pts => {
                            if (pts.length > 1) output.push(pts);
                        });
                    } else {
                        // 단일 컨투어 (기본 도형)인 경우
                        if (result.length > 1) output.push(result);
                    }
                }
            });
            return output;
        }

        function startEditing() {
            if (!simData) return;
            if (animationId) skipSimulation();

            // 1. 현재 벡터 데이터를 딥카피하여 수정용 배열로 준비
            activeContours = JSON.parse(JSON.stringify(simData.contours));
            shapes = [];
            selectedShape = null;

            // 2. 모드 변경 (툴바 레이아웃 반영) 후 캔버스 해상도 재계산 및 렌더링
            setMode('editing');
            resizeCanvas();
            inputCtx.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
            drawAll();
        }

        async function confirmEditing() {
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            // 도형 변환 병합
            const shapesContours = convertShapesToContours();
            activeContours = activeContours.concat(shapesContours);
            shapes = [];
            selectedShape = null;

            // 길이가 2 미만인 점들은 무시
            simData.contours = activeContours.filter(c => c.length > 1);

            try {
                // 이미지를 다시 보내지 않고, 수정된 벡터 데이터를 통해 G-Code만 업데이트
                const response = await fetch('/api/update-gcode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        width: simData.width,
                        height: simData.height,
                        contours: simData.contours
                    })
                });

                const result = await response.json();
                progressBar.style.width = '100%';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 500);

                if (result.status === 'success') {
                    simData.gcode = result.gcode;
                    setMode('simulating'); // 버튼만 수정/전송으로 전환, 캔버스는 유지
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                progressContainer.style.display = 'none';
                await showAlert("수정 업데이트 실패: " + err.message);
            }
        }

        async function uploadToQueue() {
            // 아직 병합되지 않은 도형/글씨(Text)가 남아있을 경우 contours 벡터로 통합 병합
            if (shapes && shapes.length > 0) {
                const shapesContours = convertShapesToContours();
                if (!simData) {
                    const isLandscapeNow = (overridePaperOrientation === 'landscape');
                    simData = {
                        width: isLandscapeNow ? 800 : 600,
                        height: isLandscapeNow ? 600 : 800,
                        contours: []
                    };
                }
                simData.contours = (simData.contours || []).concat(shapesContours);
                shapes = [];
                selectedShape = null;
            }

            if (!simData || !simData.contours || simData.contours.length === 0) {
                await showAlert("전송할 데이터가 없습니다.");
                return;
            }

            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            try {
                const finalContours = simData.contours;

                // 최신 G-Code 생성
                const updateRes = await fetch('/api/update-gcode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        width: simData.width,
                        height: simData.height,
                        contours: finalContours
                    })
                });
                const updateResult = await updateRes.json();
                if (updateResult.status === 'success') {
                    simData.gcode = updateResult.gcode;
                } else {
                    throw new Error(updateResult.message || "G-Code 생성에 실패했습니다.");
                }

                progressBar.style.width = '70%';

                const response = await fetch('/api/push-task', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        gcode: simData.gcode,
                        contours: finalContours,
                        width: simData.width,
                        height: simData.height
                    })
                });

                if (!response.ok) {
                    const errorDetail = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorDetail}`);
                }

                const result = await response.json();

                if (result.status === 'success') {
                    progressBar.style.width = '100%';
                    setTimeout(async () => {
                        progressContainer.style.display = 'none';
                        await showAlert("전송 완료! (Task ID: " + result.task_id + ")");
                    }, 500);
                } else {
                    throw new Error(result.message || "서버에서 실패 응답을 보냈습니다.");
                }
            } catch (err) {
                progressContainer.style.display = 'none';
                console.error("Upload Error:", err);
                await showAlert("전송 오류: " + err.message);
            }
        }

        async function confirmDrawing() {
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            // 도형 변환 병합
            const shapesContours = convertShapesToContours();
            activeContours = activeContours.concat(shapesContours);
            shapes = [];
            selectedShape = null;

            // 길이가 2 미만인 점들은 무시
            simData.contours = activeContours.filter(c => c.length > 1);

            try {
                // 직접 수집된 정교한 벡터 직선 데이터로 G-Code 생성 요청
                const response = await fetch('/api/update-gcode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        width: simData.width,
                        height: simData.height,
                        contours: simData.contours
                    })
                });

                const result = await response.json();
                progressBar.style.width = '100%';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 500);

                if (result.status === 'success') {
                    simData.gcode = result.gcode;
                    setMode('simulating'); // 버튼만 수정/전송으로 전환, 캔버스는 유지
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                progressContainer.style.display = 'none';
                alert("드로잉 벡터 G-Code 생성 실패: " + err.message);
            }
        }

        async function processImage(imageBlob, isDrawing = false) {
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');

            // 프로그레스 바 시작
            progressContainer.style.display = 'block';
            progressBar.style.width = '10%';

            try {
                // 1. 이미지 최적화 (모바일 고화질 대응)
                const optimizedBlob = await resizeImage(imageBlob, 1024);
                progressBar.style.width = '30%';

                const formData = new FormData();
                formData.append('file', optimizedBlob, 'image.jpg');
                formData.append('is_drawing', isDrawing);

                // 가짜 프로그레스 애니메이션
                let progress = 30;
                const progressInterval = setInterval(() => {
                    if (progress < 90) {
                        progress += (90 - progress) * 0.1;
                        progressBar.style.width = progress + '%';
                    }
                }, 200);

                const response = await fetch('/api/process-image', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                clearInterval(progressInterval);
                progressBar.style.width = '100%';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 500);

                if (data.error) throw new Error(data.error);
                if (!data.contours || data.contours.length === 0) {
                    alert("추출된 선이 없습니다. 더 명확하게 그려주세요.");
                    setMode('drawing');
                    return;
                }

                simData = data;
                activeContours = simData.contours; // 추출된 벡터 선을 라이브 펜/지우개 편집 배열과 즉시 동기화
                startSimulation(data);
            } catch (err) {
                progressContainer.style.display = 'none';
                console.error(err);
                alert("처리 중 오류가 발생했습니다: " + err.message);
                setMode('idle');
            }
        }

        // 이미지 크기 조절 함수
        function resizeImage(blob, maxSize) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxSize) {
                            height *= maxSize / width;
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width *= maxSize / height;
                            height = maxSize;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((result) => resolve(result), 'image/jpeg', 0.8);
                };
                img.src = URL.createObjectURL(blob);
            });
        }

        // 이미지 업로드 시에도 호출
        function startUpload() {
            if (fileInput.files[0]) {
                processImage(fileInput.files[0]);
            }
        }

        // 종이 자르기 가이드 (세로/가로 비율 반영) 렌더링 함수
        function getPaperCropRect() {
            if (!simCanvas.width || !simCanvas.height) return null;
            const isPortrait = simCanvas.height >= simCanvas.width;
            // 세로모드: 138(가로) x 200(세로), 가로모드: 200(가로) x 138(세로)
            const targetRatio = isPortrait ? (138 / 200) : (200 / 138);
            const canvasRatio = simCanvas.width / simCanvas.height;

            let rectW, rectH;
            if (canvasRatio > targetRatio) {
                rectH = simCanvas.height * 0.9;
                rectW = rectH * targetRatio;
            } else {
                rectW = simCanvas.width * 0.9;
                rectH = rectW / targetRatio;
            }
            const rectX = (simCanvas.width - rectW) / 2;
            const rectY = (simCanvas.height - rectH) / 2;
            return { x: rectX, y: rectY, w: rectW, h: rectH, isPortrait };
        }

        function drawPaperCropOverlay() {
            if (mode !== 'simulating') return;
            const crop = getPaperCropRect();
            if (!crop) return;

            simCtx.save();
            // 종이 영역 테두리 (점선 가이드)
            simCtx.strokeStyle = "rgba(74, 144, 226, 0.6)";
            simCtx.lineWidth = 2;
            simCtx.setLineDash([6, 4]);
            simCtx.strokeRect(crop.x, crop.y, crop.w, crop.h);

            // 종이 바깥 어두운 마스킹
            simCtx.fillStyle = "rgba(0, 0, 0, 0.25)";
            // Top
            simCtx.fillRect(0, 0, simCanvas.width, crop.y);
            // Bottom
            simCtx.fillRect(0, crop.y + crop.h, simCanvas.width, simCanvas.height - (crop.y + crop.h));
            // Left
            simCtx.fillRect(0, crop.y, crop.x, crop.h);
            // Right
            simCtx.fillRect(crop.x + crop.w, crop.y, simCanvas.width - (crop.x + crop.w), crop.h);

            simCtx.restore();
        }

        // 시뮬레이션 로직
        function startSimulation(data) {
            setMode('simulating');
            if (animationId) cancelAnimationFrame(animationId);

            document.getElementById('skip-button').style.display = 'block'; // 시뮬레이션 시작 시 버튼 표시

            const container = document.getElementById('canvas-container');
            if (container) {
                simCanvas.width = container.offsetWidth || 800;
                simCanvas.height = container.offsetHeight || 600;
            }

            // 비율 계산
            const scale = Math.min(simCanvas.width / data.width, simCanvas.height / data.height);
            const offsetX = (simCanvas.width - data.width * scale) / 2;
            const offsetY = (simCanvas.height - data.height * scale) / 2;

            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            simCtx.lineCap = 'round';
            simCtx.lineJoin = 'round';

            let contourIdx = 0;
            let pointIdx = 0;
            const speed = 30;

            const crop = getPaperCropRect();

            function animate() {
                if (mode !== 'simulating') return;

                if (contourIdx >= data.contours.length) {
                    animationId = null;
                    document.getElementById('skip-button').style.display = 'none';
                    drawPaperCropOverlay();
                    return;
                }

                for (let i = 0; i < speed; i++) {
                    if (contourIdx >= data.contours.length) break;

                    const contour = data.contours[contourIdx];
                    if (pointIdx === 0) {
                        // pass
                    } else {
                        const p1x = contour[pointIdx - 1].x * scale + offsetX;
                        const p1y = contour[pointIdx - 1].y * scale + offsetY;
                        const p2x = contour[pointIdx].x * scale + offsetX;
                        const p2y = contour[pointIdx].y * scale + offsetY;

                        const midX = (p1x + p2x) / 2;
                        const midY = (p1y + p2y) / 2;
                        const isInside = crop && (midX >= crop.x && midX <= crop.x + crop.w && midY >= crop.y && midY <= crop.y + crop.h);

                        simCtx.beginPath();
                        simCtx.moveTo(p1x, p1y);
                        simCtx.lineTo(p2x, p2y);
                        if (isInside) {
                            simCtx.strokeStyle = "#4a90e2";
                            simCtx.lineWidth = (lastInputMode === 'drawing') ? 4 : 2;
                        } else {
                            simCtx.strokeStyle = "rgba(74, 144, 226, 0.25)";
                            simCtx.lineWidth = 1.5;
                        }
                        simCtx.stroke();
                    }

                    pointIdx++;
                    if (pointIdx >= contour.length) {
                        contourIdx++;
                        pointIdx = 0;
                    }
                }
                animationId = requestAnimationFrame(animate);
            }
            animationId = requestAnimationFrame(animate);
        }

        function skipSimulation() {
            if (animationId) cancelAnimationFrame(animationId);
            const data = simData;
            if (!data) return;

            const scale = Math.min(simCanvas.width / data.width, simCanvas.height / data.height);
            const offsetX = (simCanvas.width - data.width * scale) / 2;
            const offsetY = (simCanvas.height - data.height * scale) / 2;

            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            simCtx.lineCap = 'round';
            simCtx.lineJoin = 'round';

            const crop = getPaperCropRect();

            data.contours.forEach(contour => {
                for (let i = 1; i < contour.length; i++) {
                    const p1x = contour[i - 1].x * scale + offsetX;
                    const p1y = contour[i - 1].y * scale + offsetY;
                    const p2x = contour[i].x * scale + offsetX;
                    const p2y = contour[i].y * scale + offsetY;

                    const midX = (p1x + p2x) / 2;
                    const midY = (p1y + p2y) / 2;
                    const isInside = crop && (midX >= crop.x && midX <= crop.x + crop.w && midY >= crop.y && midY <= crop.y + crop.h);

                    simCtx.beginPath();
                    simCtx.moveTo(p1x, p1y);
                    simCtx.lineTo(p2x, p2y);
                    if (isInside) {
                        simCtx.strokeStyle = "#4a90e2";
                        simCtx.lineWidth = (lastInputMode === 'drawing') ? 4 : 2;
                    } else {
                        simCtx.strokeStyle = "rgba(74, 144, 226, 0.25)";
                        simCtx.lineWidth = 1.5;
                    }
                    simCtx.stroke();
                }
            });

            drawPaperCropOverlay();
            animationId = null;
            document.getElementById('skip-button').style.display = 'none';
        }

        function cancelSimulation() {
            if (animationId) cancelAnimationFrame(animationId);
            animationId = null;
        }
    </script>
